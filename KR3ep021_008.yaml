body:
  text: 評選愛廬醫案內傷雜病門案二條病經匝月表熱解後杳不思納脈靜舌淨神倦言懶既無外感留戀又非老景頽唐睛光流動面色開曠問所服之藥苦寒沉降者多矣諒系胃氣為藥所困非病也亦非衰也且進和中醒中以悅脾胃令其納穀乃昌人參鬚五分炒麥冬一錢炒橘白五分北沙參三錢甘草三分霍石斛三錢生穀芽一兩煎湯代水野薔薇露一兩沖服服藥後令煮糜粥以備半夜病人思納切囑不可多與詒按此方清潤有餘尚缺流動如胃氣呆鈍稍加香砂胃有寒涎稍增姜夏欲專和胃加扁豆蓮子欲兼和肝加木瓜烏梅均可於此方隨宜增入也再診胃氣乍醒脈形軟弱久飢之後臟腑之氣尚微納穀以勻為穩至於用藥尚利輕靈須俟胃氣日隆方可峻補蓋凡投補劑必藉胃氣敷布故也經云百病以胃氣為本又云安穀則昌其斯之謂歟人參鬚一錢益智仁四分炙甘草三分石斛三錢茯神三錢南棗兩枚北沙參三錢炒麥冬一錢五分橘白七分香穀芽一兩詒按名言至理凡進補劑者須識此意竟日悲思半載納減詢非惱怒感觸所致在病人亦不知悲從何來一若放聲號泣乃能爽快睡醒之際特甚余如默坐亦然韓昌黎云凡人之歌也有思哭也有懷出於口而為聲者其皆有不平者乎夫悲哀屬肺寢則氣窒醒則流通想其乍醒之際應通而猶窒焉是以特甚揆之脈象右寸細數而小滑伏火挾痰有諸或更有所驚恐驚則氣結結則成痹痹則升降失常出納呆鈍胃氣所以日餒耳擬以開結通痹為先毋急急於補也旋覆花一錢五分元參一錢炒竹茹一錢五分栝蔞皮一錢五分薤白頭三錢紫菀七分橘絡一錢安息香三枝生鐵落兩許用鐵錘於擂盆內和開水研至數百轉取汁衝入一小杯詒按推想病情思路曲折以達再診兩進開結通痹之後悲哀之態頓釋咯痰黃厚胃納稍思脈之滑數亦緩其為痰火痹結也明矣擬以清泄通降繼之補不可投豈妄談哉炙桑皮一錢五分炒竹茹一錢五分栝蔞霜一錢五分杏仁三錢黑梔一錢五分丹皮一錢五分橘絡一錢冬瓜子三錢紫菀五分絲瓜絡一錢內風門案一條眩暈多年每發於濕蒸之令今年初夏潮濕過重發亦頻頻診脈濡細舌苔膩白考古法眩暈一症概從內經諸風掉眩皆屬於肝之論大旨不外乎風陽上旋更辨別挾火挾痰以治之今按脈症乃濕鬱上泛挾濁痰膩膈所致因前人未經論及而臨症亦罕見也擬辛香運中以化濕化痰主之製厚朴一錢煨草果四分炒蘇子一錢五分旋覆花一錢五分茅朮一錢製半夏一錢五分陳皮一錢白芥子七分椒目五分赤苓三錢詒按所論病機極合方中尚宜參入清泄肝陽之品如白芍蒺藜之類方穩蘇子似不必用又按黃坤載四聖心源中論此等症最詳每以木燥土濕為言勿謂前人未及也再診眩暈不復作舌白依然脈濡便溏脘中較爽信系體肥多濕嗜酒多濕臥於地坑之上亦感濕好飲冷茶亦停濕倘泥於古法而投滋降不亦遠乎再擬昨方加減仍守太陰陽明主治茅朮一錢煨草果五分製半夏一錢五分土炒白朮一錢五分佩蘭葉一錢五分製厚朴一錢旋覆花一錢五分藿梗一錢五分陳皮一錢通草一錢詒按眩暈由於濕痰壅遏者亦所時有然其中必有木火內郁為痰濁所蔽治當於疏化濕痰之中仍參清泄之品乃合濕病門案一條形凜汗漬脈濡神糊舌如傅粉沉睡痰迷素系嗜酒之體濕痰瀰漫蒙遏清陽擾亂神明所致非陷也亦非閉也慎勿開泄擬達原飲意製厚朴一錢五分煨草果五分枳實四分磨沖炒陳皮一錢五分茅朮一錢五分白芷一錢法半夏一錢五分山茨菰五分磨沖詒按論病確鑿方亦的當宜其效若桴鼓也再診汗漬已收神志轉清藥後嘔痰盈碗嘔出漸醒脈猶濡細舌苔白膩瀰漫之勢雖除尚宜燥濕祛痰從太陰陽明主治茅朮一錢煨草果三分製半夏一錢五分椒目五分厚朴一錢炒青皮一錢白朮一錢五分陳皮一錢通草一錢白芥子一錢失血門案一條鼻衄盛發成流不止者已三日面赤足冷至膝脈數寸關尤甚血去過多心蕩神馳陰虧內熱之體厥陽化火上逆擾動脈絡血行清道從高灌注而下非若吐紅之易定血有幾何豈堪如此長流擬仿志火升騰治例用涼血滋降法犀角七分炒女貞子一錢五分黃連五分熟地六錢青鉛一枚炙龜板一兩旱蓮草一錢煨磁石五錢阿膠一錢五分蛤粉拌炒鹹水炒牛膝一錢五分詒按此症甚險用藥尚稱得力方中當加童便衝入再診鼻衄雖止而面色唇口㿠白虛陽雖降而額汗心悸畏明脈虛而數舌光而顫氣乏血涵血無氣護陰陽有離脫之象氣血有渙散之險急進雙補法庶幾有所依附再佐咸降酸收以攝之人參一錢天冬一錢五分炒棗仁三錢秋石二分煬入熟地一兩枸杞炭三錢白芍一錢五分阿膠一錢五分茯神三錢大棗二枚消症門案一條乍納又飢消爍迅速如火之燎於原遇物即為灰燼病此半月肌肉盡削詢系失意事多焦勞苦思內火日熾胃液日乾藏陰既損而充斥之威愈難撲滅耳姑擬玉女煎加味大生地一兩麥冬三錢元參一錢五分阿膠一錢五分知母二錢石膏一兩炒白芍一錢五分女貞子一錢五分旱蓮草一錢甘草一錢再診兩進甘涼救液大勢僅減二三渴飲反甚溲渾而濁上中之消又轉到腎消矣三焦兼涉津液必至告竭症情極險再擬從治之法宗河間甘露法必得十減七八乃幸熟地六錢石膏七錢肉桂五分生地八錢麥冬三錢炙草五分白芍一錢五分人參一錢鹹水炒黃柏一錢五分三診從治之法始也依然藥三進而納日退矣小水渾濁轉清舌苔光紅亦淡擬宗前方小其制仍與上中下三焦並治熟地八錢烏梅三分炙草五分川連五分川椒二十粒生地四錢肉桂三分人參一錢麥冬二錢四診連進固本從治之法並參苦辛酸安胃允推應手今胃納安常諸恙皆平而津液受傷已極善後之法自當立中育陰以冀其復人參一錢熟地五錢天冬一錢五分洋參一錢五錢北沙參三錢知母一錢五分麥冬一錢五分石斛四錢炙草三分詒按第一方力量之大二方立法之巧三四方用意之周匝隨機而應步伐井然具此見解庶可談醫然已難其人矣嘔逆門案一條惱怒傷肝木火犯胃入膈支撐胸背嘔吐血塊痰涎不納不便舌白苔膩胃為水穀之海多氣多血之府性喜通降所畏倒逆經此氣火沖激濕濁乘機錯亂倘肆其猖狂厥勢立至若再侮脾土脹滿必增左脈弦硬右脈細軟谷不沾唇者已五日胃氣憊矣而嘔尚甚中無砥柱何恃而不恐諸先生所進苦寒沉降蓋欲止其嘔而順其氣誠是理也然內經云百病皆以胃氣為本苦寒性味又屬伐胃胃不能安藥力何藉拙擬苦寒以制肝之逆苦辛以通胃之陽而必參以奠安中氣庶幾倒逆之勢得緩幸勿拘於見血畏溫之議人參一錢吳萸二分旋覆花一錢五分川楝子七分川椒二分法半夏一錢五分茯苓二錢川連三分另肉桂四分酒炒龍膽草三分二味同研飯丸煎藥送下詒按論病頗有卓見立方亦穩惟丸方肉桂合龍膽一寒一熱似不如肉桂合川連取交濟之意更佳再診嘔逆已止脹痛亦緩左脈弦硬固平右脈歇止漸見土德大殘中氣亦竭急進補中立中仍參約脾制肝之法惟望胃納能醒是幸人參一錢五分肉桂三分炙甘草三分白朮一錢五分茯苓三錢炒白芍一錢五分詒按此建中合四君法三診脹痛大減嘔逆未平稍能納粥脈俱濡細胃氣漸有來復之機經云納穀則昌信不誣也人參一錢煨肉果三分白芍一錢五分橘白七分白朮一錢五分炙甘草三分煨木香三分茯神三錢穀芽一兩詒按此養胃和中善後之方外感門案三條得食則嘔已延月餘形神疲乏宛如膈症聽其言觀其人惟知明而動晦而休務農無怠者流診左關脈數右關細軟舌白口苦寒熱往來汗之有無病者不知蓋少陽見症原有嘔惡揆其病情是任其嘔逆以致反胃厭谷胃氣日逆似乎噎膈實由邪蘊於少陽一經胃被邪克氣不通達據是脈症宜先泄少陽之邪為要擬小柴胡法佐以辛通柴胡七分製半夏一錢五分製厚朴七分蘇葉七分蘇子一錢炒川椒二分橘皮一錢青皮一錢淡姜渣五分後入詒按治病不難難在探取病情能得真諦再診前方囑服兩劑據述服後壯熱大汗濕透衣被即思納粥因其效驗連服一劑今已吃飯惟力不充耳診其脈左關已軟右脈尚細續與和中黨參三錢歸身一錢續斷一錢白朮一錢茯苓三錢陳皮一錢炙甘草三分前胡三分煨木香三分詒按方中歸身續斷似非此症所宜發熱惡寒頭項強痛無汗胸痞脈浮緊細症屬正傷寒南方所罕見詢系連朝營墓辛勤屆在嚴寒又居曠野太陽表症悉具宗仲聖不汗出而煩躁者大青龍湯主之麻黃五分桂枝五分防風一錢杏仁三錢甘草四分羌活七分生石膏三錢生薑五分大棗二枚詒按症在初起似不必遽用石膏就案中所述乃麻黃湯的症再診病甫兩日太陽症未罷而陽明少陽症已悉具可知南人稟賦柔弱其傳經之迅速若此汗既未暢擬三陽並泄麻黃四分柴胡四分白芷七分葛根七分羌活五分杏仁三錢連翹一錢五分黑山梔一錢五分姜渣五分大棗三枚三診汗暢熱解煩躁已除脈轉細小形疲體酸嗜臥而思納穀矣其發也凶悍其傳也迅速其退也亦易易究屬質弱者易感易達不若北方風氣剛徑稟賦厚而腠理實必至傳遍六經乃已是症若宗三時六氣治之勢必淹纏幾候耳擬和營衛法桂枝四分橘白一錢姜渣三分防風七分茯苓三錢桑枝五錢秦艽一錢五分大棗二錢詒按南方少正傷寒症方案雖平淺宜存之以擴聞見表熱九日有汗不解舌絳起刺煩渴引飲間作寒戰之象熱甚下午至夜神志時糊脈洪無力陽明經分之邪又傳少陽陽明府分之滯灼傷津液極似大柴胡症而與脈情不符細繹病情正虛津竭既非陷里之神糊如何香開致使內傳欲其府滯能通必俟津回液復擬宗仲聖人參白虎湯意參入景嶽柴胡煎庶與脈症符合諸先生以為何如參鬚一錢柴胡四分石膏七錢鮮石斛七錢元參一錢竹葉三錢麥冬一錢五分黑山梔一錢五分知母一錢五分詒按於虛實進退之間慘淡經營良工心苦再診汗熱煩渴已減舌絳淡而尖刺已少津液稍回正氣較振脈數未平神志已爽少陽陽明之表分既清既泄而府分之滯尚待清潤育陰而下也切勿因滯而遽投蕩滌審症二字其難其慎臨時應變平日之工夫也生地四錢知母一錢五分銀花一錢五分赤芍一錢五分麻仁三錢栝蔞仁三錢花粉一錢五分丹皮一錢五分鮮霍石斛一兩詒按此取增液以行宿滯之意伏氣門案一條表熱四候額汗如淋汗時膚冷汗收熱灼消滯泄邪清補諸法已遍嘗矣診脈虛細惟尺獨滑舌苔已淨胃納稍思細繹脈症病邪不在三陽而在三陰考仲聖有反發熱一條是寒邪深伏少陰之陽分今乃濕溫餘邪流入少陰之陰分良由少年腎氣不藏所致治當宗其旨變其法擬補腎陰泄腎邪一舉兩得庶可許熱解汗收熟地五錢枸杞炭一錢獨活一錢五分茯苓三錢五味子七粒細辛三分牛膝五分丹皮一錢詒按能從對面勘出此為善讀書人惟方中熟地似不如生地為得再診熱解已淨自汗亦收脈滑已和純乎軟弱神情向倦而虛象旋著擬轉用補養參鬚一錢枸杞子一錢山藥三錢丹皮一錢五分福澤瀉一錢熟地五錢杜仲三錢茯苓三錢牡蠣七錢萸肉一錢五分炙草三分疫邪門案一條壯熱神糊陡然而發脈數大而混糊無序舌垢膩而層疊厚布矢氣頻轉小溲自遺脘腹痞硬氣粗痰鳴既非尋常六氣所感亦非真中類中之症觀其濈濈自汗汗熱而不黏指轉側自如四體無強直之態舌能伸縮斷非中風設使外感何至一發便劇而安能自汗倘守傷寒先表后里下不嫌遲之例是坐待其斃矣亦曾讀吳又可先里後表急下存陰之論否蓋是症也一見藍癍則胃已爛而包絡已陷迅速異常盍早議下尚可僥幸諸同學以為然否厚朴一錢大黃八錢黃芩一錢枳實一錢檳榔一錢草果四分知母一錢五分陳皮一錢詒按論症明確方亦老當絶無幫貼膚湊之弊再診神志得清表熱自汗腹猶拒按矢氣尚頻便下黏膩極穢者未暢小水點滴如油脈數略有次序舌苔層布垢濁胃中穢濁蒸蘊之勢尚形燔灼必須再下俟里滯漸楚然後退就於表吳又可治疫之論闡發前人所未備甚至有三四下而後退走表分者若作尋常發熱論治豈不謬乎大黃五錢枳實一錢五分銀花二錢知母一錢五分細川連五分丹皮一錢五分滑石三錢元明粉一錢五分厚朴一錢詒按此等症有下至三四次而後清者必須有膽有識方能奏功後二方亦層次井井的是老手三診大腑暢通悉是如醬如飴極穢之物腹已軟而神已爽表熱壯而汗反艱舌苔半化脈數較緩渴喜熱飲小水稍多此際腑中之蒸變乍平病已退出表分當從表分疏通先里後表之論信不誣也柴胡五分枳實一錢通草一錢紫厚朴七分法半夏一錢五分連翹一錢五分橘皮一錢赤苓三錢大腹皮一錢五分藿香一錢四診表熱隨汗就和舌苔又化一層脈轉細矣神亦倦矣病去正虛之際當主以和養中氣佐輕泄以滌餘熱守糜粥以俟胃醒慎勿以虛而早投補劑補之則反覆立至也桑葉一錢五分石斛三錢扁豆三錢神麯一錢五分丹皮一錢五分豆卷三錢甘草三分橘白一錢薏仁三錢半夏曲一錢五分瘧疾門案一條間瘧止後復發發不歸期或二三日或七八日發則寒戰熱甚兩三月如此從無汗泄脈沉而細形瘦骨立胃納式微症由久瘧傷陰陰損不復其為勞瘧顯然現屆夏令已得可汗之時且服存陰泄邪以冀汗泄於表陰復於裡轉准瘧期庶有畔岸可依擬少陽少陰並治柴胡四分大生地四錢地骨皮三錢黃芩一錢五分鱉甲七錢青蒿一錢五分歸鬚一錢細辛三分丹皮一錢五分詒按此病若認作虛症而投膩補則愈補愈熱不死不休矣幸遇明眼人識破乃能得此生機再診藥四服而值瘧來寒戰依然熱勢轉短熱退時汗已暢達脈沉轉出神氣覺爽而食物有味察其轉輕之象皆從汗後究由外感乘虛蘊伏愈伏愈深延為怯象茲有向外泄化之機仍宗前議加減必得轉為間瘧乃安黃芩一錢五分炒歸鬚一錢五分炒知母一錢五分青蒿一錢五分鱉血炒柴胡五分丹皮一錢五分炒秦艽一錢五分小生地四錢荊芥炭一錢豆卷三錢詒按得汗即是生機仍可用大生地歸身以助陰達邪三診瘧准日作解後有汗寒熱之勢大減矣脈形細小舌不生苔久瘧陰傷復其陰可耳症屬轉機已得坦途凡腥膻鮮發以及麥食等均須慎禁擬清養法參以泄化洋參一錢五分桑葉一錢五分炙鱉甲一兩石斛三錢丹皮一錢青蒿一錢五分穭豆衣二錢穀芽一兩秦艽一錢五分詒按此善後之法凡歸地等養陰之品似不可少黃疸門案一條疸症多種黑者屬腎腎氣過損者曰女勞黑疸今肌膚舌質盡黑手指映日俱黯強壯之年腎陽早已不舉體雖豐腴腰軟不耐久坐脈弱神疲納減足冷顯屬腎臟傷殘太甚尚謂北路風霜所致乎昔有人患此遍處醫治皆曰風毒後遇顧西疇道破症名宗濕熱流入腎經主治試以此症較之症雖同而虛實又異矣現屆深冬姑先治本需春暖陽和再商他法血餘四兩豬油一斤熬至發枯取油盛貯一切食物中可以用油者俱用之煎方製附子七分炒枸杞一錢五分炒黃柏一錢菟絲子一錢五分茯苓三錢牡蠣七錢茵陳一錢五分杜仲三錢熟地六錢再診前方已服二十餘劑肌膚之黑半化其勢漸轉陰黃形神大振胃納加餐且可耐勞理事矣春令雖交和暖未回再擬補養脾腎耐性攝養為屬人參一錢沙苑三錢山藥三錢杜仲三錢熟地一兩茯苓三錢白朮一錢五分茵陳一錢五分杞子一錢五分續斷三錢菟絲二錢澤瀉一錢五分詒按此方中亦當再添溫潤之藥三診膚色花斑症轉陰黃較之黑疸淺一層矣培植脾腎之藥已進四十餘劑形神色脈俱屬平善節令將交驚蟄春暖之氣已和治當開泄腠理以滌膚斑內經云必先歲氣毋伐天和易曰待時而動何不利之有擬宗仲聖茵陳四逆法加減三劑即停接服丸藥可耳黑色退盡之時當在夏初製附子五分白朮一錢五分赤小豆三錢麻黃五分炒黃柏一錢茵陳一錢五分連皮苓五錢詒按此症即非冬時亦當先以溫煦脾腎為主務使身中陽和之氣漸漸煦動然後投以此劑方能奏效接服丸方未見擬八味丸去萸桂加朮柏此病症情頗奧治法亦奇腹痛門案一條脾腎之陽素虧醉飽之日偏多腹痛拒按自汗如雨大便三日未行舌垢膩脈沉實濕痰食滯團結於內非下不通而涉及陽虛之體又非溫不動許學士溫下之法原從仲聖大實痛之例化出今當宗之製附子五分肉桂四分乾薑五分生大黃四錢枳實一錢五分厚朴一錢詒按論病立方如良工制器極朴屬微至之妙再診大府暢行痛止汗收神思倦而脈轉虛細擬養胃和中北沙參三錢甘草三分橘白一錢白扁豆三錢丹皮一錢五分石斛三錢白芍一錢腫脹門案一條旬日內遍體俱腫膚色鮮明始也原有身熱不慎風而即止亦無汗泄診脈浮緊氣喘促小便閉舌白不思飲症系水濕之邪藉風氣而鼓行經隧是以最捷倘喘甚氣塞亦屬至危之道治當以開鬼門潔淨府為要著麻黃五分杏仁三錢赤苓三錢蘇子二錢桂木五分薏仁三錢紫菀七分椒目五分浮萍一錢五分大腹皮一錢五分外用麻黃紫蘇羌活浮萍生薑防風各五錢閉戶煎湯遍體揩尉不可冒風詒按病名風水立方清靈流動頗得輕可去實之旨瘕癖門案一條少腹塊磊上攻及脘其力猛而痛勢劇轉瞬之間腹中鳴響則塊磊一陳向下即平症名奔豚者因其性情蹤跡行止類似江豚耳然考其症有三犯肺之賁豚屬心火犯心之賁豚屬腎寒臍下悸欲作賁豚者屬水邪今系腎水寒邪所發體屬陽虧所致擬以真武湯參賁豚湯意茯苓五錢川芎五分小茴五分歸尾一錢附子五分白芍一錢半夏一錢五分橘核三錢李根皮一兩詒按案語明辨以晰立方精切不浮痢疾門案二條腹痛下痢晝夜無度汗冷肢冷脈細舌白暑濕熱挾滯互結病經五日不減嗜酒中虛之體邪不能化熱外達而見多汗傷陽多痢傷陰之險凡裡急後重腹痛者治法宜通口燥煩躁溲祕者又當清滲此症中陽先餒不能托化邪滯未動虛波已至誠屬棘手姑擬溫清並進宗瀉心湯意參以疏邪化滯若正氣保和之類何足恃耶製附子五分厚朴七分桂木五分藿梗一錢五分建曲一錢五分赤苓三錢木香三分姜渣三分酒炒黃連五分詒按此正虛不能托邪之症若僅與苦寒香燥痢門之套藥烏能挽回前後三方扶陽托邪選藥俱絲絲入扣所以奏效再診下痢減半赤白相雜肢冷較和汗亦稀少舌白苔膩不化裡急後重已緩診脈沉細腹中猶痛究屬中虛濕勝暑積阻結不能藉陽和運動尚非坦途再擬溫中運邪一法製附子五分厚朴七分黃連三分白朮一錢五分淡乾薑四分防風一錢木香三分枳實七分丹皮一錢赤苓三錢三疹痢下大減舌苔漸化腹痛除而宿垢亦通小溲赤而兩三度脈象起矣穀食思矣中陽既得運動無慮邪滯不化也尚當和中白朮一錢五分佩蘭一錢青皮七分藿梗一錢五分建曲一錢五分厚朴七分扁豆三錢桔梗五分肉果四分滑石三錢苡仁三錢暑濕熱病下痢始系赤白垢膩晝夜數十餘次旬日後痢雖減而純下血矣傷及肝腎病情最深非易治者姑先清熱存陰宗厥陰下痢之條擬白頭翁湯合黃連阿膠湯意白頭翁三錢秦皮一錢五分丹皮一錢五分黃連一錢地榆炭二錢白芍一錢五分荷蒂三個炒黃柏一錢阿膠蛤粉拌炒一錢五分詒按方論俱明當再診下血較昨減半而其來必陳下腸中滑泄已甚關閘盡撤腎氣有下脫之慮擬用昨方參桃花湯意赤石脂四錢地榆一錢乾薑炭五分白芍一錢五分丹皮一錢阿膠蛤粉拌炒一錢五分炙草三分炒黃柏一錢粳米四錢黃連四分詒按病雖稍減尚繫緊要關頭不可鬆手三診血下緩而大減脈微神倦氣陰並乏矣堵塞存陰之藥尚不可撤擬就昨方加立中意原方加人參一錢另煎衝入大便門案一條大小便易位而出症名交腸當得之大怒大飽之後氣火錯亂升降失常以致清濁混淆水滓不按常道而行久則難治明礬七分敲如緑豆大用腐衣五層包扎淡鹽湯送下日三服三日九服可愈詒按立方簡當外瘍門案一條惱怒悒鬱內火自生火能燥痰則氣結痰凝火性上炎則痰隨之上竄結核成串於左項安保右項之不發壯年朴實之體而得斯疾諒亦偏於性情之固執也倘能暫拋誦讀專以舒悶暢懷為事則癧痰之消猶可計日而待蓋不若自戕本元者之水虧火旺而燥痰成串也設聽其在絡內四竄久延必至於潰則終身之纍矣後悔莫及聊贈數言然乎否乎旋覆花一錢五分橘絡一錢白芥子七分杏仁三錢蘇子一錢海藻一錢五分昆布一錢五分丹皮一錢五分竹茹一錢五分香附一錢五分再診通絡化痰理氣開鬱之方已投七服左項痰核軟而可推余絡未竄脈仍弦數大便五日不行內火猶熾再議化痰通絡之法海藻一錢五分鱉甲五錢黑梔二錢昆布一錢五分丹皮一錢五分旋覆花一錢五分蔞皮一錢五分炙甲片七分白芥子七分竹瀝一兩三診前方五服痰核已消三粒所剩四粒亦軟而小其勢不至四竄矣脈弦小軟大便已暢再擬消痰以冀速除然方藥雖效亦半藉怡養工夫耳橘核一錢川楝子一錢炙山甲七分土貝母三錢昆布一錢丹皮一錢五分旋覆花一錢海浮石三錢黑梔一錢五分竹瀝一兩詒按此案三方藥力不甚結實而用意頗玲瓏在應酬方中可云完善婦人門案三條痛經數年不得孕育經水三日前必腹痛腹中有塊凝滯狀似癥瘕伏梁之類納減運遲形瘦神羸調經諸法醫者豈曰無之數載之中服藥無間何以漠然不應詢知閨閣之時無是病既嫁之後有是疾痛之來源良有以也是症考古隙無曾見於濟陰綱目中姑勿道其名目宗其意而立方不必於平時服俟其痛而進之經至即止下期再服荊三稜一錢莪朮一錢延胡一錢五分香附一錢五分制軍一錢歸身一錢五分丹皮一錢五分川芎四分桃仁二錢枳實七分再診前方於第二期經前三劑經來紫黑下有似胎非胎一塊彌月不復痛而經至矣蓋是症亦系凝結於胞中者今既下矣復何慮乎白芍一錢五分石斛三錢川芎五分醋炒柴胡三分橘白一錢白朮一錢五分歸身一錢五分丹皮一錢五分穀芽一兩經停三月驟然崩沖閲五月而又若漏卮詢系暴崩屬虛虛陽無附額汗頭震聞聲驚惕多語神煩脈微虛軟勢將二氣脫離其危至速擬回陽攝陰法急安其氣血附子五分鹿角霜一錢五分杞子炭一錢熟地七錢五味七粒白芍一錢五分人參一錢龜板一兩天冬一錢五分山藥三錢詒按症情已急須得重劑方可挽回方中選藥甚合特嫌分量太輕耳再診脫象既除經漏較稀脈猶濡細神思尚怯氣血乍得依附再宗暴崩屬虛之例擬溫補法人參一錢熟地一兩枸杞一錢五分鹿角膠一錢五分杜仲三錢巴戟一錢五分白芍一錢五分歸身一錢五分阿膠一錢五分天冬一錢五分臘嚴寒生産受寒必甚當時瘀露未暢臍下陳痛迄今五月未止閲所服藥皆宗産後宜之例固屬近是惜未考經穴經隧耳譬諸鎖則買矣何以不付以匙買者不知賣者當知二者不知醫者當知致使遠途跋涉幸遇善與人配匙者暢肉桂二錢細辛五分同研末飯丸勻五服每晨一服詒按方頗奇特
