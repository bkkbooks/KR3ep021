body:
  text: 上卷內傷雜病門心營與腎水交虧肝氣挾肝陽上逆胸中氣塞口內常干手震舌掉心煩不寐即有寐時神魂遊蕩自覺身非己有甚至便溏納少脾胃亦衰脈形細小無神而有歇止之象逐症施治似乎應接不暇因思精神魂魄必令各安其所庶得生機勃勃否則悠悠忽忽恐難卜其旋元吉擬許學士真珠母丸法石決明鹽水煅一兩人參一錢歸身錢半犀角五分龍齒三錢茯神三錢生地四錢麥冬二錢棗仁二錢炙草三分淮藥三錢沉香磨沖三分另珠粉四分先服詒按此方於肝氣一層嫌少理會愚意去山藥甘草加木香陳皮則胸中之氣塞亦平矣又接服方生地白芍人參丹皮橘紅茯神棗仁石決明龍齒秫米佛手再診脈之歇止向和便之溏泄不作氣塞稍平手震亦定但寤多寐少內藏之魂魄未安胸痞脘悶上壅之濁痰未降容將通陽鎮逆法參入前方冀相與有成耳真珠母丸真珠母熟地當歸人參棗仁柏子仁茯神犀角龍齒沈香去柏子仁當歸加旋覆一錢五分代赭石三錢陳皮七分冬朮七錢炙草五錢白芍二錢麥冬三錢甘瀾水煎竹瀝一兩沖服詒按案云通陽鎮逆方中用旋赭鎮逆而朮芍麥草則未可謂之通陽也三診夜半得寐心腎已交肺魄肝魂自能各安其藏無如心易煩動神反疲乏氣猶短促胸還痞悶脈仍細小兩足不安脈虛症虛是謂重虛而兼有濕痰從之為患夫痰即有形之火火即無形之痰也法當固本為主消痰佐之人參固本丸加龜板五錢炙茯神三錢棗仁二錢白芍三錢淮麥三錢陳皮一錢旋覆花一錢五分柏子仁一錢五分去油冬朮錢半另珠粉二分竹油二十匙雞子黃一枚和服詒按於痰病重投冬地得無嫌其滋膩否四診風火痰三者之有餘留滯肝經以致臥血歸肝魂不能與之俱歸筋惕肉瞤而醒前次氣短等症莫不因此而又起於有年病後氣血兩虧何堪磨耐所治之方不出許學士法加減現在脈息細小帶弦雖無止歇之形尚有不靜之意究屬難免風波未可以能食為足恃也石決明鹽水煅三錢麥冬二錢犀角五分柏子仁三錢龍齒三錢棗仁鹽水炒三錢歸身七分大熟地浮石粉拌炒六錢羚羊角一錢冬朮一錢五分白芍三錢陳皮一錢人參二錢茯神三錢銀花一錢薄荷五分另金箔二張竹瀝一兩真珠粉三分薑汁一匙沖服詒按方中用銀花薄荷兩味不識其意何居五診前夜熟睡昨又變為少寐寐之時適在子時以後肝膽兩經尚有餘邪可知更兼痰火阻氣時逆時平其氣逆時必面赤心悸甚則肉瞤筋惕煩熱不安脈亦隨之變異所謂心火一動相火隨之是也調治之外必須靜養俾心火凝然不動方可漸入坦途人參丹參麥冬元參各二錢旋覆花冬朮各一錢五分橘紅一錢小麥五錢棗仁川連煎汁拌炒茯神川貝各三錢炙草四分枇杷葉竹茹各三錢珠粉沖三分詒按相火屬少陽即膽火也方中川連竹茹恰合病機六診所患小恙無一不除蓋以清之化之補之養之無微不至而得此小效耳所嫌者寐非其時寤非其時心陽太旺神氣外馳是衛氣獨行於陽陽蹺脈滿滿則不入於陰陰分之虛明矣將滋陰之品參入前方未識能弋獲否前方加大生地五錢陳膽星五分另真珠母丸硃砂安神丸各五十粒詒按此症不寐乃肝膽有痰火所致案中引內經陽蹺脈滿之文本屬強為牽合至以經言陰虛指為陰血之虛尤非經文本旨七診人可以參天地之乾者莫貴於眠食如常今食能知味眠則未安昨夜忽寐忽醒醒則不爽寐則不安以昭衛氣不得入於陰獨留行於陽之意按案語牽合支離總由誤認經文陰字故說來總不入理是陽蹺脈滿營血不能充足肌肉不能潤澤苟非陽生陰長陰足戀陽何以漸入佳境然營中之血既不生之於心烏能藏之於肝統之於脾而欲藉草木之無情俾血肉之有情者以生以長談何容易況當此痰火易煩得食暫安以及虛風內動筋惕肉瞤支體牽搖大便難通之候更難為力矣急宜加意調理前方去元參旋覆珠粉丹參加黃耆一錢遠志三分歸身一錢半夏一錢五分豬膽汁炒木香三分圓眼肉三枚另真珠母丸四十粒朱珠安神丸三十粒詒按黃耆與此症不甚合膽汁炒半夏思路新穎八診徹夜好眠神魂已定是佳兆也但脈形細小而兼滑數數為有火滑為有痰細屬陰虛小屬氣弱虛弱之中兼有痰火有時面紅有時咳嗽有時氣痞而短有時煩熱不安更兼大便燥而小便短筋惕肉瞤支體動搖神情困倦語言無力等症均未平復還宜謹慎小心前方加柏子仁三錢另硃砂安神丸三十粒真珠母丸四十粒詒按此好眠是痰蒙所致未必定是佳兆九診臟之為言藏也心之神肝之魂肺之魄脾之意腎之志無不各得其藏五臟和矣即有不和因藏真不足蓋有待也而與藏相表裡者為府府以通為補與藏之以塞為補者有間因思胃主下行腸主津液津液不充下行失令故大便燥結而難通此際不以滋養營陰俾得施潤澤非計也目前之治如此將來或痰或火或感或傷偶有違和事難逆料斷無預定之理隨時斟酌為囑麻仁郁李仁柏子仁松子仁各三錢桃仁七分陳皮人參蘇子各二錢另朝服膏滋藥晚服丸藥此王江涇王姓病也是人素有肝火上升之病想熱病之後必有餘邪餘火留於肝膽乘虛竊發氣塞而不能臥起者中有實痰加於短氣不足以息之體神魂搖盪身非己有虛之甚矣用真珠母丸法先以犀角治實火參地補氣血俾相火得清而奠安第二方即參入陳皮竹油赭石旋覆花挾補挾化第三方人參固本入龜板耆芍雞黃第四方加入羚羊銀花清藥與補藥俱加倍用之第五六方竟是十味溫膽吃重痰火一層用藥心細手和既沉著亦靈敏洵可法可師之作陽絡重傷咳無虛日而於五更為甚口乾盜汗溺赤便溏脈數而身熱欲成損症也咽中已痛慮其加喘生變權以清熱存陰黃芩湯合豬膚湯加牡蠣再診所見病情與前無異喜食藕汁咽中干痛稍輕大便溏泄更甚雖屬肺熱下移於大腸而實則中氣已虛失其所守也六味丸加牡蠣川貝元參淡芩詒按大便溏泄虛症中所最忌者此症始終大便不堅故再三反復終不復元也三診溏泄已止咳嗽未除咽痛盜汗脈數肺經尚有熱邪補肺阿膠散加白芍生地淡芩元參山藥四診便泄稀身熱輕咽喉干痛亦漸向愈而咳嗽腹鳴神疲納少脈小帶數想是風熱遞減氣陰兩虧而脾中之濕又從而和之為患補三陰通三陽之外更以崇土化濕佐之六味丸加牡蠣淡芩於術防風陳皮炙草詒按陰虛而挾脾濕陽虛而挾肺火邪實正虛彼此相礙凡治此等症總須權其輕重緩急又須心靈手敏方能奏效若稍涉呆滯則效未見而弊先滋如此症屢用六味雖於症情亦合究嫌落筆太重少靈動之機括也五診氣陰得補漸和不意又有燥風外感襲入濕痰之中微有寒熱咽痛咳嗽不止權以清養法六味丸去萸加桑葉杏仁陳皮川貝炙草六診發熱惡風汗多是屬傷風之象但傷於壯者氣行則已傷於怯者難免不著而為患也大為棘手六味丸合玉屏風散加桑葉元參川貝橘紅甘草七診多汗惡風之象漸輕新風解矣而咳嗽咽痛大便溏飲食少仍是脾肺腎三藏皆虛之候幸未氣喘玉竹飲子玉竹茯苓甘草桔梗陳皮川貝紫菀姜合豬膚湯玉屏風散加麥冬山藥八診脾虛則便溏肺虛則咳嗽腎虛則虛火上炎咽喉干痛脈弱無力元氣傷矣急宜補氣育陰人參二冬二地黃耆陳皮阿膠杏仁百合甘草詒按此方究非便溏所宜九診精生於穀腎之精氣皆賴穀食以生之而穀食之化又賴脾土以運之今便溏納少脾失運矣急宜補脾為要都氣丸合四君子湯百花膏另八仙長壽丸參湯下詒按此方亦嫌少靈活之致又按此症前後方案九則議論頗有精當處惟用藥未能面面照顧總緣陰虛而兼便溏彼此相礙難於安置妥帖也先生之病素稟濕熱又挾陰虛之病也濕者何地之氣也熱者何天之氣也天地鬱蒸濕熱生焉濕熱稟於先天者與元氣混為一家較之內傷外感之濕熱屬在後天者豈可同日語哉設使薄滋味遠房幃不過生瘍出血而已乃從事膏粱更多嗜欲斯濕熱外增陰精內耗臟腑營衛但有春夏之發而無秋冬之藏無怪乎風火相煽而耳為之苦鳴也當斯時也靜以養之猶可相安無事何又喜功生事火上添油致陡然頭暈面赤其一派炎炎之勢蓋無非肝經之火督脈之陽上冒而為患近聞用引火歸原之法以為甘溫能除大熱嗟乎未聞道也夫甘溫除大熱者良以下極陰寒真陽上越引其火歸其原則坎離交媾太極自安若陰虛濕熱蒸動於上者投以清滋尚難對待況敢以火濟火明犯一誤再誤之戒乎逮後清已有法滋亦頻投飲食能增身體能胖而坐立獨不能久者明是外盛中空下虛上實用藥殊難嘗見東垣之清燥湯丹溪之虎潛丸潤燥兼施剛柔並進張氏每贊此兩方謂必互用始克有濟何故而不宗此耶然猶有進於此者治病必資藥力而所以載行藥力者胃氣也胃中濕熱熏蒸致吐血痰嗽鼻塞噫氣二便失調所謂九竅不和都屬胃病也然則欲安內臟先清外腑又為第一要著矣至秋末冬初病甚者十月坤卦純陰天已靜矣而濕熱反動腎欲藏矣而濕熱仍露能勿令病之加劇乎附方謹復青鹽四兩甘草八兩荸薺一斤海䖳二斤萆薢一兩飴糖八兩刺蝟皮一兩五錢霞天曲一兩五錢十大功勞葉一斤橘葉五兩共為末竹瀝和水泛丸每朝四錢服完後合虎潛丸全料同合常服按方中海䖳荸薺飴糖不能作丸此必有誤愚意用東垣清燥湯方合青鹽以下數味為末而用荸薺海䖳煮汁和飴糖竹瀝泛丸乃合原注起手提清濕熱之病陰虛之體發明先天素稟濕熱之故第二段一折折出嗜欲膏粱因此更加陰虛第三段再折折出動火傷陰第四段直闢用熱之謬下乃歸到治病先治胃通篇說理既精筆力遒老饒有古文筆意詒按推論病原指陳治法言言切實絕無模糊影響之談最後推出先清胃府一層尤為洞中窾要深合機宜凡治陰虛濕熱者於此可悟出法門矣身熱手心熱少力神倦澼利脈濡此脾陽下陷陰火上乘甘溫能除大熱正為此等症設也補中益氣湯加鱉甲詒按此脾虛內熱症也用東垣法最合勞倦而招風濕右脈濡小左脈浮弦舌苔薄白溺赤便溏肢體酸楚神倦嗜臥少納口乾升陽益胃湯參朮耆草夏陳苓澤羌獨防柴連芍薑棗加川樸青皮詒按此與前症略同故用藥亦相似胃虛則納食無味脾虛則運化無常六君子湯合治中湯加熟地益智仁粳米詒按脾喜溫升宜香燥胃喜清降宜柔潤脾陽健則能運胃陰充則能納凡脾胃同治者用藥須識此意愚意去熟地加石斛似與胃虛者更宜五臟六腑皆有營衛營衛不調則寒熱分爭此病分爭之後肌肉暗消因思脾主肌肉肌肉暗消正所以昭脾之營衛虛也無怪乎脘痞納少力乏嗜臥脈形軟弱有種種脾虛見象於法當健脾為主而八八已過之年陽氣必衰又宜兼壯元陽使火土合德尤為要務烏龍丸合香砂六君丸加首烏當歸心脈宜大者反小腎脈宜沉者反浮浮則為傷小則為虛想是讀書攻苦心腎不交失其封藏之職夫心腎即嬰兒奼女欲其交者須得黃婆為之媒合黃屬中央脾土所主舍補中宮之外皆屬徒然歸脾湯詒按借丹訣以談醫理原一貫也此案說理頗精惜未能指列病狀晝為陽陽旺應不惡寒夜為陰陰旺應不發熱茲乃日間惡寒夜間發熱何以陰陽相反若是耶此無他陽虛則惡寒於日陰虛則發熱於夜陰陽之正氣既虛所有瘧後餘邪無處不可為患足為之浮腹為之滿溺為之短一飲一食脾為之不運生飲生痰肺為之咳嗽脈從內變而為細弦夫形瘦色黃舌白陽分比陰分更虧極易致喘桂枝加厚朴杏仁湯加附子乾薑冬朮半夏橘紅原注案則一線穿成藥則理中去參以理其本桂枝以和其標二陳樸杏以化其邪乃絲絲入扣之方脾為陰土胃為陽土陽土病則見嘔惡陰土病則見泄瀉二者互相為患此平則彼發令人應接不暇現在嘔止而泄似脾病而胃不病不知脾胃屬土木必乘之不乘胃土而嘔必乘脾土而泄治病必求其本本在木當先平木必使陽土陰土皆不受所乘方為正治理中湯烏梅丸吳仙散吳萸茯苓加白芍詒按推究病機即能融會貫徹斟酌治法自然入彀舌乃心之苗舌上之苔剝落不生者久矣是心陰不足心陽有餘也黃連阿膠湯去芩加大生地詒按胃陰枯涸者每有此病心陰不足之說亦可備一法也中風門類中之餘足不任身手難舉物尺脈無力陰陽並弱擬用河間地黃飲子法熟地蓯蓉川附牛膝石斛遠志巴戟甘菊再診手之舉動稍和足之步履如舊蓋緣陽氣難於充足耳六君子湯加熟地巴戟白芍川附虎骨又膏方歸芍六君子丸加虎骨巴戟菟絲蓯蓉首烏杜仲萆薢三診足部有力步履不艱補方得力可知仍以前法地黃飲子地巴蓯萸麥斛菖芩遠薄味附桂去麥味菖合異功散加當歸芍藥蠍尾竹油詒按此病之由乎虛者故用藥專以補養收功從前並未用疏風化痰之藥案中亦無見症至末方諸恙就痊而忽加蠍尾竹油二味想必另有風痰見症也怒則氣上痰即隨之陡然語言謇澀口角流涎月餘不愈所謂中痰中氣也然痰氣為標陽虛為本所以脈息遲弦小水甚多肢麻無力法宜扶陽為主運中化痰佐之六君子湯加川附白芍麥冬竹油蠍梢詒按立方虛實兼到所謂看似尋常最奇特也勿以平易忽之左肢痿而不用口歪流涎舌苔起膩便溏溺少脈形弦遲以中虛濕勝之體易於生痰動風內風既動未有不招外風者也牽正散白附蠍梢合二陳湯加川附桂枝白芍制蠶再診肢體稍和流涎略減仍以前方增減前方去芍加首烏川斷竹油詒按方案均切實不浮痿痹門膝骨日大上下漸形細小是鶴膝風症乃風寒濕三氣合而為痹病之最重者也三氣即痹又挾肺金之痰以痹肘所謂肺有邪其氣留於兩肘肘之痹偏於左屬血屬陰陰血久虧無怪乎腰脊突出接踵而來至於咳嗽鼻流清涕小水色黃肌肉暗削行步無力脈形細小左關獨見弦數是日久正虛風寒濕三氣漸見化熱之象擬用痹門羚羊角散加減羚羊角歸身白芍杏仁羌活知母桂枝薏米秦艽制蠶茯苓竹瀝桑枝詒按由膝而肘而脊病情漸引漸深方中於膝肘之邪已能兼治於脊突一層似未能兼顧及之擬再加鹿角霜川懷牛膝等味素患鼻衄入夏又發下體痠軟無力咳嗽口乾溺黃膚熱想是鼻衄屢發上焦陰液久耗而胃中濕熱之邪熏蒸於肺肺熱葉焦則生痿躄也清燥湯參耆草朮歸橘柴麻羌地連豬茯麥味蒼柏瀉去朮升柴加白芍茅花枇杷葉詒按此症自當滋清營液為主東垣清燥湯立法未純前人頗有議之者用者當審之案語闡發病情極其熨帖人年四十陰氣自半從古至今如是惟尊體獨異者蓋以濕熱素多陽事早痿耳近又患臂痛之症此非醫書所載之夜臥臂在被外招風而痛乃因久臥竹榻寒涼之氣漸入筋骨較之被外感寒偶傷經絡者更進一層所以陽氣不宣屈伸不利痛無虛日喜熱惡寒仲景云一臂不舉為痹載在中風門中實非真中而為類中之機豈容忽視現在治法首重補陽兼養陰血寓之以祛寒加之以化痰再通其經絡而一方中之制度自有君臣佐使焉熟地八兩當歸四兩白芍二兩虎掌一對阿膠三兩半夏四兩橘紅二兩枳殼二兩沉香五錢黨參四兩於術四兩茯苓八兩熟附一兩炙草一兩風化硝一兩桂枝一兩羌活一兩綿耆二兩薑黃一兩海桐皮一兩共為末用竹瀝薑汁和蜜水泛丸詒按立方清切周到可法可師神志門神識不清自言自語起坐無常寤寐失度脈形小滑舌苔白膩此痰熱內郁心包無路可出而作心風也久久歸入癲癇毋忽導痰湯苓夏枳星梅橘薑草加菖蒲遠志另白金丸詒按病情已屬癲症再加犀角龍牡等清鎮之品似更得力陽明之脈環於唇唇起紅筋即發牽動而厥厥醒吐沫咳血鼻衄二便失調脈弦滑數顯系胃有積熱動血生痰又被肝火所沖激乃癇症之根毋忽六味丸加川貝石決明另虎睛丸虎睛一對制軍一兩遠志五錢犀角一兩黑梔一兩蜜丸每服二十一粒詒按既曰胃有積熱似非六味所能勝任且方中如萸肉之酸溫亦宜避去又按積熱者蓄積之熱也與積滯之積不同虎睛丸中大黃黑梔即為泄熱而設癇症之因未有不由乎龍雷之火上升此則更有濕熱之痰從而和之為患六味丸加龍齒石決明橘紅黑梔川貝川連竹茹詒按連讀癇症數案皆以六味丸為主查六味為通補三陰之方先生習於內經重陰者癲一語謂癇症必挾龍雷之火而以滋水柔木為主故用藥如此其實癇症有因於胎驚者有因於先天陰虛者亦有因於驚痰內擾者當隨所因而治之初非可執一端以論也驚則氣亂神出舍空痰涎襲入此心悸形呆善忘不語所由來也至月事不至血從內並用藥亦須兼及茯苓香附沉香半夏橘紅遠志膽星牛膝另驚氣丸白花蛇蠍蠶腦麝辰砂白附麻黃天麻橘紅南星蘇子詒按擬加丹參琥珀歸鬚等兼顧血分乃與案語相合心悸初從驚恐得之後來習以為常經年不愈手振舌糙脈芤帶滑不耐煩勞此係心血本虛痰涎襲入也人參元參丹參棗仁天冬麥冬菖蒲茯苓茯神當歸遠志五味桔梗半夏生地橘紅枳殼柏仁炙草竹茹原注此天王補心丹合十味溫膽法也心身本虧補心丹主之痰涎襲入十味溫膽湯主之濕熱生痰留於手足少陽之府累及心包心驚膽怯性急善忘多慮多思舌苔濁膩帶黃胸脘內熱清化為宜黃連溫膽湯加洋參枇杷葉原注舌苔濁膩帶黃加入黃連一味苦燥化濕再加洋參補陰枇杷葉清肺想是火旺之體肺液必虧且以救二陳之過燥也神蒙善忘包絡之病為多然左寸脈息上浮關部獨帶弦數右寸與關小而帶弦白苔滿布大便久溏肢體無力倦怠嗜臥脾經之濕痰被肝火所沖激累及心包也藿梗黨參於術半夏陳皮香附砂仁木香沉香遠志枳殼葛根菖蒲竹油詒按此必兼有脹滿之候故方中多香燥和脾之品用葛根藿梗乃兼清暑濕之意再診痰因濕釀濕自脾生脾若健運則無濕以生痰所患善忘等症自可化為烏有然則健脾一法在所必需矣香砂六君子湯加沙苑遠志穀芽原注苔白便溏乏力嗜臥皆脾倦見症故用健脾化濕法痰火門胃為貯痰之器上逆心包輕則胸悶重則神蒙導痰湯合溫膽湯另白金丸詒按此治痰蒙之正法也在此症尚屬輕劑曾經失血現在內熱吐痰夜來大魘脈象滑數陰虛挾痰所致十味溫膽湯加麥冬歸身詒按陰虛挾痰之症用藥最難恰好十味溫膽湯即溫膽湯去竹茹加參地棗仁遠志五味治寒涎沃膽膽寒肝熱心悸不寐痰飲門積飲成囊平陳湯另丸方茅朮一斤芝麻半斤棗肉丸如便血山梔湯下詒按此病不易除根煎丸兩方極為熨帖特未識能奏膚功否鼻血遺精肺腎俱病寒熱盜汗營衛並傷必須大補為是無如脈息細弦舌苔滿布二便失調飲食不舒脾家又有濕痰為患先宜化濕健脾再商補劑枳砂二陳湯加烏梅生薑詒按方中烏梅一味似不入格查醫通載二陳湯古方本有烏梅取斂護胃陰之意先生用此其意或在是乎動則氣喘言則亦然是下虛也宜其俯仰不適矣至於脘中拒按隱隱作疼築築而跳脈息中部太弦必有濕熱痰濁交阻於胃失下行為順之常未便獨以虛治川貝陳皮茯苓白芍牛膝海䖳荸薺另水泛資生丸詒按此必挾有痰飲阻於中脘宜從飲門用意再診俯仰自如漸通之兆所見言動之氣喘脘腹之拒按已日輕一日大妙事也動氣攻築獨不能除且兼氣墜少腹臥則可安此則非胃氣之能降而實脾氣之不升也香砂六君丸合雪羹加神麯另資生丸詒按立論精當明瞭惟用藥尚不甚得力咳喘門年逾古稀腎氣下虛生痰犯肺咳喘脈微當與峻補金水六君煎麥地橘夏苓草合生脈散加桃肉另八仙長壽丸腎氣丸原注補命門之火以生土清其生痰之原則肺之咳喘自寧煎方金水六君煎以治脾腎生脈以養肺桃肉以補命門其奠安下焦之劑另用丸藥常服斟酌可謂盡善矣氣喘痰升胸痞足冷是中下陽虛氣不納而水泛也已進腎氣湯可以通鎮之法繼之旋覆代赭湯去薑棗合蘇子降氣湯去桂前草姜加薤白車前茯苓枳殼詒按於腎氣後續進此方更加旋赭以鎮逆薤白以通陽用意極為周到交冬咳嗽素慣者也今春未罷延及夏間當春已見跗腫入夏更增腹滿口燥舌剝火升氣逆右脈濡數左脈浮弦風邪濕熱由上而及下由下而及中即經所云久咳不已三焦受之三焦咳狀咳而腹滿是也際此天之熱氣下行小便更短足部尚冷其中宮本有痞象亦從而和之為患用藥大為棘手姑擬質重開下法佐以和胃泄肝之品豬苓雞金白朮石膏寒水石雪羹肉桂枇杷葉原注風邪歸併於肺脾氣素虛者由肺而陷入於脾尚是一線加以口燥舌剝陰虛有火之體更屬難治用河間甘露之意質重開下方則極妙未識效否詒按病情紛錯實難著手以桂苓法增減出之已屬苦心經營特於痞滿一層尚恐與兩石有礙方中茯苓滑石似不可少寒熱後咳嗽痰濃頭疼口渴舌紅脈數大便溏泄冬溫之邪鬱於肺分而從燥化當泄之清之葳蕤湯葳蕤石膏青木香薇麻芎葛羌草杏原注此冬溫咳嗽也麻杏開泄外罩之涼風羌活葛根佐之石膏清內伏之溫熱白薇玉竹佐之冬溫必頭痛便泄青木香治便泄之藥也病比傷寒多一溫字方比麻黃去桂枝一味加入石膏以治熱有因方成珪遇圓為璧之妙詒按此病既見痰濃口渴則已有邪郁化熱之徵方中羌防葛根似宜酌用寒必傷營亦必化熱咳嗽不止嘔吐紫血咽中干痛苔白邊青脈緊而數近更咳甚則嘔氣息短促肺胃兩經皆失其清降也郁咳成勞最為可怕荊芥杏仁紫菀桑皮地骨皮蘇子麥冬金沸草玉竹再診白苔已薄舌邊仍青痰出雖稀咳逆未止觀其喘急嘔逆多見於咳甚之時正所謂肺咳之狀咳而喘胃咳之狀咳而嘔也桑皮骨皮知母川貝淡芩浮石桔梗甘草紫菀麥冬蘆根萊菔汁原注風寒之邪鬱於肺胃久而化火遂至見血先用金沸草散瀉白散以搜剔其邪第二案即加入蘆根知母清營中之熱用法轉換層次碧清詒按此症先曾吐瘀加以舌邊色青似有瘀血鬱阻方案中何以並不理會及此傷風不醒咳嗽嘔惡所見之痰或薄或濃或帶血色左關脈獨見浮弦且數小有寒熱此損症之根也千金法治之蘇葉黨參川連烏梅橘紅川貝柴胡杏仁桑皮地骨皮原注此用柴前連梅煎意千金法也咳嗽由來十八般只因邪氣入於肝即是此方之歌訣此方效轉方加竹茹一味詒按弦數獨見於左關故知其病專在肝咳嗽吐出青黃之痰項強惡風音爍寒熱分爭是名勞風服秦艽鱉甲而更甚者當進一層治之柴前連梅煎柴胡前胡黃連烏梅薤白豬膽汁童便豬脊髓附秦艽鱉甲煎秦艽鱉甲地骨皮柴胡青蒿歸身知母烏梅再診進前方咳嗽大減所出之痰仍見青黃之色身熱雖輕咽中苦痛脈形弦細數風邪未盡中下兩虛制小前方之外參入豬膚法一治身熱一治咽痛柴前連梅煎合豬膚湯加黨參花粉原注此方治傷風不醒成勞比秦艽鱉甲又進一層其見症每以咳吐黃綠青痰為據咳嗽時盛時衰粉紅痰後變為青黃勞風之根也柴胡前胡烏梅川連薤白童便豬膽汁豬脊筋詒按童便易秋石甚妙再診進勞風法咳嗽大減紅痰亦無但痰色尚帶青黃左關脈息弦硬不和肝膽留邪容易犯肺胃俞也毋忽麥冬沙參淡芩炙草白芍川貝青黛廣皮原注此方極玲瓏先生用之每靈大約風喜傷肝風鬱於肝久而不出必有青黃之痰所謂勞風是也詒按先生案中治勞風一症必用柴前連梅煎自云法本千金用之神效查千金方所載勞風治法及所敘病原與此不同即所用之柴前連梅煎僅見於吳鶴皋醫方考千金方中並無此方先生偶誤記耳右脈弦滑而數滑為痰弦為風風鬱為熱熱鬱為痰阻之於肺清肅不行咳嗽自作金沸草前胡半夏荊芥甘草赤苓川芎枳殼紫菀杏仁桑白皮蔞皮竹瀝原注方中芎枳二味是升降法也必有一團寒風化熱鬱閉於肺用芎之升枳之降以挑松其火若火重者不可用有陰火者更不可用恐火升則血易動耳詒按此金沸草散去麻芍加芎枳以挑動之苑杏以宣泄之桑蔞以清降之細玩其加減可識其心思之細密用意之周到矣案語亦簡煉老潔晨起咳嗽勞倦傷脾積濕生痰所致久而不已氣喘畏風金水因此而虛補中寓化一定章程現在身熱口乾苔白脈息細弦而緊緊則為寒寒風新感必須先治新邪權以疏化法香蘇飲合二陳加枳殼桔梗杏仁通草又接服方麥門冬湯合二陳加旋覆冬朮牛膝詒按此即六君加麥冬旋覆牛膝也恰合脾虛有濕痰而傷及金水者之治內經云秋傷於濕冬生咳嗽喻氏改作秋傷於燥冬生咳嗽豈知初秋之濕本從夏令而來原為正氣若論其燥則在中秋以後其氣亦為正令二者相因理所固然勢所必至仲景早已立方獨被飛疇看破今人之用功不如古人遠矣麥冬半夏甘草玉竹紫菀瀉白散原注此麥門冬湯也先生以肺燥胃濕四字提之故此案以燥濕二字為言去冬咳嗽今春寒熱至秋令而咳嗽或輕或重惟喉癢則一所謂火逆上氣咽喉不利此等症是也最易成勞未可以脈未促氣未喘為足恃麥門冬湯合瀉白散加橘紅茯苓甘草玉竹再診內熱已除咳嗽亦減氣火之逆上者漸有下降之意靜養為佳前方加枇杷葉原注此病必有舌苔而不夜咳所以與四陰煎症有異肺經咳嗽嗽則喘息有音甚則吐血血已止咳未除右寸脈息浮弦弦者痰飲也良以飲食入胃遊溢精氣上輸於脾脾氣散精上歸於肺而肺氣虛者不能通調水道下輸膀胱聚液為痰積濕為飲一俟誦讀煩勞咳而且嗽自然作矣補肺健脾以絕生痰之源以清貯痰之器麥門冬湯合異功散加薏仁百合原注此曲曲寫出痰飲之所由來用二陳以化痰佐以薏米用麥冬以養肺佐以百合用白朮以健脾佐以黨參味味切當熨帖看似尋常實是功夫純熟之候詒按以上數案均是麥門冬湯症乃燥濕互用之法
