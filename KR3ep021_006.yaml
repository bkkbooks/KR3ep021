body:
  text: 附録咳嗽症治括要咳者和諧聲也其音開口而出倣佛亥字之音故有聲無痰為咳嗽則如水之灌漱然有物在喉漾漾欲出故從口從敕後人遂以有痰為嗽然則咳嗽之病胡從生也曰病有萬變要不出內傷外感兩端請先明外感外感者風寒暑濕燥火六者盡之論其常則各主一時為病論其變則四時皆可以受六淫之邪今則即風寒論感風者鼻塞身重惡風清涕此症也左脈浮弦此脈也感寒者惡寒體痛發熱脈緊此寒之症與脈也而風之中又有辨春則為溫風肝木用事受風者必傷肝而又有中血中氣之別風傷衛則參蘇飲風傷營則芎蘇飲夏則為熱風傷心包而亦有涼熱之別涼風香薷飲熱風雞蘇散秋為涼風傷肺敗毒散金沸草散冬為寒風傷膀胱桂枝厚朴杏仁湯麻黃湯儻冬時天熱而感寒風則當用葳蕤湯陽旦湯此冬溫之邪也惟秋分以後少暑濕春夏無燥氣他如先傷風而後傷熱為熱包寒葳蕤湯肺素熱而感寒風為寒包熱金沸草散一嗽而痰出稠黏者脾濕勝二陳之類連嗽無痰者肺燥甚清燥救肺湯此皆外感咳也言風一端而六氣可類推矣若夫內傷大法惟痰飲津傷兩種痰飲多陽虛津傷多陰虛其陽虛痰飲尚淺者六安二陳之類有火者溫膽湯夾陰虛者金水六君煎陽虛甚兼夾痰火不可攻者玉竹飲子咸降法喘者降氣湯貞元飲此陽虛痰飲一端也他如陰虛者陰火易於上升胃氣不清者麥門冬湯曾見血者四陰煎痰多而濃無胃氣者六君子湯痰少而嗌乾胃氣未絶者六味丸都氣丸八仙長壽丸此粗舉內傷之一端也此外又有勞風一門咳吐濁涕青黃之痰由勞碌傷風戀而不化最為難治淺者秦艽鱉甲表虛汗多者黃耆鱉甲深則柴前連梅煎千金法也此皆勞風之治也至於芎枳二味以治寒鬱化火之咳合二母以瀉肺之母瀉白散以清泄肺藏四物桔梗湯以引清血分皆在所常用也似此某症某方條分縷析須平日有格致功夫試觀先生臨症之方似乎夾雜合之病人之症則無一味可以增減先生嘗曰吾門之病如時文割截隔章隔節之題他人無處下手左支右拙余能以心思靈空貫串合湊一方令病安穩此無他外感多與內傷同病內傷每因外感而發更遇雜藥亂投之醫治絲而棼愈難就緒治此者不能不兼採衆方就中另出一方其立方之意在案中宣露明白噫執此意以尋先生之門徑思過半矣失血門飲食入胃遊溢精氣上輸於脾脾氣散精上歸於肺通調水道下輸膀胱水精四布五經並行合於四時五藏陰陽揆度以為常也此乃飲歸於肺失其通調之用飲食之飲變而為痰飲之飲痰飲之貯於肺也已非一日今當火令又值天符相火加臨兩火相爍金病更甚於前然則痰之或帶血或兼臭鼻之或干無涕口之或苦且燥小水之不多大便之血沫何一非痰火為患乎旋覆花桑皮川貝橘紅浮石炙草沙參茯苓麥冬竹葉絲瓜絡詒按此症乃素有濁痰鬱熱壅結熏蒸於內再受時令火邪熏灼肺胃所致如此立論似亦直捷了當何必用飲食入胃及天符相火如許大議論耶可參用葦莖湯再診接閲手書知咳血夢遺畏火三者更甚於前因思天符之火行於夏時可謂火之淫矣即使肺金無病者亦必暗受其傷而況痰火久踞肺金久傷再受此外來之火而欲其清肅下降也難矣肺不下降則不能生腎水腎水不生則相火上炎此咳逆夢遺之所由來也至於畏火一條內經載在陽明脈解篇中是肝火乘胃之故法宜瀉肝清火不但咳血夢遺畏火等症之急者可以速平而且所患二便不通亦可從此而愈懸而擬之未識效否鮮生地蛤殼青黛桑皮龍膽草川貝地骨皮黑梔竹葉大黃鹽水炒三診陽明中土萬物所歸現在肝經濕熱之邪大半歸於陽明以著順乘之意而逆克於肺者猶未盡平所以睡醒之餘每吐青黃緑痰或帶血點其色非紫即紅右脅隱隱作痛脈形滑數獨見肺胃兩部宜從此立方小生地桑皮羚羊角阿膠冬瓜子薏米蛤殼川貝杏仁忍冬藤青黛功勞露蘆根絲瓜絡原注肝經久病克於土者為順乘犯於肺者為逆克詒按前方實做不若此方之空靈活潑也四診痰即有形之火火即無形之痰痰色漸和血點漸少知痰火暗消大可望其病愈不料悲傷於內暑加於外內外交迫肺金又傷傷則未盡之痰火攻逆經絡右偏隱隱作疼旁及左脅上及於肩似乎病勢有加無已細思此病暑從外來悲自內生七情外感萃於一身不得不用分頭而治之法庶一舉而兩得焉桑皮骨皮知母川貝阿膠枳殼金針菜薑黃緑豆衣藕汁佛手原注痰帶血點鼻乾口燥小水不多大便血沫總屬痰火為患第一方用清金化痰不效第二方案加咳血夢遺畏火三症歸於肝火一派清肝略加養胃第三方從肺胃立方略佐清肝之意第四方全以輕淡之筆消暑化痰詒按統觀前後四案議病用藥均能層層尉帖面面周到於此道中自屬老手惟所長者在乎周到穩實而所短者在乎空靈活潑此則囿乎天分非人力所能勉強矣第一方就病敷衍毫無思路第二方清泄肝火力量頗大第三四方則用藥空靈不滯是深得香岩師心法者咳嗽而見臭痰絡血或夜不得眠或臥難著枕大便乾結白苔滿布時輕時重已病半年有餘所謂熱在上焦者因咳為肺痿是也左寸脈數而小正合脈數虛者為肺痿之訓而右關一部不惟數疾而且獨大獨弦獨滑陽明胃經必有濕生痰痰生熱熏蒸於肺母病及子不獨肺金自病此所進之藥所以始效而終不效也夫肺病屬虛胃病屬實一身而兼此虛實兩途之病苟非按部就班循循調治必無向愈之期紫菀一錢麥冬二錢桑皮錢半地骨皮錢半阿膠一錢薏仁五錢忍冬藤一兩川貝錢半蛤殼一兩橘紅一錢茯苓三錢炙草三分詒按論病選藥俱極精到此方亦從葦莖湯套出可加蘆根再診諸恙向安右脈亦緩藥能應手何其速也再守之觀其動靜前方加水飛青黛三分三診右關之大脈已除弦滑未化數之一字與寸相同濕熱痰三者尚有熏蒸之意肺必難於自振前方加大生地蛤粉炒三錢沙參三錢蜜陳皮一錢四診疊進張氏法肺金熏蒸日輕一日金性漸剛頗為佳兆然須振作以著本來之清肅乃可前方去薏米加麻仁五診夜來之咳嗽尚未了了必得肺胃漸通乃愈前方去蛤殼茯苓加川斛百合六診肺虛則易招風偶然咳嗽加劇而今愈矣脈數右寸空大陰氣必虛自當養陰為主然陽明胃經濕熱熏蒸之氣不能不兼理之前方去百合加知母七診右脈小中帶數肺陰不足肺熱有餘其所以致此者仍由胃中之濕熱熏蒸也前方加絲瓜絡冬瓜仁葦莖八診肺屬金金之母土也胃土濕熱未清上焦肺部焉得不受其熏蒸所謂母病及子也肺用在右右胸當咳作疼未便徒補必使其清肅乃可前方加薏仁杏仁九診來示已悉因思動則生火火刑于金則咳逆火入於營則吐血此十七日以後之病失於清化以致毛竅又開風邪又感咳嗽大作欲嘔清痰血絡重傷也事難逆料信然懸擬以覆桑皮地骨皮杏仁甘草淡芩茅根知母川貝葦莖忍冬藤兩劑後去淡芩加麥冬沙參生地又丸方大生地白芍丹皮澤瀉沙參茯苓山藥麥冬阿膠用忍冬藤十斤煮膏蜜丸原注此病道理盡具於第一案中先生平日所言起手立定根腳以下遂如破竹大約此病拈定胃火熏蒸四字方中得力尤在忍冬藤一味宿積黑血從吐而出胸之痞塞少和肺之咳嗽略減是瘀血也從上出者為逆究非善狀瘀熱湯旋降蔥葦枇葉參三七磨沖詒按可加酒炙大黃炭數分研末沖服以導血下行再診所瘀之血從下而行尚屬順症因勢導之原是一定章程當歸丹參桃仁靈脂蒲黃茯神遠志詒按仍宜加牛膝三七等導下之品昨日所溢之血盈盆成塊而來無怪乎其厥矣幸得厥而即醒夜半得寐其氣稍平今日仍然上吐脈來芤數火升顴紅咳逆時作大便不爽而黑陽明胃府必有伏熱防其再冒再厥犀角地黃湯加三七牡蠣龜板枇杷露詒按此與下條皆木火亢盛陰血沸騰之症久嗽失血鮮而且多脈數左弦苔黃心𩞄金受火刑木寡於畏以致陽絡被傷也防冒犀角地黃湯加二母側柏葉另歸脾丸原注吳鶴皋曰心火也肺金也火為金之畏心移熱於肺乃咳嗽甚則吐血面赤名曰賊邪是方也犀角能解心熱生地能涼心血丹皮芍藥性寒而酸寒則勝熱酸則入肝用之者以木能生火故使二物入肝而瀉肝此拔本塞源之治陽絡頻傷胸前窒塞咳逆不爽舌紅苔黃脈形弦數此係瘀血內阻鬱而為熱肺胃受傷極易成損慎之旋覆猩降蔥管蘆根枇杷葉忍冬藤蘇子桑皮川貝知母廣鬱金參三七竹油地骨皮原注前五味名瘀熱湯是先生自制之方治瘀血內阻化火刑金而咳不去其瘀病終不愈此為先生獨得之祕詒按合二母瀉白以清肺佐蘇郁三七以通痹立方周到之至脘脅痞結作痛形寒如瘧苔濁不納渴欲熱飲神情憊乏此血絡凝泣濕邪附之欲化熱而未能透出也瘀熱湯加香附川連歸鬚青皮白芍橘絡瘀血先阻於中一經補味胸中遂痞柴黑之血從此而來瘀熱湯加鬱金汁原注此方大效詒按再加三七磨沖更妙虛損門痧子之後咳嗽四月頸旁癧串咳甚則嘔納少形瘦膚熱脈細想是餘邪內戀陰分大虛欲成損症也四物湯加香附川貝元參牡蠣麥冬蘇子一本作蘇葉詒按方中元參牡蠣為項癧而設無此症者可減也溫邪發痧之後咳嗽失血血止而咳嗽不減所吐之痰或黃或白或稠或稀舌質深紅其苔滿白喉癢嗌乾脈弦帶數漸作痧勞之象四物湯加紫蘇桑皮骨皮川貝知母前胡淡芩原注此痧後餘邪留戀營分而成咳也先生嘗云余自制兩方一為瘀熱湯一為此湯尚未立名以治痧後咳嗽極效蓋四物是血分引經之藥將溫散化痰之品納入其中引入營血中散邪清熱每用必靈此可悟用四物之法咳嗽五月有餘黃昏為甚肌肉暗削肢體無力容易傷風或頭脹或溺黃總由陰分下虛浮火夾痰上擾所致四物桔梗湯四物加桔柏加桑皮地骨皮川貝知母甘草青黛蛤殼枇杷葉原注此方之眼在咳嗽黃昏為甚畢竟風邪陷入陰分為劇余目睹效者甚多詒按此四物合瀉白加二母蛤黛法也金能剋木木火太旺反侮肺金金藏尚受木克則其吸取腎水疏泄腎精更屬易易此夢遺咳嗽之所由作也天冬生地黨參黃柏甘草砂仁白芍龍膽草原注此三才封髓丹加白芍龍膽也其人面必黑瘦有一團陰火熾甚克肺傷腎用之極效詒按此方以清泄肝火為主竟不兼用肺藥所謂治病必求其本也子後咳嗽天明而緩脈形弦數聲音不揚肝膽之火未清金受其刑水必暗虧也補肺阿膠湯合四陰煎瀉白散加川貝青黛海浮石橘紅竹茹詒按此與前案均屬木火刑金之症前方治肝而絶不及肺想因咳勢不甚而下注遺泄之症卻急故用藥如彼此症則咳甚音低肺金受損已深故於清火之中偏重補肺觀乎此而臨症用藥之權衡可識矣咳嗽失血音爍咽乾近來小有寒熱頭痛喉疼脈浮促而數肺陰久傷又兼燥氣加臨補肺之中當參以辛散補肺阿膠湯加桑葉枇杷葉再診頭痛咽疼已止寒熱亦輕新受之燥邪漸得清散無如金水兩虛失血久嗽音爍嗌乾等症仍如損象即使靜養猶恐不及四陰煎合瀉白散加川貝杏仁阿膠茯苓石決明原注此病肺藏已損再受燥邪小有寒熱頭痛咽疼是其的據先用補肺阿膠湯以其中有牛蒡杏仁加桑葉枇杷葉去其燥邪外症後用四陰煎加味以圖其本陽絡頻傷之後咳嗽痰濃內熱嗌乾脈芤數左關獨弦此肝火刑金金氣不清之候容易成損慎之四陰煎加二母羚羊另瓊玉膏地冬參蜜沉香柏原注肝火刑金於左關獨弦見之所以四陰更加羚羊失血後咳嗽夢遺脈數左關弦急必有肝火在裡既犯肺金又泄腎氣也久延勢必成勞四陰煎加陳皮川貝海浮石青黛龍膽草六味湯原注肝火上下交徵故加龍膽以泄之詒按六味湯想系轉方增入者但其中有萸肉之酸溫專補肝陽尚宜酌用失血久咳陰分必虛虛則不耐熱蒸食西瓜而稍退脈數左弦唇乾苔白色滯溺黃加以咽痛久而不愈想是水不涵木陰火上衝胃氣不清也勢欲成勞早為靜養以冀氣不加喘脈不加促庶幾可圖生地白芍茯苓澤瀉丹皮花粉元參甘草豬膚青蒿露枇杷葉露再診濁痰雖少咳逆仍然陰分之火上衝於肺肺屬金金受火刑水之生源絶矣能不慮其脈促氣喘乎知命者自能靜以養之八仙長壽丸加元參阿膠陳皮甘草枇杷葉露三診咳嗽夜來有或重或輕之象想是陰火靜躁不同耳前方加洋參龜板杏仁四診所進飲食不化為津液而變為痰涎一俟水中火發咳嗽作焉權以化法玉竹飲子玉竹苓草桔橘苑貝薑合麥門冬湯加阿膠百合款冬原注前兩方六味加減法也脈數左弦咽痛水不涵木陰火上衝惟苔白二字為胃氣不清之症此病頭緒甚繁方中一一還他的對之藥詒按此等症本無必效之方似此斟酌妥帖即使難期必效亦覺心苦為分明矣脈形細數細屬陰虧數為有火火上刑金水即絶其生源未可以咳嗽小恙目之幸而氣息未喘脈象未促如能靜養猶可以作完人生地麥冬沙參石決明地骨皮桑皮阿膠枇杷葉露詒按此清滋金水兩藏之平劑但患陰虛而不挾別項邪機者可仿此調之
