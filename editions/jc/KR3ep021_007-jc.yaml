body:
  text: 下卷嘔噦門上焦吐者從乎氣氣屬陽是陽氣病也胸為陽位陽位之陽既病則其陰分之陽更屬大虛不言而喻恐增喘汗吳萸乾薑人參川附茯苓半夏木香丁香炙草飴糟食鹽陳皮再診進溫養法四日不吐今晨又作想是陽氣大虛濁陰上泛究屬膈症之根不能不慮其喘汗前方去乾薑加當歸生薑原注陽氣大虛濁陰上泛此病之樞紐也吳茱萸湯補胃陽佐以熟附丁香溫之至矣輔以二陳燥其痰飴糟去其垢更加炙草以和中食鹽以潤下用意極其周密食則右脅下痛痰自上升升則得吐而安右脈弦滑左關堅急寸部獨小此心氣下鬱於肝經脾弱生痰為膈放開懷抱第一要義旋覆代赭湯去姜加生於術白芥子炙草廣皮竹油另丸方六君子湯加當歸白芍生地蓯蓉沉香白芥子竹油薑汁泛丸原注心氣下郁脾弱生痰方中於朮乾薑二陳竹油補脾化痰之藥也更有白芥子消膜外之痰旋覆花開心氣之結赭石鎮肝氣之逆用意層層都到食則噎痛吐去濁痰而止胸前常悶脈象弦滑舌苔滿白肌肉瘦削之人陰血本虧今陽氣又結陰液與痰濁交阻上焦是以胃脘狹窄也久則防膈乾薑薤白炙草杵頭糠神麯丁香木香熟地白蔻仁歸身白芍沉香牛黃竹油再診胸前所結之邪原有化意無如陰之虧陽之結尚與前日相等非一兩劑所能奏效乾薑薤白炙草茯苓丁香木香陳皮麻仁旋覆花代赭石歸身白芍杞子牛黃竹油詒按此氣結痰阻之症用藥極周到嗜酒中虛濕熱生痰痰阻膈間食下不舒時欲上泛年已甲外營血內枯氣火交結與痰相併欲其不成膈也難矣七聖散加歸身白芍薤白代赭石藕汁紅花原注嗜酒者必多濕熱須用竹茹連蔻又易挾瘀參入藕汁紅花薤白辛而兼滑又是一格絕去溫熱剛燥之品先生曰惟善用溫藥者不輕用溫藥信然向患偏枯於左左屬血血主濡之此偏枯者既無血以濡經絡且無氣以調營衛營衛就枯久病成膈然一飲一食所吐之中更有濁痰紫血此所謂病偏枯者原從血痹而來初非實在枯槁也勉擬方每日服人乳兩三次間日服鵝血一二次詒按偏枯已屬難治更加以膈愈難措手矣方只寥寥兩味而潤液化瘀通痹開結面面都到此非見理真切而又達於通變者不能有此切實靈動之方愚意再增韭汁一味似乎更覺親切脈形細澀得食而噎胸前隱隱作痛瘀血內阻胃絡不通此膈症之根歸鬚白芍白蜜蘆根瓦楞子醋煅韭汁人參桃仁詒按此瘀血膈也脈症均合用藥亦專注在此瘀血挾痰阻於胸膈食則作痛痛則嘔吐右脈澀數惟左關獨大且弦是痰瘀之外更有肝經之氣火從而和之為患乃膈症重候慎之歸身白芍蘆根瓦楞子紅花絲瓜絡橘絡竹油白蜜原注以上三病皆瘀膈也第一症從偏枯中想出血痹用人乳以潤其枯燥鵝血以動其瘀血此症非特剛劑不受並柔補之藥亦不可投萬不得已而為此法仍是潤液化瘀之意柔和得體第二症從胸前隱痛而知其瘀阻胃絡用桃仁醋煅瓦楞子以化其瘀此症血瘀液涸無論乾薑不可用即薤白辛溫通氣亦與此隔膜然非辛不能通計惟用濡潤之韭汁以通之蜜蘆歸芍奠安營分以其液涸也此病不見痰所以純從濡潤去瘀之法第三症見痰所以瓦楞子紅花外又加竹油一味濕熱生痰阻於胃脘得食則噎噎甚則吐此膈之根也半夏陳皮川連竹茹白蔻生薑雞距子枇杷葉查炭原注指為濕熱想因苔帶黃色也用七聖散者中有橘皮竹茹湯又有溫膽湯兩方在內更加枇杷葉泄肺查炭消瘀雞距子消酒積總不外濕熱二字此猶是膈之淺者食已即吐脈弦苔白便溏溺清濕痰內勝被肝經淫氣所沖旋覆花代赭石陳皮半夏萊菔子生薑茯苓雪羹湯再診吐逆大減胸前尚痞噯氣不舒旋覆代赭湯雪羹湯詒按此症陰液未曾大虧通陽開結專理其痰痰降而嘔逆自減尚非症之重者咽中介介如有炙臠痰氣交阻為患蘇葉半夏川樸茯苓竹茹陳皮石決明牛膝原注此咽膈也痰結於肺用四七湯以理其氣合溫膽湯以化其痰去枳實換牛膝者欲其達下焦也得食多噦許氏法主之丁香陳皮川樸半夏茯苓甘草枇杷葉茅根原注此枇杷葉散去香薷一味也此另是一種暑邪挾寒飲內停或食瓜果致中氣不調而嘔噦者不當深求之裡也去香薷者無表症也食已即吐本屬胃病宜用溫通然口雖干苔反白將吐之時其味先酸此必有肝火鬱於胃府似與胃家本病有間左金丸合溫膽湯雪羹湯詒按辨症精細用藥妥切濕病門脾陽不足濕濁有餘少納多脹舌白脈遲茅朮理中湯合四七湯詒按此濕滯而兼氣鬱之症痹氣門胸痛徹背是名胸痹痹者胸陽不曠痰濁有餘也此病不惟痰濁且有瘀血交阻膈間所以得食梗痛口燥不欲飲便堅且黑脈形細澀昨日紫血從上吐出究非順境必得下行為妥全栝蔞薤白旋覆花桃仁紅花瓦楞子元明粉合二陳湯詒按方法周到不蔓不支擬加參三七磨沖胸痹症前人無有指為瘀血者如此症納食梗痛乃瘀血阻於胃口當歸入噎膈症內論治矣心痛徹背是名胸痹久而不化適值燥氣加臨更增咳嗽咽乾痰中帶紅脈形細小治之不易栝蔞薤白枳殼橘紅杏仁桑葉枇杷葉詒按既因燥氣加臨痰紅嗌乾似當參用清潤如喻氏法擬加旋覆花南沙參麥冬桑皮脘腹痛門心痛有九痰食氣居其三三者交阻於胃時痛時止或重或輕中脘拒按飲食失常痞悶難開大便不通病之常也即有厥症總不離乎痛極之時茲乃反是其厥也不發於痛極之時而每於小便之餘陡然而作作則手足牽動頭項強直口目歪斜似有厥而不返之形及其返也時有短長如是者三矣此名癇厥良以精奪於前痛傷於後龍雷之火挾痰涎乘勢上升一身而兼痛厥兩病右脈不暢左脈太弦蓋弦則木乘土位而痛又挾陰火上衝而厥必當平木為主兼理中下次之蓋恐厥之愈發愈勤痛之不肯全平耳川椒七粒烏梅三分青鹽一分龍齒三錢查炭三錢神麯三錢萊菔子三錢延胡錢半川楝子錢半青皮七分橘葉一錢竹油一兩詒按厥發於小解之時其厥之關於腎氣可知矣用藥似宜兼顧立方選藥熨帖周到再診據述厥已全平痛猶未止便黑溺黃右脈反弦想諸邪都合於胃也胃為府以通為補懸擬方芍藥青皮陳皮黑梔川貝丹皮查肉竹油萊菔子青鹽延胡詒按諸邪都合於胃從右脈之弦看出是病機緊要處三診痛厥已平尚有背部隱疼之候腰部亦疼氣逆咳嗆脈形細數想肝腎陰虛氣滯火升肺俞絡脈因之俱受其傷也四物湯旋覆花湯二母雪羹湯四診腰脊尚疼咳嗽不止苔白底紅脈形弦細是陰虛而挾濕熱也豆卷蒺藜黑梔川芎歸身麥冬沙參甘草雪羹湯半夏原注此素有痰積又腎虛而相火上衝於胃胃中痰飲阻滯竅隧癇厥見焉第一方用泄肝和胃法以化其阻滯合金鈴子散以清肝火加查曲以消食菔子竹油以化痰厥平而痛未愈故第二方用景岳化肝煎以代金鈴子散兼以化痰第三方通其絡第四方仿白蒺藜丸專於治痰詒按此症得力全在前兩方疏肝化痰絲絲入扣脾氣素虛濕鬱難化而木之鬱於內者更不能伸所以酸水酸味雖有減時而灰白之苔終無化日無怪乎脈小左弦脘脅脹痛也此臌脹之根毋忽附子理中湯合二陳湯加川樸香附川芎神麯詒按似可參用柴芍輩於土中泄木病分氣血不病於氣即病於血然氣血亦有同病者即如此病胃脘當心而痛起於受飢得食則緩豈非氣分病乎如獨氣分為病理其氣即可向安而此痛雖得食而緩午後則劇黃昏則甚屬在陽中之陰陰中之陰之候其為血病無疑況但頭汗出便下紫色脈形弦細而數更屬血病見症但此血又非氣虛不能攝血之血乃痛後所瘀者瘀則宜消虛則宜補消補兼施庶幾各得其所治中湯合失笑散另紅花元明粉為末和勻每痛時服二錢原注分明兩病一是脾虛氣分不能暢達而痛得食則緩宜補可知然人每疑痛無補法者以痛必有痰氣凝滯也先生用理中以補脾即加青皮陳皮以通氣至便紫脈弦數肝家之血必有瘀於胃脘者此時不去其有形之瘀滯痛必不除病根不拔也此種病世醫不能治往往以為痼疾不知不去瘀則補無力徒去瘀則脾胃更傷先生則雙管齊下立案清澈度盡金針非名家惡能如是胃脘當心而痛少腹氣升嘔吐酸苦痰涎脈形弦數顯系寒熱錯雜之邪鬱於中焦肝屬木木乘土位所有積飲從此沖逆而上病已年餘當以和法附子理中湯加川連薑汁炒川椒黃柏歸身細辛半夏桂枝烏梅肉原注此連理湯合烏梅丸吐涎酸苦是胃中錯雜之邪用薑連半夏以化之逆沖而上之肝氣用烏梅法以和之詒按半夏反附子在古方多有同用者然可避則避之亦不必故犯也胃脘當心而痛脈形弦數舌絳苔黃口乾苦小便赤一派火熱之象氣從少腹上衝於心豈非上升之氣自肝而出中挾相火乎化肝煎芍青梔澤丹陳貝脘痛下及於臍旁及於脅口乾心悸便慄溺黃脈弦而數此鬱氣化火也化肝煎合雪羹原注此景岳化肝煎也必肝有實火者可用口乾脈數溺黃是其的症也中焦失治為痛以治中湯為法是正治也不知中焦屬土土既虛不能升木木即鬱於土中亦能作痛以逍遙散佐之更屬相宜治中湯逍遙散雪羹詒按此木鬱土中之病立方妥帖易施瘀血腹痛法宜消化然為日已久脾營暗傷又當兼補脾陰為安歸脾湯去耆朮加丹參延胡詒按此病用補是專在痛久上著眼當臍脹痛按之則輕得食則減脈形細小而數舌上之苔左黃右剝其質深紅中虛伏熱使然治中湯加川連雪羹詒按此等症不多見立方亦甚難須看其用藥的當處少腹久痛未痊手足攣急而疼舌苔灰濁面色不華脈象弦急此寒濕與痰內壅於肝經而外攻於經絡也現在四肢厥冷宜以當歸四逆湯加減當歸小茴香炒白芍肉桂炒木通半夏苡仁防風茯苓橘紅詒按寒濕入於肝經病與疝氣相似治法亦同再診少腹之痛已止惟手冷攣急未愈專理上焦蠲痹湯防羌薑黃歸耆草赤芍去防合指迷茯苓丸少腹作痛甚則嘔吐脈右弦左緊俱兼數舌苔濁膩口中乾苦頭脹溺赤此濕熱之邪內犯肝經挾痰濁上升所致泄之化之得無厥逆之虞為幸旋覆花湯三子養親湯蘇子白芥子萊菔子金鈴子散另烏梅丸詒按旋覆金鈴以止痛三子以除痰更用烏梅丸以泄肝所以面面都到也再診嘔吐已減白苔稍化頭脹身熱亦緩惟腹之作痛便之下利脈之緊數以及口中之干苦小水之短赤尚不肯平肝經寒熱錯雜之邪又挾食滯痰濁為患也仍宜小心葛根黃芩黃連湯加延胡查炭赤苓陳皮萊菔子另烏梅丸詒按想因下利較甚故用藥如此轉換三診餘邪流入下焦少腹氣墜於肛門大便泄小便短舌苔未淨更兼痔痛四苓散合四逆散加黃芩黃柏木香詒按至此而內伏之濕熱從兩便而外泄矣肝脈布於兩脅抵於少腹同時作痛肝病無疑肝旺必乘脾土土中之痰濁濕熱從而和之為患勢所必然逍遙散柴荷苓朮歸芍草加梔丹合化肝煎詒按此治肝氣脅痛誠然合劑案所云濕熱痰濁雖能兼顧嫌未著力氣結於左自下而盤之於上脹而且疼發則有形解則無跡甚則脈形弦數口舌乾燥更屬氣有餘便是火之見症急須化肝化肝煎詒按凡肝氣上逆者多挾木火為病故化肝煎為要方中脘屬胃兩脅屬肝痛在於此忽來忽去肝胃之氣滯顯然已歷二十餘年愈發愈虛愈虛愈痛氣分固滯血亦因之乾澀也推氣為主逍遙佐之肉桂枳殼片薑黃延胡炙草逍遙散再診病勢不增不減診得左脈細澀右部小弱氣血久虛致使營衛失流行之象非大建其中不可肉桂歸身白芍川椒飴糖乾薑陳皮炙草砂仁原注前方嚴氏推氣散也先生謂左脅作痛是肝火用抑青即左金以瀉心平木右脅作痛是痰氣用推氣法以理氣化痰按薑黃入脾能治血中之氣蓬朮入肝能治氣中之血鬱金入心專治心胞之血三物形狀相近而功用各有所宜詒按久病中虛故轉方用大建中法腹左氣攻脹痛上至於脘下及少腹久而不愈疝瘕之累也痛極之時手足厥冷嘔逆當從肝治當歸四逆湯歸桂芍草辛通薑棗合二陳湯吳仙散吳萸茯苓詒按病偏於左更加支厥此肝病確據也再診痛勢已緩尚有時上時下之形邪未盡也吳仙散合良附散二陳湯去甘草加當歸小茴香炒白芍肉桂炒疝氣門狐疝臥則入腹立則出也補中益氣湯另金匱腎氣丸合小安腎丸香附川烏茴香椒目川楝熟地原注疝氣一症論其本末有不由氣虛而濕濁隨之下陷者故以補中益氣湯為主方俾脾之清氣得以上升則小腸膀胱之濁氣自然下降又有挾勞倦外感而發者方中柴胡借用亦妙寒加溫藥濕火甚加知柏詒按此因下墜過甚故用補中以升清氣其實亦非治疝正法也脾宜升主健胃宜降主和此病氣升而嘔胃不降也疝氣下墜脾不升也而所以升降不調者由脾虛下陷濕痰中結而沖逆於胃脘也理其中陽則上下自調六君子湯加乾薑青皮小茴香萆薢九香蟲詒按此因嘔吐有上逆之勢故不用補中而變法治之又按此症若用烏梅丸則上下均在治中緣痛嘔疝氣均由肝病故也再診治中胃痛已和疝氣仍然下墜擬於補脾之外佐以補腎使其火土合德則陽旺於中而生氣勃然不升自升矣香砂六君丸合金匱腎氣丸詒按此症從肝經著意似較靈動專補脾腎猶恐涉於呆實狐疝原屬肝經之濕隨氣下陷脾陽必衰而今夏多食冷物陽氣又被所遏苔白不幹指冷脈小右睪丸脹大當以溫散大順散乾薑肉桂杏仁甘草加當歸木香荔枝核詒按此因生冷傷中故用大順亦非治疝正法瘕癖門寒氣客於腸外與血沫相搏臍下結瘕脹大下墜不時作痛痛則氣升自汗脈形弦澀此為鼓脹之根毋忽吳萸茯苓當歸川楝子橘紅烏藥香附楂肉詒按即因於寒似可再加溫通之品既與血沫相搏似宜兼和營血瘕聚脘中久而不化變為攻痛升逆妨食便堅理之不易川楝子延胡當歸白芍陳皮鱉甲紅花血餘茯苓牛膝丹皮詒按此病之偏於血分者故方中兼用疏瘀之品特所敘病情尚無瘀血的據最虛之處便是容邪之處肝絡本虛隱癖久踞中宮又弱隱癖潛入其間欲治此病培補肝脾為主和化次之歸芍六君子湯加雞內金另小溫中丸詒按此亦虛實兼治之法然而收效甚難脈來細而附骨者積也已經半載不過氣行作響而已而其偏於脅下者牢不可破是寒食挾痰阻結於氣分也此等見症每為脹病之根理中湯加神麯茯苓半夏陳皮麥芽旋覆花枳殼歸身再診脅下隱癖牢不可破其氣或逆或攻必溫化以絕脹病之根理中湯合二陳湯加川樸枳殼神麯竹油旋覆花白芥子詒按議論則見微知著用藥則思患豫防此為高識食入而痛是有積也積非一端就脈弦數二便黃熱乾咳不爽面黃苔白言之必有濕熱痰食互相阻滯經年累月無路可出無力以消茅朮川芎查炭神麯川貝山梔赤苓枇杷葉露杏仁詒按此越鞠丸加味也愚意再加白芍枳實寒熱後脘左隱癖作疼脈形弦細舌苔濁厚濕熱痰食交相為患二陳湯去甘草合雞金散砂沉陳雞香丸加蘇梗查肉青皮詒按此尚是初起實症故用攻消法取效立方亦極平穩再診脘左之隱癖漸消舌上之濁苔漸化仍宗前法參入補脾之品前方去蘇梗加於術炙草另服水泛資生丸隱癖踞於脅下肝經病也化肝煎詒按此亦初起之病想由肝鬱而起故專從泄肝立法但恐藥輕不能奏效耳原注前症濕熱居多此症肝火為重相機而治各有條理瘧久邪深入絡結為瘧母瘧母在左自下攻逆加以右脅結癖上下升降俱窒無怪乎中宮漸滿理之不易雞金散加枳殼薑黃白芥子竹油另鱉甲煎丸原注左屬血屬肝瘧邪滯於血中主以鱉甲煎丸右屬氣屬胃或痰或食主以雞金推氣加竹油白芥子詒按此兩層兼治之法腫脹門營血本虧肝火本旺責在先天乃後天脾氣不健肝木乘之所進飲食生痰生濕貯之於胃尚可從嘔而出相安無事遲之又久滲入膜外氣道不清脹乃作焉脾為生痰之源胃為貯痰之器若非運化中宮兼透膜外則病勢有加無已成為臌病亦屬易易夫脾統血肝藏血病久血更衰少不得不佐以和養古人之燥濕互用正為此等症設也歸芍六君子湯去參草加白芥子萊菔子車前子川樸蘇子腹皮竹油雪羹詒按用藥虛實兼到親切不浮諸腹脹大皆屬於熱諸濕腫滿皆屬於脾脾經濕熱交阻於中先滿後見腫脹膚熱微汗口渴面紅理之不易防己茯苓石膏腹皮陳皮再診濕熱滿三焦每多腫脹之患如邪勢偏於下焦小便必少前人之質重開下者原為此等症而設然此病已久尚盛於中上二焦胡以中上兩焦法施之諸恙不減或者病重藥輕之故將前方制大其劑竹葉石膏鮮生地麥冬知母半夏五皮飲原注此十二歲女子腹暴脹大面跗俱腫面紅口渴小便黃此症屬熱所見甚少詒按此等方治脹病非有卓見者不能存之為臨症者增一見解脘腹膨脹二便失調經絡痠痛四肢無力脈形弦細舌苔白膩而厚此濕邪內郁當用苦辛宣泄茅朮川芎香附黑梔神麯腹皮川樸赤苓澤瀉蔞皮詒按此亦濕鬱而化熱者故兼用梔蔞清泄之品再診諸恙向安肢體無力健脾為主香砂六君子湯原注此越鞠改方而加胃苓之半本方治濕鬱其眼在舌苔白膩而厚在所必效余每藉以治黃疸亦效挾痰頭項痛亦效脾主濕濕因脾虛而鬱鬱蒸為熱所以隱癖僭逆中宮大腹脹滿納少便溏面黃溺赤咳嗽身熱時作脈息弦細極易成臌越鞠丸附蒼芎曲梔雞金散加赤苓青蒿黃芩川樸原注此越鞠症而兼隱癖濕化熱者故合雞金消癖芩蒿化熱原注以上越鞠丸症大約越鞠治無形濕熱之痞從瀉心化出雞金治有形食積之癖從陷胸化出且如脘痛門中郁痰作痛脈數多渴者用清中蠲痛湯山梔薑汁炒乾薑川芎童便炒黃連薑汁炒蒼朮童便浸切麻油炒香附醋炒神麯薑汁炒橘紅薑棗治中脘火鬱作痛發即寒熱中以寒熱為主即越鞠加薑連橘棗可知此方治氣火濕食血五者之郁信極妙矣說者以梔主火朮主濕香附主氣芎主血曲主食分為五郁似可不必正如五音必合奏而始和也大腹脹滿已經四十餘日近來氣更急促足跗浮腫溺黃口乾脈形弦數濕熱之邪因氣而阻因食而劇理之不易廓清飲廓清飲用芥陳樸枳澤茯苓同大腹菔子生研壅滯通氣逆脹滿均堪服去芥枳加黑梔豬苓蘇梗川連香附原注溫藥留手處在口乾溺黃四字脾虛則濕熱內郁為臌從去郁陳莝例治之廓清飲去芥加蘇葉香附冬朮另小溫中丸朝暮各錢半詒按腹滿由於脾之不運其所以不能運者痰也濕也濁也氣也瘀也故方中多用疏氣化痰清利濕熱之品大腹主脾腹大而至臍突屬脾無疑然脹無虛日痛又間作舌苔薄白脈息沉弦見於經期落後之體顯系血虛不能斂氣氣鬱於中寒加於外而脾經之濕因而不消逍遙散合雞金散加香附詒按沉弦與沉細不同沉細色萎則理中症此症拈住郁字故用逍遙單腹脹脾氣固虛久則腎氣亦虛大便溏者氣更散而不收矣所用之藥比之尋常溫補脾腎者當更進一層然用之已晚惜乎附桂理中湯加肉果當歸牡蠣木瓜茯苓生脈散詒按案云較之尋常溫補更進一層觀方中所加肉果當歸是啟峻法也大腹脹滿便溏舌苔冷白干喜熱飲膚熱脈數脾陽大虛無力運化濕濁而成臌也理之棘手附桂治中湯加木瓜草果當歸再診進溫補四劑腹脹漸和其邪從下焦而泄所以大便作瀉然膚熱未退小便未長干欲熱飲胃不思谷白苔已薄舌質轉紅中陽稍振濕熱未清理苓湯原注舌苔冷白是桂附把柄四劑而能便泄邪從下出中陽尚好脾氣尚未衰盡更以舌質轉紅知濕熱壅甚所以轉方減去附桂參朮已足扶脾外加四苓驅濕而已大便作瀉小水又長肝脾腎三經即有陰邪亦可從此而消何以隱癖尚踞於中腹脹不和是陽虛也四君子湯加黃耆當歸桂枝附子陳皮肉果沉香乾薑牡蠣鱉甲雞內金原注此啟峻湯也附子理中加黃耆當歸肉果比附子理中更進一層太陰腹滿寒濕有餘真陽不足脈弦下體不溫幹不欲飲妨食氣短其勢頗險擬以溫通化濕法附子茅朮治中湯加川樸半夏詒按此亦通補兼施之法溫補元陽浮腫脹滿有增無減陽之衰也極矣臍平脈遲之候非溫不可非補亦不可然溫補亦不見長蓋下泄者腎更傷耳附子理中湯合四神丸來復丹詒按此法較腎氣丸更進一層太陰腹滿寒濕使然陽若不旺勢必成臌附子理中湯加川樸大腹皮澤瀉豬苓詒按此脾陽不振寒濕停滯之症故用溫化法中滿者瀉之於內其始非不遽消其後攻之不消矣其後再攻之如鐵石矣此病雖不至如鐵石而正氣久傷終非易事也治中湯五苓散原注以上皆理中加減法也因記當年侍先生時問理中之變換如何曰理中是足太陰極妙之方如以中宮之陽氣不舒用乾薑者取其散少腹之陽氣下陷用炮姜者取其守其變換在大便之溏與不溏濕甚而無汗者用茅朮濕輕而中虛者用冬朮其變換在舌苔之濁與不濁此本方之變換也設脾家當用理中而胃家有火則古人早定連理一方矣設氣機塞滯古人早定治中一方矣設脾家當用理中而其人真陰虧者景岳早有理陰煎矣其腎中真陽衰者加附子固然矣其衰之甚者古人又有啟峻一方矣此外加木瓜則名和中必兼肝病加枳實茯苓治胃虛挾食古人成方苟能方方如此用法何患不成名醫哉因附錄之以為用理中之法諸濕腫滿皆屬於脾因勞倦所傷內濕與外濕合而為一鬱於土中致太陰之氣化不行治病必求其本先以實脾法川附於術茯苓陳皮草果大腹皮烏藥木瓜澤瀉詒按案云實脾而方中仍屬溫通之品此非實脾正法也初起痞滿繼增腹脹臍突筋露足跗浮腫大便溏泄此濕熱內壅中虛不化勢從下走也用藥最為棘手且從口苦舌紅小便短赤立方桂心茯苓豬苓白朮澤瀉石膏寒水石滑石詒按此河間甘露飲也用五苓以降濕三石以清熱咳而腹滿經所謂三焦咳也苔黃干苦臥難著枕肢冷陽縮股痛囊腫便溏溺短種種見症都屬風邪濕熱滿布三焦無路可出是實症也未可與虛滿者同日而語桑皮骨皮苓皮蔞皮大腹皮姜皮防己杏仁蘇子葶藶子車前子詒按濕熱壅盛脾不輸運肺不肅降故立方專用疏化仿五皮五子法中陽不足寒濕有餘脘痞納少舌白便溏脈細小法當溫化即平為妙茅朮理苓湯加大腹皮雞內金葛花川樸再診溫化不足以消脹滿陽之虛也甚矣重其制以濟之茅朮錢半川附錢半乾薑錢半黨參三錢肉桂七分防風二錢茯苓三錢五加皮三錢陳皮一錢三診諸恙向安仍守前法以祛留濕川附一錢桂枝一錢黨參三錢生於術錢半乾薑四分茯苓錢半詒按茅朮改於術想重濁之白苔已化也此症純以溫化得效所謂陽運則濕自化也隱癖日久散而為臌所以左脅有形作痛大腹漸滿便出紅色垢積更兼脘中因食而痛久吐痰涎帶瘀元氣益虛竟有不克支持之象收散兩難洵屬棘手香圓皮人中白桃仁泥雞內金炙鱉甲射干牡蠣川貝母陳皮砂仁雪羹詒按別錄謂射干治老血作痛再診大便之紅積已除胃中之痰涎仍泛大腹之脹滿如此何堪磨耐前方去陳貝加瓦楞子延胡丹參鮮藕原注此癖散成臌上下見血分明有瘀消瘀消癖一定之理無如此症元氣大虧不任攻消又不可補乃組織此化瘀化癖不甚克伐之方病雖減半究屬難痊素有隱癖肝脾之不調可知去年血痢於下痞結於中久未向愈大腹脹滿溺赤舌黃脈形弦細而數濕熱內聚脾虛無力以消極易成臌毋忽歸芍異功散加川連川樸木香另枳實消痞丸小溫中丸詒按立方穩實惟歸芍異功似嫌補多消少脹者皆在臟腑之外此病之脹不從腹起自足跗先腫而後至腹是由下以及上因脾虛不能運濕濕趨於下尚在本經腫脹及中又屬犯本也腫脹之處按之如石陽氣大傷理之棘手附桂治中湯加肉果當歸防己牛膝另腎氣丸詒按方中防己外無治濕之品據症情論似當兼參滲利隱癖僭逆中宮臍雖未突青筋漸露勢欲散而為臌況大便時溏時結脾氣久虛更屬棘手擬以攻補兼施法枳實消痞丸枳連樸朮夏苓參薑麥芽草加雞內金當歸鱉甲白芍牡蠣詒按此已成脹病矣而中宮先虛又難攻克此等症最費經營而又最難得效頭痛門頭痛取少陽陽明主治是為正法即有前後之別不過分手足而已石膏竹葉生地知母甘菊丹皮黑梔橘紅赤苓桑葉蔓荊子天麻詒按此頭痛之偏於風火者故用藥專重清泄一面脈弦數大苔厚中黃頭痛及旁陽明濕熱挾膽經風陽上逆也大川芎湯川芎天麻合茶酒調散芷草羌荊芎辛防薄二陳湯加首烏歸身白芍詒按此亦少陽陽明兩經之病但風陽既以上逆似當參用清熄之意乃合芎辛羌芷未免偏於升動矣高巔之上惟風可到到則百會腫疼且熱良以陰虛之體陰中陽氣每易隨之上越耳生地歸身白芍羚羊角石決明煨天麻甘菊黑梔丹皮刺蒺藜詒按此陰虛而風陽上越者故用藥以滋熄為主肢體痛門肝居人左左脅不時攻痛甚則厥逆左關沉小帶弦是肝氣鬱而不升也右脈弦滑舌苔薄白喜飲熱湯又有濕痰內阻當兼治之推氣散合二陳湯詒按用推氣散以疏肝鬱合二陳湯以治濕痰竟如兩扇題作法脈沉弦滑腿骱刺痛腰部痠疼背脊作響諸節亦然舌苔白濁風濕痰三者著於肝腎之絡也肝著湯合腎著湯苓朮薑草桂枝湯詒按此症病在於絡當從經絡著意遺精門腎者主蟄封藏之本精之處也精之所以能安其處者全在腎氣充足封藏乃不失其職虛者反是增出脛酸體倦口苦耳鳴便堅等症亦勢所必然然左尺之脈浮而不靜固由腎氣下虛而關部獨弦獨大獨數舌苔黃燥厥陰肝藏又有濕熱助其相火火動乎中必搖其精所謂肝主疏泄也虛則補之未始不美而實則瀉之亦此症最要之義天冬生地黨參黃柏炙草砂仁龍膽草山梔柴胡詒按此三才封髓丹加膽梔柴胡方與案若合符節再診大便暢行口中乾苦亦愈左關之脈大者亦小惟弦數仍然尺亦未靜可以前方增損三才封髓丹加茯神龍膽草柏子仁三診久積之濕熱下從大便而泄然久病之體脾腎元氣內虧又不宜再瀉當以守中法異功散加白芍荷葉蒂秫米四診大便已和脈形弦數數為有火弦主乎肝肝經既有伏火不但順乘陽明而且容易搖精精雖四日未動究須小心三才封髓丹加陳皮白芍另豬肚丸苦參白朮牡蠣豬肚原注此症拈定左關獨大獨弦獨數所以重用膽草黑梔直折其肝家鬱火俾濕熱之邪從大便而出金本制木今木火太旺反侮肺金肺金尚受其克則其吸取腎水疏泄腎精更屬易易此夢泄咳嗽之所由來也三才封髓丹加白芍龍膽草再診接來札知所言夢遺者有夢而遺者也比之無夢者大有分別無夢為虛有夢為實就左脈弦數而論弦主肝數主熱熱伏肝家動而不靜勢必搖精蓋腎之封藏不固由肝之疏泄太過耳三才封髓丹加牡蠣龍膽草青鹽三診疊進封髓秘丸而仍不主蟄細診脈息左關獨見沉弦且數肝經之疏泄顯然萆薢分清飲菖薢草烏藥益智青鹽去菖合三才封髓丹加龍膽草四診病已大減仍守前法前方加白芍原注病得萆薢瞿麥而大減是濕重於火也詒按首案遺泄咳嗽並提方凡四易而未曾有一味顧及咳嗽想以肝火為本治其本而標病可置之耳夢中遺泄久而無夢亦遺加以溺後漏精近日無精而小水之淋漓而下者亦如漏精之狀始而氣虛不能攝精繼而精虛不能化氣三才封髓丹加蛤粉芡實金櫻子詒按此腎中精氣兩損之症再合腎氣聚精等法較似精密曾經失血現在遺精精血暗傷當臍之動氣攻築漫無愈期肢體從此脫力語言從此輕微飲食從此減少無怪乎脈息芤而無神也病情如此虛已甚矣而舌苔膩濁中宮又有濕邪治須兼理杞子熟地芡實查炭石蓮子當歸茯苓金纓子蓮鬚另清暑益氣湯去朮瀉草原注此九龍丹也吳鶴皋云主治精濁再診前方小效小變其制九龍丹加於術半夏茯苓陳皮五倍子煎送威喜丸詒按陰虛而挾濕邪最難用藥須看其兩面照顧處白濁久而不痊以致腎失封藏夢遺更甚少寐少納面痿脈少九龍丹合天王補心丹另豬肚丸原注膏淋有便濁精濁兩種便濁是胃中濕熱滲入膀胱與腎絕無相干精濁牽絲黏膩不溺亦有是腎虛淫火易動精離其位漸漬而出治宜滋腎清心健脾固脫九龍丹方中杞地歸滋陰以制陽櫻蓮芡澀以固脫石蓮子苦寒清心心清則火不熾白茯苓甘平益土以制腎邪尤妙在山楂一味能消陰分之障前一案氣虛挾濕熱故合清暑益氣後一案心火挾濕熱故合補心豬肚氣虛不能攝精精虛不能化氣所進飲食徒增痰濕六君子湯加菟絲餅炮薑炭韭菜子原注純從脾藏氣虛立案詒按案語簡潔老當方亦周到小便門陰虛之體心火下鬱於小腸傳入膀胱之府尿中帶血時作時止左脈沉數小水不利生地木通甘草竹葉火府丹另大補陰丸詒按此用導赤散合火府丹以清心火即用大補陰丸以滋陰虛實兼到經曰胞移熱於膀胱則癃溺血又曰水液渾濁皆屬於熱又曰小腸有熱者其人必痔具此三病於一身若不以涼血之品急清其熱遷延日久必有性命之憂導赤散合火府丹加燈心又丸方固本丸合大補陰丸豬脊髓丸加萆薢詒按火甚者陰必傷火清之後隨進丸藥以滋其陰膏淋血淋同病未有不因乎虛亦未有不因乎熱者熱如化盡則膏淋之物必且下而不痛始可獨責乎虛大補陰丸加栝蔞瞿麥牛膝血餘詒按議論雋爽方亦切實再診所下之淋薄且少矣而當便之時尚屬不利既便之後反覺隱痛肢膝不溫脈小弦唇紅嗌乾熱未全消虛已漸著栝蔞瞿麥去附湯加麥冬萆薢黑梔豬脊筋詒按便後隱疼膝冷咽乾皆虛象也似當兼用滋養曾患淋症小便本難近來變為癃閉少腹硬滿小便腫脹苔白不渴脈小而沉下焦濕熱被外寒所遏膀胱氣化不行最為急症恐其喘汗肉桂五苓散加木香烏藥枳殼另蔥一把麝香三釐搗餅貼臍詒按此溫通法也惟由淋變癃氣分必虛補中益氣等法亦可隨宜佐用泄瀉門飧泄不由乎胃滯即系乎陽弱此乃兼而有之脈遲噯腐脘痛附子理中湯合二陳湯加川樸吳萸防風詒按噯腐脘痛食滯頗重擬去二陳加神麯砂仁菔子下利轉瀉腎病傳脾脾因虛而受邪溫化為宜理中湯合四苓散加陳皮防風伏龍肝詒按由利轉瀉或有因濕邪未淨者方中用四苓伏龍肝即此意否發熱之餘腹痛便溏表邪下陷也小柴胡湯加白芍木香茯苓澤瀉詒按此時邪下陷之症大便門脾虛不能化濕焉能統血血雜於水濕之中下注不止茅朮地榆皮槐花炭鬱金再診無毒治病不必愈半而不取也仍服原方可耳原注此茅朮地榆湯其人便血挾水而下已及半載人不困憊而面黃大約濕熱有餘之體此病兩帖愈半四帖全愈詒按審症的確用藥精當有以匙勘鑰之妙腸澼便血時重時輕或痛或否脈形細小飲食少此虛也恐增浮喘歸脾湯加薺菜花荷葉粳米詒按此補脾攝血之正法也稍加和胃之品如廣皮砂仁輩更為周密便血之前先見盜汗盜汗之來由於寒熱寒熱雖已而盜汗便血之症不除脈小而數氣陰兩虛之病也歸脾湯去桂圓加丹皮山梔地榆桑葉詒按此症營分中必有留熱宜於清營一邊著意但顧其虛猶未周到陰絡傷則血內溢為日已久陰分固傷陽分亦弱而身中素有之濕熱仍未清楚恐增浮喘大熟地伏龍肝阿膠白朮赤小豆附子黃芩炙草當歸地榆炭烏梅肉詒按此金匱黃土湯加味陰陽並治而兼清濕熱立方頗為周到濕熱傷營腹臌便血久而不愈左脈細澀右芤寸大尺小加以浮腫氣分亦虛不但不能攝血而且不能清化濕熱防喘黃土湯黃地朮附膠芩土加大腹皮桑皮五加皮黨參槐花原注原方之妙附子扶脾之母黃芩清肝之熱熟地滋腎之陰白朮培脾之本阿膠涼血之熱各臟照顧非仲景不能作也詒按增入之藥亦能與病機恰當紅白痢變為便血當時血色尚鮮後又轉為紫黑或帶血水而不了結暑濕深入營中氣虛無力以化降而不升也駐車丸連膠薑歸加廣木香黨參甘草伏龍肝薺菜花詒按此症血分中有留邪尚宜參用和血之品再診血雖漸止氣猶降而不升補中益氣湯去陳皮合駐車丸加赤芍伏龍肝痔疾下痢臟毒三者皆屬下焦濕熱為患地榆散合三奇散耆防枳殼加廣木香詒按立方精到擬再增銀花丹皮大小便易位而出名曰交腸驟然氣亂於中多屬暴病此症乃久病良由瘀血內阻新血不生腸胃之氣無所附而失治故所食之水穀悉從前陰而出所謂幽門者不司泌別清濁而闢為坦途比之交腸症有似是而實非者此時論治主以化瘀潤腸必大腸之故道復通乃可撥亂者而返之正旋覆花猩絳蔥管歸鬚首烏柏子仁薺菜花另舊紗帽一隻炙灰每服一錢五分酒下原注紗帽一發漆膠黏而成其亦取通瘀之意耶詒按論症用藥均有巧思特未知效否何如憶喻西昌寓意草中所載姜宜人交腸病與此相似特病原有虛實之異耳學者當參觀之蟲病門陽絡曾傷陰氣素虛更有濕熱鬱於營分日久生蟲擾亂於上中下三焦以致咳嗽喉痹惡聞食臭起臥不安肛部不舒舌質深紅其苔黃濁即仲景所謂狐惑病是也久延不愈即入勞怯之途川連三分犀角三分烏梅五分人中白一錢百部一錢丹皮一錢半甘草三分詒按讀金匱狐惑病一節此症之原委乃明脘腹作疼滿腹苦熱初起得食則痛繼而不食亦痛此肝胃不和濕熱生蟲之狀烏梅丸加青皮白芍金鈴子詒按初起得食即痛得無兼有食積否再診服前方脘腹之痛而苦熱者時作時止止則右脅下必有一塊攻築是屬蛔未安也旋覆花湯合金鈴子散加杏仁雷丸榧子詒按蛔未安者似宜仍用烏梅丸此則因右脅攻築故用金鈴子散以泄肝耳濕熱挾風生蟲作癢有似攻注之形無處不至難治之症也獺肝一錢磨開水沖服再診攻注有形而不攻注時無跡濕熱風蟲踞於痰中所致推氣散枳殼桂心薑黃草加白芥子橘紅羌活獺肝竹油另醫通沉香化氣丸大黃黃芩沉香六曲辰砂參朮竹油薑汁詒按獺肝治蟲法本千金惟案中所云攻注有形無處不到究竟或在肢體或在腹裡均未敘明無從揣測也人之涎下者何氣使然曰胃中有熱則蟲動蟲動則胃緩胃緩則廉泉開故涎下黃連丸連萸木香訶子龍骨合烏梅丸詒按方案俱高簡穩實評選環溪草堂醫案三卷環溪草堂醫案三卷梁溪王旭皋先生所著也先生名泰林字旭皋世為無錫人嘉道間有以瘍醫馳名江浙者曰高錦亭先生著有外科心得集景岳方歌括等書行世即旭皋先生之舅氏也高先生歿後先生傳其業其始先以瘍醫行逮後求治者日益多寖及內科無不應手奏效於是遂專以內科行門下士習業者每年以十數計先生讀書上自軒岐下迄國朝諸家無不精心貫串於古書則研求故訓於後人書則必分別疑似所著有西溪書屋夜話錄醫方歌括串解及環溪草堂醫案諸書均未梓行其醫案為門弟子隨時抄錄未經分別去取不免繁複者多余所得見者蓋有五六本詳略互異因屬及門諸子刪其繁亂重為抄輯最後得王家橋顧君蓮卿本系先生晚年之作又得方君畊霞新刊本案甚繁富頗有方案足取而為他本所未載者一併補錄簡其精粹分為三卷間有未盡之意隨加按語以闡明之閱一年而竣事先生居錫城去余家不百里余弱冠時猶及見之吾鄉有疑難症無不求治於先生者先生必沉思渺慮疏方與之厥後或效或否或有無力再往者先生必訪悉之令其再診以竟厥功故其所存方案無不光堅響切無模糊影響之談蓋較近賢之專以靈變取巧者不啻上下床之別矣先生博極群書所用諸法如治小兒喘嗽之藥棗從葛可久之白鳳丹化出治上熱下寒之八味丸用紫雪為衣從喻西昌外廓之論悟出若此之類不勝枚舉是皆因古法而變化出之彼胸無古書者每讀之而猝難領會余於此等處均為一一指出學者苟能即是而得讀書用古之法焉則庶乎不負先生之苦心也夫光緒二十六年重陽日江陰柳寶詒謹識上卷內傷雜病門病將一載肝氣橫逆而不平中氣久虛而不振惟肝逆故胸脘阻塞而攻衝惟中虛故營衛不和而寒熱凡大便溏飲食少右脈細左脈弦是其症也四君子合逍遙加左金是其治也黨參冬朮陳皮茯苓歸身神麯白芍柴胡鹽水炒香附鹽水炒川連吳萸炒穀芽玫瑰花詒按案語爽朗方亦的當擬再加沉香鬱金再診陽虛惡寒陰虛發熱脾虛則便溏而乏力木旺則脘痞而氣塞前方補中泄木肝氣已平合以益火生土氣血雙補黨參冬朮蓯蓉鹿角霜杞子木香菟絲子歸身白芍陳皮茯苓杜仲砂仁玫瑰花詒按肝氣平後續用培補是一定層次惟既有寒熱見症似可參用桂枝建中之意以和之三焦相火挾肝陽而上升每日清晨則氣自臍左而上衝心胸痞塞自覺胸中熱舌尖辣面色紅過午則氣漸下降至夜則安而火降則下或遺泄此皆無形之火為患也推其原始由乎陰虛今則相火妄行蒸煉胃液成痰所以吐痰黏膩灰黑而咽嗌胃管之間常覺不流利也法當清相火導虛陽而下歸窟宅更佐以化痰鎮逆病來已久難期速效黃柏鹽水炒一錢二分桂心三分砂仁炒三分蛤殼一兩甘草三分知母鹽水炒一錢二分川連鹽水炒四分茯苓三錢元精石三錢長流水煎詒按此方取交濟封髓之法用意極為精到惟病因肝腎不攝虛陽浮逆擬再加牡蠣龜板以攝下旋覆竹茹以清上似於病情更為周匝痰之標在肺胃痰之本在脾腎腎虛則水泛脾虛則濕聚二者均釀痰之本也經曰脾惡濕腎惡燥脾腎兩虛法當滋燥兼行而痰戀肺胃又宜標本同治熟地茅朮芝麻炒陳皮川貝茯苓半夏紫菀詒按案語斟酌病機切實不泛用藥亦絲絲入扣用黑地黃法以兩補脾腎合二陳以和胃苑貝以利肺藥品無多而層層都到非有簡煉工夫不能作此凡藏邪惟虛則受之而實則不受惟實者能傳而虛則不傳仲景云肝病實脾治肝邪之盛也內經云肝病緩中治肝體之虛也此症肝氣有餘肝血不足法宜兩顧為得歸身白芍沙苑杞子冬朮茯神青皮陳皮香附金鈴子砂仁詒按議論確鑿非胸中有古書者不能道方亦精到方中歸芍杞苑所以養肝血青陳香鈴所以疏肝氣藥品看似平常用意恰已周到腎水不足君火上炎相火下熾心中如燔舌光如柿陽事易舉陰精易泄擬清君火以制相火益腎陰以制肝陽所慮酷熱炎蒸恐藥力無權將亢陽為害而增劇耳川連鹽水炒黃芩黃柏阿膠生地甘草雞子黃另大黃三錢研末將雞子一個破頭納大黃三分蒸熟每日服一個再診投苦鹹寒堅陰降火以制亢陽心中之燔灼與舌色之光紅俱減三分之一然上午之身熱如燎者未退幸納食頗增苦寒可進再望轉機為妙川黃連阿膠生地元精石黃芩甘草元參蛤殼雞子黃三診舌乾紅知飢善納水虧陽亢土燥於中鹹苦堅陰之劑雖衰其燔亢之勢而未能盡除其焰時當炎暑濕熱與相火蒸騰擬復入清中固下祛濕之法仍不出鹹苦之例洋參石膏知母甘草麥冬川連阿膠生地蛤殼黃柏豬膽汁丸每朝服三錢詒按君相交燔腎陰被灼所謂一水不能勝二火此症是也僅與壯水猶難勝任必得苦以泄之咸以制之而火乃退更得苦以堅之咸以滋之而陰乃復營陰虛則氣火易升肝木橫則脾土受侮腹滿頭暈肝脾之病耳鳴喉燥虛火之愆陰虛生內熱腎虛故腰痛擬補陰潛陽扶土抑木法生地砂仁炒四兩茯苓烘三兩山藥炒三兩萸肉酒炒三兩丹皮酒炒二兩澤瀉炒三兩龜板炙三兩沙苑鹽水炒三兩黨參炒三兩杜仲鹽水炒三兩歸身酒炒三兩白芍炒二兩石決明煅四兩上藥為末煉蜜打和為丸曬乾泛上後藥香附三兩分三分一分鹽水炒一分醋炒一分蜜水炒陳皮鹽水炒七錢沉香三錢神麯一兩上藥為末用橘葉湯泛上前丸為衣詒按以補藥為丸而以和氣之藥末泛上為衣與喻嘉言藥用外廓之意相合雖無精義可取而心思靈巧可備一格夜涼晝熱熱在上午此東垣所謂勞倦傷脾之症也上午熱屬氣虛用補中益氣湯補氣升陽補中益氣湯加神麯茯苓詒按論症立方如開門見山心目俱朗泄為脾病嘔為胃病脾胃屬土居中而司升降脾宜升不升則泄胃宜降不降則嘔土衰則木橫木橫而土益衰高年當此頗慮土敗木賊古人治肝當先實脾況茲土弱尤當先補其中稍佐平肝可也理中湯加茯苓橘餅詒按案語理明詞達方法切實不浮但既有嘔惡見症則半夏似不可少擬再加木瓜白芍砂仁有時驚悸有時肌肉頑木或一日溏泄數次或數日一大便而堅干惟小便常紅此心氣鬱結脾氣失運失運則生濕鬱結則聚火火則傷津淫則阻氣而氣機不利矣擬荊公妙香散加味以補益心脾山藥洋參黃耆茯神赤苓桔梗炙草遠志麝香硃砂木香川連麥冬上藥為末用藿香陳皮湯泛丸每服三錢開水送下詒按專主心脾立論思路精確血不養心則心悸少寐胃有寒飲則嘔吐清水虛火爍金則咽痛肝木乘中則腹脹此時調劑最難熨帖蓋補養心血之藥多嫌其滯清降虛火之藥又恐其滋欲除胃寒慮其溫燥劫液欲平肝木恐其克伐耗氣今仿胡洽居士法專治其胃以胃為氣血之鄉土為萬物之母一舉而三善備焉請試服之黨參冬朮茯苓半夏棗仁扁豆陳皮山藥秫米詒按於無可措手中尋出養胃一法自屬扼要之圖擬再加木瓜白芍以和肝竹茹麥冬以清肺似更周匝骨格瘦小先天元氣不足夏秋寒熱至今不已脈細數弱氣血兩虧頭不痛而但身痛或口沃清水此胃陽虛憊也當商溫補仿東垣法黨參茯苓陳皮桂枝柴胡黃耆半夏神麯當歸乾薑砂仁詒按少陽生氣被郁故寒熱不已東垣升陽益胃法用之恰合加乾薑者助胃陽也再診前方補中益胃溫衛氣開腠理諸恙皆減仍依前法前方去神麯乾薑加白朮白芍衛氣虛則洒洒惡寒營氣虛則蒸蒸發熱營衛並出中焦總以脾胃為主補脾胃則金有所恃不必治肝而肝自馴矣黨參冬朮當歸川貝黃耆茯苓白芍陳皮玫瑰花詒按為虛損症探原立論方亦精到營陰內虧頭眩心嘈下午微寒內熱能食無力胃中有熱則消穀脾虛氣弱則無力也黨參沙苑茯苓川連棗仁知母女貞子白芍冬朮麥冬竹茹詒按此虛損初萌之候因脾虛氣弱未便滋補耳左脈空大腎水虧也倦怠無力脾氣弱也食少則陰虛陰虛生內熱症屬內傷補中益氣湯加黑山梔白芍另六味丸每朝服四錢詒按補中益氣補脾氣六味補腎陰立法頗切實惟左脈空大方中升柴兩味尚宜斟酌耳思慮傷脾之營勞碌傷脾之氣歸脾湯補脾之營也補中益氣湯補脾之氣也今將二方併合服之黨參黃耆冬朮茯神歸身炙甘草砂仁棗仁升麻柴胡木香半夏陳皮詒按同是脾病而病原用藥確有氣營之別一經指點便覺頭頭是道腎氣虛逆非滋不納脾弱運遲滋則呆滯然則如何而可曰補腎之陽即可以轉運脾氣從仲景腎氣丸化裁熟地附子三分炒五味子茯苓山藥肉桂心麥冬元米炒牛膝鹽水炒山萸肉陳皮紫石英補骨脂鹽水炒胡桃肉詒按補腎即可以補脾益火以生土也用腎氣丸恰合久病之軀去冬常患火升交春木旺肝膽陽升無制倏忽寒熱頭面紅腫延及四肢焮熱癢痛殆即所謂遊火遊風之類歟匝月以來腫勢已減四五日前偶然倮體傷風遂增咳嗽音啞痰多口乾舌白續發寒熱胃氣從此不醒元氣愈覺難支風火交煽痰濁復甚陰津消涸陽不潛藏此時清火養陰計非不善抑恐滋則礙脾化痰扶正勢所必需又恐燥則傷液立法但取其輕靈用藥先求其無過北沙參知母鮮生地蛤殼海浮石蟬衣豆卷青果海蟄地慄百合另珠粉朝晨用燕窩湯送下三分原注右方金匱百合知母地黃湯合本事神效雪羹取其清火化痰不傷脾胃生津養液不礙痰濕酌古參今歸於平正詒按議病用藥均歸精細躁心人不能領取也中風門兩手關脈皆見一粒厥厥動搖之象此土虛木勝內風動躍之候也左半肢體麻木不仁頭眩面麻病屬偏枯慮延僕中首烏當歸白芍茯苓陳皮秦艽菊花天麻石決明鉤鉤刺蒺藜桑枝再診動搖之脈大減內風有暗熄之機左手屈伸稍安左足麻木未和擬補腎生肝為治本之計地黃飲子地山萸斛蓯桂附麥冬薑五味菖蒲遠志茯巴戟棗去桂附詒按未雨綢繆故易於奏效兩方用藥亦能與病機宛轉相赴體肥多濕性躁多火十年前小產血崩血去則陰虧而火亢肝風暗動筋絡失養已非一日去秋伏暑後變三瘧瘧久營衛偏虛遂致風痰擾絡右半肢體麻痹而為偏廢之象調理漸愈今但右足麻辣熱痛痛自足大指而起顯系肝經血虛失養據云腿膝常冷足骱常熱此非足骱有火而腿膝有寒也想由濕火乘虛下注故痛處覺熱而腿膝氣血不足則覺寒耳至於左脛外廉皮肉之內結核如棉子發作則痛甚此屬筋箭是風痰瘀血交凝入絡而成與右足之熱痛麻辣不同今且先治其右足生地阿膠五加皮歸身木瓜天麻冬朮獨活絲瓜絡牛膝茯苓萆薢詒按論頗明透方亦平穩年已六旬腎肝精血衰微內風痰涎走絡右偏手足無力舌強言澀類中之根萌也溫補精血兼化痰涎冀免偏枯之累然非易事也耐心調理為宜蓯蓉巴戟茯神木瓜半夏枸杞鹽水炒遠志甘草湯制海風藤茱萸酒炒牛膝杜仲鹽水炒詒按此與下條均因有類中之萌作未雨綢繆之計故用藥力求平穩不敢喜事以邀功也腎藏精而主骨肝藏血而主筋腎肝精血衰微筋骨自多空隙濕熱痰涎乘虛入絡右偏手足無力舌根牽強類中之根溫補精血宣通經絡兼化痰涎守服不懈加以靜養庶幾卻病延年蓯蓉黨參元米拌炒牛膝半夏杞子鹽水炒陳皮繼斷茯苓巴戟桑枝又丸方蓯蓉二兩酒煮爛搗入黨參三兩元米炒熟地四兩砂仁末陳酒拌蒸爛搗入麥冬二兩去心元米炒棗仁三兩炒研巴戟三兩鹽水炒歸身二兩酒炒萆薢三兩炒首烏四兩制炒茯神三兩牛膝三兩鹽水炒半夏二兩天冬二兩去心元米炒陳皮二兩五錢杜仲三兩鹽水炒虎骨三兩炙菖蒲一兩杞子四兩鹽水炒上藥各選道地如法制炒共研細末用竹瀝四兩薑汁三兩搗入再將白蜜為丸如黍米大用瓷器裝好每朝服五錢開水送下痿痹門先天不足骨髓空虛常以後天滋補栽培脾胃脾胃得補濕熱壅滯形體驟然充壯而舌本牽強兩足痿軟不能行走上盛下虛病屬痿躄經云濕熱不攘大筋軟短小筋馳長軟短為拘馳長為痿是也今擬法補先天之精氣強筋壯骨以治其下扶後天之脾胃運化濕熱以治其中然必耐心久服確守弗懈庶克獲效倘朝秦而暮楚恐難許收功也熟地四錢附子三分煎汁炒茯苓三錢牛膝一錢五分鹽水炒桑枝一兩虎脛骨炙三錢川斷二錢酒炒巴戟三錢鹽水炒黃柏一錢薑汁炒蒼朮一錢五分萆薢二錢鹽水炒竹瀝二十匙薑汁一匙另洗方獨活三錢當歸五錢紅花一錢陳酒糟二兩豬後腳骨二隻蔥白頭三個煎湯日洗一次詒按此等症本難奏效其立方仍從丹溪虎潛法加味用藥固未嘗不切當也伏熱留於肺胃胃熱則消穀易飢肺熱則躄痿難行熱氣熏於胸中故內熱不已延年半載節屆春分天氣暴熱病加不寐據述先前舌苔黃黑今則舌心乾紅其陰更傷仿仲景意用甘寒法生地三錢知母一錢五分茯神三錢棗仁一錢五分麥冬二錢滑石三錢夜合花五分沙參三錢百合一兩泉水煎服詒按金匱百合病篇有以百合配知母地黃滑石等法此方即用其意再診經云肺熱葉焦則生痿躄前方清心肺而退熱已能起床步履但夜不安寐是腎氣不交於心陰虛陽亢故也清金麗水取坎填離為治生地天冬麥冬棗仁山藥元參沙參洋參百合另虎潛丸三錢詒按經云肺熱葉焦則生痿躄又云治痿必取陽明經訓昭然守此二語治法不外是矣三診陰虛未復夜寐未安熱退不清仍宜養陰自云腹中微微撐痛此屬中虛治當補益脾陰兼清心肺之熱生地沙參洋參山藥麥冬棗仁薏米茯神甘草白芍赤苓百合另歸脾丸冷雨淋背於先竭力鼓棹於後勞碌入房挾雜於中病起身熱咳嗽至今四十餘日痰氣腥臭飲食能進臥床不起形肉消脫是肺先受邪而復傷其陰也經云陰虛者陽必湊之肺熱葉焦則生痿躄又云一損損於肺皮聚毛落至骨痿不能起床者死合經旨而互參之分明棘手重症矣沙參紫菀茯苓地骨皮川貝玉竹薏仁另八仙長壽丸四錢再診肺為水源百脈朝宗於肺猶眾水朝宗於海也肺熱葉焦則津液不能灌輸於經脈而為痿躄臥床不能行動形肉消削咳嗽痰臭舌紅無苔脈細而數是皆津液消耗燥火內灼之象考經論治痿獨取陽明者以陽明主潤宗筋胃為氣血之源耳今擬生胃津以供於肺仿西昌喻氏意沙參阿膠杏仁甘草元參火麻仁天冬麥冬玉竹茯苓桑葉枇杷葉詒按議病立方深合內經痿論之旨三診投清燥救肺法病情稍安仍宗前制桑葉杏仁麥冬川貝百合元精石阿膠沙參元參枇杷葉野茭白根長齋廿載精血久枯大雨淋身濕侵入骨腿股酸重不能舉動法以宣通關節佐以養血生津麻黃蒼朮白芷當歸川芎白芍防風熟地桂枝獨活牛膝桑枝詒按此從陽和湯增減因系濕邪故加蒼朮風寒濕三氣伏留於骨骨節痠痛自冬而起所謂骨痹也骨痹不已內舍於腎則發熱淹纏即成勞損秦艽杜仲五加皮生地地骨皮當歸續斷牛膝萆薢茯苓詒按邪郁化熱則傷及陰血故易入損方內再加丹皮桂枝更覺周到寒濕之氣從外而入於內遍體歷節疼痛而又胸滿嘔痰經云從外之內者治其外又云胃為臟腑之長束筋骨利機關皆胃氣之流行然則外通經絡內和胃氣便是治法之綱領矣川附茯苓南星半夏陳皮木瓜竹瀝薑汁詒按骨節痛與嘔痰自是兩途之病用藥兩面照顧亦為合法案中以胃氣一層牽合筋節雖似有理而實非內經本旨方中木瓜竹瀝是筋絡藥擬再加桂枝秦艽獨活桑枝牛膝內風門病起肝風繼增痰飲吐酸所以口目筋掣而胸膈不利也近因暑熱上蒸咽喉碎癢暫投涼劑喉患雖減而胸脘愈覺撐脹夫肝風之動由於陰血之虛痰飲之生又系胃陽之弱病涉兩岐法難並用今且宣化胃濕以祛痰稍佐平肝降逆之品半夏茯苓陳皮旋覆花麥冬杏仁川貝鬱金丹皮黑山梔竹茹蔻仁詒按此等兩礙之病最難用藥須看其周到熨帖處方中旋郁貝杏是兼參胸痹治法肝為風藏而主筋心為火藏而主脈心包絡與三焦相為表裡俱藏相火心包主裡三焦統領一身之絡此病起於病後心中𩞄熱胸前跳躍繼而氣攻背脊如火之灼或大或小或長或短皆在經絡脊脈之中良由病後絡脈空虛相火內風走竄入絡非清不足以熄火非鎮不足以定風然而絡脈空虛使非堵截其空隙之處又恐風火去而復入故清火熄風填竅三法必相須為用也第此症實屬罕見醫者意也以意會之可耳仿仲景法羚羊角寒水石滑石紫石英龍骨石決明生石膏磁石赤石脂牡蠣大黃甘草各三錢上藥研末每服一錢一日三服用大生地一兩百合一兩煎湯調服詒按金匱中風門有侯氏黑散風引湯二方其用意以填竅為主喻西昌論之詳矣讀者取喻氏之論觀之即識此方之意先嘔數日嘔止而發痙厥日三五次此乃肝逆犯胃聚液成痰內風焮動陽氣偏張痰亦從之為患擬清熄風陽兼和其胃羚羊角鉤鉤半夏陳皮茯苓石決明山梔菊花元參竹茹再診痙厥日數發口噤不能言而心中了了病不在心而在肝夫心為君主肝為將軍當氣逆火升風動之際一如將在外君命有所不受君主雖明安能遽禁其強暴哉況胃為心之子胃家之痰與肝家之風火互結黨援相助為虐今舌紅碎痛一派炎炎之勢漸迫心君故欲化胃家之痰必先清泄肝家之風火而安鎮靈臺使心君無震撼之虞尤為要著羚羊角鮮生地犀角茯神山梔元參石決明天竺黃鉤鉤棗仁川連炒竹瀝薑汁沖金箔詒按議論明快立方熨帖擬去犀角加川連更為親切久患肝風眩運復感秋風成瘧瘧愈之後周身筋脈跳躍甚則發厥此乃血虛不能涵木筋脈失養虛風走絡痰涎凝聚所致擬養血熄風化痰通絡制首烏紫石英白蒺藜半夏茯神羚羊角石決明煨天麻棗仁洋參陳皮竹瀝薑汁詒按歸芍似不可少五臟六腑之精氣皆上注於目目之系上屬於腦後出於項故凡風邪中於項入於腦者多令目系急而邪視或頸項強急也此症始由口目牽引乃外風引動內風內風多從火出其原實由於水虧水虧則木旺木旺則風生至於口唇乾燥赤碎名餂唇風亦肝風胃火之所成也治當清火熄風養陰為法大生地丹皮沙參鉤鉤桑葉羚羊角石決明白芍芝麻蔗皮梨皮元參心川石斛肝苦急急食甘以緩之生甘草一斤研末紅棗一斤煮爛去皮核與甘草打和為丸每服三錢開水送下原注此人並無表症又不內熱一日數十痙服此二料即愈詒按前兩方是風火致痙者通治之方後一方雖依經用藥但平實無靈機如此重病而服之竟效奇哉神志門上年夏季痰火迷心神呆語亂治之而愈至今復發脈浮小弱舌心紅而苔薄白語言錯亂哭笑不常憑脈而論似屬心風蓋由風入心經蘊熱蒸痰所致用本事獨活湯法獨活防風黃芩山梔元參石菖蒲膽星茯苓橘紅甘草竹葉鮮生地詒按論症確鑿此為學有本源查許學士獨活湯原方僅有獨活防風茯苓三味相同此蓋用其意而不制其成方也情志鬱勃心肝受病神思不安時狂時靜時疑時怯心邪傳肺則心悸不寐而咳嗽肝邪傳膽則目定而振慄其實皆鬱火為患也擬清心安神壯膽為主平肝和脾佐之川連茯神菖蒲龍骨遠志北沙參棗仁膽星川貝鐵落石決明豬膽一個用川芎五分研納入以線紮好入煎詒按清心化痰涼肝鎮怯立方周到熨帖尤妙在川芎一味入豬膽內可以疏木鬱壯膽氣開後人無數法門也寡居十載愁惕苦心牙齦出血有時若癇其病已久茲一月前猝遭驚恐遂神糊語亂口吐紫血腹脹不食兩脈模糊難以捉摸此乃驚動肝陽神魂擾亂血隨氣逆是即薄厥之屬今兩足常冷陽升於上急以介類潛陽重以鎮怯冀其厥止再商川連吳萸炒牡蠣阿膠茯神棗仁石決明羚羊角龍骨茜草炭紫石英代赭石白芍金箔詒按病深且久病氣內涉於藏實難取效但就病論治隨症用藥已能處處熨帖自屬可存再診風陽稍熄神志未安仍從前法增損川連吳萸炒石決明牡蠣茯神龍骨遠志羚羊角紫石英阿膠棗仁白芍橘紅石菖蒲金箔另硃砂安神丸三錢肝風胃濕凝聚成痰每逢勞碌則氣逆而痰湧驟然昏迷少頃復醒醒後數日無力此屬癇類其原總由水虧不能涵木所致煎方無效宜用丸藥生地茯神山藥丹皮棗仁茯苓萸肉澤瀉磁石上藥為末煉蜜捻作小丸將後藥泛上半夏南星制陳皮青黛蛤殼郁金石決明沉香琥珀上藥為末泛上前丸為衣曬乾每服五錢淡鹽花湯送下詒按作丸之法頗極精妙肝火痰涎內蒙心竅外竄經絡時發癇症洋參制三兩天竺黃一兩明礬一兩首烏制四兩茯神烘三兩半夏一兩川貝二兩附子五錢雄精五錢辰砂五錢南星制一兩石決明煅四兩川鬱金一兩陳皮鹽水炒丹皮炒各二兩上藥為末用金箔濂珠血珀玳瑁獺肝羚羊角另研細末用鉤鉤三兩煎濃湯衝入竹瀝一杯薑汁一杓將上藥末泛丸每早服二錢橘紅湯送下詒按前方兼顧水虛此方專治痰火見症不同固各有所當也痰火門心境沉悶意願不遂近因患瘧多飲燒酒酒酣之後如醉如狂語言妄亂及今二日診脈小弦滑沉舌苔薄白小水短赤大便不通渴欲飲冷昏昏默默不知病之所的因思瘧必有痰酒能助火痰火內擾神明不安此少陽陽明同病而連及厥陰也少陽為進出之樞陽明為藏邪之藪今邪並陽明瀰漫心包故發狂而又昏昏默默也仿仲景柴胡加龍牡湯主之柴胡黃芩半夏茯苓龍骨甘草牡蠣鉛丹菖蒲大黃竹瀝薑汁詒按病之來原去路一一指出藥亦的當寐中常坐起而不自知日間靜則磕睡此濁痰迷閉清陽陽氣鬱而不宣也膽星川貝茯苓陳皮枳實半夏黨參遠志菖蒲再診體肥多濕之人濕熱蒸痰阻塞肺胃喉中氣粗呼吸如喘臥寐之中常欲坐起仍然鼾睡而不自知所以起坐之故蓋痰阻氣鬱蒙閉清陽陽氣鬱極則欲伸故寐中欲坐起也病屬痰與火為患茲擬煎方開其肺痹另用丸藥化其痰火痰火一退清陽得伸病自愈矣射干橘紅冬瓜子杏仁桔梗象貝竹瀝薑汁葶藶子蘇子枇杷葉另黑醜取頭末三錢萊菔子炒三錢檳榔炒三錢大黃酒炒三錢研末蜜丸作十二粒每午後一丸臨臥一丸噙化嚥下詒按審病即得其真諦用藥自然入彀丸方中加入菖蒲膽星鬱金東丹等以開鬱墜痰較似得力膽虛則神自怯氣鬱則痰自凝於是咽喉若塞氣短似喘偶值煩勞夜寐多魘無形之氣與有形之痰互相為患遂至清淨無為之府與虛靈不昧之神均失其寧謐之常欲安其神必化其痰欲壯其膽必舒其氣故清之化之和之益之必相須為用也沙參棗仁川連炒半夏膽星遠志茯神神麯石菖蒲橘紅金箔竹瀝薑汁另膽星三錢琥珀一錢金箔五張黑白醜取頭末各一錢五分上藥另研和一處共為細末每服三分橘紅湯送下又方黨參薑汁炒半夏膽星茯神遠志棗仁川貝橘紅蛤殼神麯竹瀝薑汁痰飲門痰飲阻於胸中咳而短氣心悸用四君補氣二陳化痰桂枝通陽款冬止咳加減成方仍不越苓桂術甘之制若舍仲景而別求良法是猶廢規矩而為方圓也詎可得哉桂枝茯苓白術甘草半夏陳皮黨參款冬花詒按方論俱平正通達可以取法再診用補氣化痰通陽蠲飲咳而短氣俱減但心仍悸參以益智茯苓白朮甘草黨參陳皮半夏桂木款冬花益智仁棗仁胸中之元陽不足膻中之火用不宣痰飲伏於心下胸前如盤大一塊常覺板冷背亦惡寒三四年來每交子後則氣喘陽氣當至不至痰飲阻遏其胸中陽微陰勝故也天明則陽氣張故喘平至咳嗽心悸易於驚恐皆陰邪竊踞胸中之病其常若傷風之狀者衛外之陽亦虛也圖治之法當祛寒飲而逐陰邪尤必斡旋其陽氣俾如離照當空而後陰邪盡掃用仲景苓桂術甘法先通胸中之陽再議茯苓細辛一分泡湯拌浸焙桂木冬朮熟附二分煎汁拌炒陳皮甘草麻黃一分泡湯拌浸焙炮姜五味子五粒同焙補骨脂鹽水炒焦黨參薑汁炒半夏紫石英胡桃肉螺螄殼詒按審症清切方中以辛烈之品煎汁收入甘平藥內用意頗巧骨脂桃肉參入補腎之意尤為周到此症陽微飲踞自屬確不可易惟所吐之痰是否清稀抑系干黃黏厚案中未經敘明其常若傷風之狀衛陽虛者固有此候亦有痰濁化熱蘊於肺中以致招引外風者亦多此症不可不細為之辨咳嗽口不渴當臍痛而脈細頭常眩運此乃手足太陰二經有寒飲積滯阻遏清陽之氣不能通達故一月之中必發寒熱數次乃鬱極則欲達也病將四月元氣漸虛寒飲仍戀而不化先以小青龍湯蠲除寒飲宣通陽氣再議麻黃桂枝白芍細辛乾薑半夏五味子甘草詒按此內飲而兼外寒之方一月中寒熱數次或因兼感外邪則此方的對矣脈沉取之數其陰內虧其熱在裡病延日久勞損之候症見咳唾白痰脘腹時痛痛則氣滿得矢氣則稍寬病由肝鬱而成據云咳已三年初無身熱是其根又有痰飲也經訓治病必求其根茲從痰飲氣鬱例治之半夏茯苓桂木丹皮白芍香附沉香神麯歸身甘草冬朮陳皮金橘餅詒按此苓桂術甘合二陳加歸芍丹皮以養肝沉附曲橘以化氣也立方平穩熨帖痰飲咳逆肺腎兩虛胃濕不化用苓桂朮甘湯合二陳治其胃都氣丸治其肺腎可也苓桂朮甘湯合二陳湯加川貝杏仁沉香另都氣丸每服四錢淡鹽湯送下詒按虛實兼到親切不浮痰飲咳嗽已久其源實由於脾腎兩虧柯氏云脾腎為生痰之原肺胃為貯痰之器也近增氣急不得右臥右臥則咳劇肺亦傷矣肛門漏瘍邇來糞後有血脾腎虧矣幸胃納尚可議從肺脾腎三經同治然年已六旬宜自知愛養為要否則慮延損症熟地砂仁炒五味子炮姜半夏陳皮茯苓阿膠蒲黃炒款冬花冬朮歸身川貝原注此金水六君煎合黑地黃丸加阿膠款貝三味直補金土水之虛上能化痰下能止血其中雖有炮姜勿嫌其溫蓋有五味以攝之也詒按此等病立方最難安放平穩似此周到熨帖自非老手不辦飢飽勞碌傷胃寒痰凝聚氣血稽留阻於胃絡因而胃脘脹痛嘔吐黏痰初起一發即平後來發作愈勤今則殆無虛日飲食從此減少病日益甚胃日益虛倘不加謹恐延脹滿不易圖治黨參炮姜冬朮熟附半夏良薑陳皮茯苓蔻仁再診溫胃化痰從理中二陳平胃三方化裁六君子湯加川樸熟附炮姜蒼朮三診寒積中焦胃陰不布痰飲竊踞為痛為脹為吐為噦法當溫運中陽但病根已深必耐心久服乃效黨參炮姜半夏茯苓陳皮川椒熟附蔻仁白朮四診中虛非補不運寒飲非溫不化益火生土通陽蠲飲苓桂朮甘湯主之附子理中湯亦主之黨參桂木炮姜半夏茯苓熟附冬朮陳皮蔻仁五診病有常經方有定法藥已見效無事更張袁詩云莫嫌海角天涯遠但肯搖鞭有到時附子理中湯合二陳湯加桂木老薑詒按前後五方看病的確用藥的當案語亦親切簡老於此道中自推老手咳喘門稚齡形瘦色黃痰多食少晝日微咳夜寐則喉中嗘吼有聲病已半載而性畏服藥此脾虛而濕熱蒸痰以阻於肺也商用藥棗法人參三錢蒼朮土炒一錢五分茯苓三錢川樸薑汁炒一錢榧子三錢炙草一錢陳皮鹽水炒一錢川貝三錢宋製半夏三錢冬朮三錢上藥各研末和一處再研聽用好大棗一百枚去核將上藥末納入棗中以線紮好每棗一枚大約納入葉末二分為準再用甜葶藶一兩河水兩大碗同棗煮俟棗軟熟不可大爛將棗取出曬乾每飢時將棗細嚼嚥下一枚一日可用五六枚餘下棗湯去葶藶再煎濃至一茶杯分三次先溫服俟棗干然後食棗原注此平胃六君湯加川貝榧子製法極好以治脾虛濕熱蒸痰阻肺喉中痰多者極妙此法從葛可久白鳳膏化出頗有巧思此病服之遂愈詒按靈心巧想可法可師肺為貯痰之器脾為生痰之源肺虛則痰不易化脾虛則濕不能運痰上逆而喘咳濕下注而足腫腫之與喘無非氣失升降而乏運行之權也今擬脾肺同治冀痰濕運行乃吉黨參葶藶杏仁澤瀉大腹皮半夏赤苓陳皮通草冬瓜子枇杷葉棗詒按論病用藥俱能得其要領年過花甲腎氣必虧即使善自調攝亦不過少病耳及至既病則各隨其見症而施治焉今咳嗽氣升食少倦怠症形在於肺脾自宜從肺脾求治然氣之所以升者即腎水虛而不能藏納肺氣也食暈油則大便溏者即腎陽衰而不能蒸運脾土也然則補腎尤為吃緊雖不治脾肺而脾肺得蔭矣黨參五味山藥紫石英補骨脂萸肉胡桃肉茯苓另金匱腎氣丸三錢詒按立論頗能探入深處用藥亦親切不浮氣上逆而咳甚舌心紅而邊白此陰虛痰滯下虛上盛之候也病已月餘消痰恐劫其陰養陰恐增其濁擬以降氣化痰少佐益陰為法蘇子降氣湯去桂另都氣丸五錢詒按立方切當病將一載咳嗽內熱行動喘促少腹牽痛此腎氣虛而不納也仿都氣法生地萸肉茯苓丹皮山藥五味子澤瀉麥冬川貝沉香詒按立方精當再診壯水生金補子益母前方加黨參胡桃肉多年咳喘逢寒遇勞輒發汗多氣升肺傷及腎腎氣虛而不納矣法當補腎以納氣熟地懷牛膝北沙參半夏陳皮茯苓麥冬五味子紫石英蛤殼沉香再診寒入肺底久而化熱同一痰喘先後不同也初病在肺久必及腎同一咳逆虛實不同也補腎以納氣清肺以化痰須兩層兼顧為穩北沙參五味子麥冬川貝杏仁蛤殼懷牛膝地骨皮熟地梨皮枇杷葉詒按前方用藥切當此方案語圓融痰飲咳喘脘中脹滿時或微痛雖脾腎肺三經同病而法當責重乎脾以脾得運而氣化通則痰飲有行動之機也乾薑五味子同研炙半夏陳皮茯苓補骨脂北沙參元米炒杏仁川樸澤瀉胡桃肉再診痰飲停於心下上則喘咳下則脘脹多由清陽失曠痰濁內阻轉胸中之陽以安肺運脾中之陽以和胃咳喘與脹滿當松栝蔞皮枳實乾薑川樸半夏陳皮薤白頭茯苓澤瀉詒按此症咳脹兩症並重故治法亦脾肺兼顧痰飲久留於肺胃或咳或喘或脘脹皆痰氣之為病也化胃中之痰宜苓半化肺經之痰宜橘貝從此擴充以立方二陳湯合苓桂朮甘湯加川貝杏仁蛤殼紫菀詒按此病因有脘脹而無腎虛見症故始終以運脾化痰之法咳嗽痰多氣急其標在肺其本在腎歷年既久自淺及深自肺及腎法當治其本矣熟地懷山藥懷牛膝半夏陳皮茯苓蛤殼五味子紫石英沙苑胡桃肉再診補腎納氣水不泛而痰自化培土運濕濕不停而痰可降矣懷牛膝懷山藥半夏陳皮茯苓熟地紫石英銀杏肉杞子五味子胡桃肉詒按兩方案語清簡用藥切實方中再加於術於培土較似有力腎司納氣而開竅於二陰此病每因勞碌之餘必先頻轉矢氣而後氣升上逆短促如喘飲食二便如常其病在少陰之樞宜補而納之六味地黃丸合生脈散加青鉛詒按腎為作強之官過於勞動則收攝無力故見此症與尋常喘促又是一種認症既確立方亦切實不膚擬再加砂仁胡桃肉暑風從背俞而內薄於肺濕熱從胃脈而上熏於肺外內合邪其氣並於胸中氣不得通因而上逆氣升作咳舌苔薄白口膩不渴治屬飲家冬瓜子半夏茯苓射干通草馬兜鈴枳殼杏仁橘紅枇杷葉詒按此方輕靈可喜擬再加滑石薏仁既有暑風內薄宜再參用疏泄之品閱病原知繇痰飲久留脾肺腎三藏交傷下則腎虛不能納氣中則脾虛不能運氣上則肺傷不能降氣繇是咳喘不得臥肢腫腹臌神氣疲憊虛亦甚矣治上無益當治中下熟地懷牛膝茯神五味子胡桃肉沙苑懷山藥蛤殼紫石英補骨脂麥冬另黑錫丹每朝鹽花湯送下一錢詒按病候已造極深之域用藥如此亦背城借一之計喘哮氣急原由寒入肺俞痰凝胃絡而起久發不已肺虛必及於腎胃虛必累於脾脾為生痰之源肺為貯痰之器痰戀不化氣機阻滯一觸風寒喘即舉發治之之法在上治肺胃在下治脾腎發時治上平時治下此一定章程若欲除根必須頻年累月服藥不斷倘一暴十寒終無濟於事也發時服方款冬花桑白皮紫菀蘇子沉香茯苓杏仁橘紅製半夏黃芩平時服方五味子紫石英煅陳皮半夏茯苓薏仁蛤殼胡桃肉杜仲熟地詒按論病則源流俱到層折畢清用藥亦周到熨帖絕不浮泛洵非老手不能到此地位再診喘哮頻發脈形細數身常惡寒下焦陰虛中焦痰盛上焦肺弱肺弱故畏寒陰虛故脈數喘之頻發痰之盛也有所感觸病遂發焉病有三層治有三法層層護衛法法兼到終年常服庶幾見效否則恐無益也發時服方桂枝生曬乾款冬花蜜炙橘紅鹽水炒杏仁霜萊菔子桑白皮蜜炙上藥共研末用枇杷葉十片去毛煎湯再用竹瀝半茶杯薑汁一酒杯相和一處將上藥末泛丸發喘時每至臥時服此丸二錢薏仁橘紅湯送下平明服方熟地砂仁拌炒丹皮鹽水炒山萸肉酒炒茯苓牛膝鹽水炒澤瀉鹽水炒肉桂山藥炒五味子鹽水炒磁石上藥為末用煉白蜜搗和捻作小丸丸須光亮俟半乾再用製半夏三兩陳皮二兩炙甘草一兩研極細末泛為衣每朝服二錢發時亦可服心咳之狀咳則心痛喉中介介如梗狀甚則咽腫喉痹蓋因風溫襲肺引動心包之火上逆故治法仍宜宣散肺經風邪參入寧心緩火之品仲景方法略示其端但語焉未詳後人不能細審耳前胡杏仁象貝母桔梗射干麥冬遠志甘草湯制沙參小麥一兩煎湯代水詒按心咳屬心火刑金之病宜略加竹葉元參等清心之品乃合小麥湯代水頗有巧思煩勞罷極則傷肝肝傷則氣逆而上迫為脅痛為咳嗽秦氏所謂先脅痛而後咳者肝傷肺也治法不在肺而在肝夏令將臨恐有失血之虞旋覆花桃仁炭杏仁川貝蘇子冬瓜子黑山梔丹皮鬱金薏仁枇杷葉詒按審症清切立方諦當愚意再加歸鬚桑白皮白芍五臟皆有咳總不離乎肺肺為嬌臟不耐邪侵感寒則咳受熱則咳初起微有寒熱必挾表邪邪戀肺虛脈形空大前方降氣化痰保肺滌飲俱無少效據云得汗則身體輕快想由肺氣雖虛留邪未淨補虛而兼化邪亦一法也用錢氏法牛蒡子元米炒馬兜鈴杏仁阿膠蛤粉炒蘇子桑白皮款冬花炙甘草茯苓枇杷葉桑葉詒按此肺虛受邪虛實兼顧之法脈虛軟而似數內傷虛弱奚疑夫邪之所湊其氣必虛虛處受邪其病則實咳嗽雖由外感而實則因於氣虛以為風寒固不可以為虛損亦未必可玉竹飲子主之玉竹杏仁蘇子桑白皮款冬花象貝橘紅沙參元米炒旋覆花枇杷葉詒按將虛實二字說得六通四辟此玉竹飲子加減潤肺疏邪虛實兼到寒嗽交冬則發兼患頸項強急熟地六錢麻黃一錢煎汁浸炒鬆茯苓三錢細辛五分煎汁浸炒胡桃肉四錢五味子八分乾薑一錢同炒陳皮二錢鹽水炒半夏一錢五分川貝三錢款冬花三錢薏仁四錢杏仁霜三錢歸身三錢酒炒黨參三錢米炒上藥為末煉蜜為丸每晨開水送下三錢詒按此陰虛而挾痰飲者故用藥如此再增桂枝一味則頸項強急亦在治中矣陰虛而兼痰濁致為咳嗽用金水六君煎半夏陳皮茯苓炙草當歸川貝杏仁紫菀熟地砂仁拌炒鬆後入略煎一兩沸原注仿飲子煎法濁藥清投取其益陰而不膩滯痰濁也詒按陰虛而挾濕痰最難用藥此亦無法中之一法咳嗽四年曾經失血今已音啞脈形細弱真陰元氣皆虧勞損根深藥難見效猶幸胃氣尚可大便未溏姑擬甘潤養陰希圖苟安而已北沙參麥冬杏仁川貝玉竹扁豆生甘草茯苓橘餅枇杷葉再診咳嗽止而失血音啞津液枯槁勞損成矣脈形細弱精氣兩虧內經於針藥所不及者調以甘藥金匱遵之而用黃耆建中湯急建其中氣俾得飲食增而津液旺冀其精血漸充復其真陰之不足蓋舍此別無良法也黃耆秋石水炒白芍桂炒去桂北沙參生炙甘草玉竹麥冬川貝茯苓橘餅詒按此與前方看似無聊應酬之作其實精到熨帖所謂舍此無良法也痰飲咳嗽飽則安飢則咳乃胃虛也黃耆甘草冬朮陳皮白芍玉竹茯苓杏仁桔梗詒按再加黨參薏仁何如咳嗽月餘痰腥帶血氣升嗆逆脈弦滑數風溫久戀化火蒸痰灼金耗液症屬肺癰非輕候也冬瓜子淡芩薏仁紫菀川貝桑皮甜杏仁蘇梗沙參蘆根尖附錄張氏醫通云薏仁根搗汁頓熱服之下咽臭痰即解有蟲者蟲即死出薏仁為肺癰專藥然性燥氣滯服之未免上壅不及根汁之立能下奪已潰未潰皆可挽回陳芥菜汁溫服灌吐最妙一方用薄荷濃煎稍入白蜜已潰未潰皆效再診咳熱痰腥帶血脈形弦硬面色暗晦肺氣失降木火上逆防加喘急羚羊角鮮生地川貝甜杏仁蛤殼石決明桑白皮紫菀枇杷葉蘆尖咳吐臭痰如膿血此屬肺癰舌苔濁厚痰濁膠黏仿仲景法葶藶子冬瓜子桃仁桔梗桑皮栝蔞仁旋覆花蘇子川貝蘆尖詒按此治肺癰初潰之主方又按肺癰之病皆因邪瘀阻於肺絡久蘊生熱蒸化成膿故其症初起病在此葉者不及彼葉初用疏瘀散邪瀉熱可冀其不成膿也繼用通絡托膿是不得散而托之使速潰也再用排膿泄熱解毒是既潰而用清泄使毒熱速化而外出也終用清養補肺是清化餘熱而使其生肌收口也凡此皆肺癰治法之一定層次也乃有一種外感咳嗽其初起並非肺癰只因濁痰蘊熱阻結於肺復為外涼所束或為油膩所黏阻窒竅隧濁熱蒸悶蘊結不解致吐痰臭穢胸膈隱痛甚則失音氣促蒸熱喘汗病情與肺癰無異其初終治法亦與肺癰相同但肺癰多實症而此則每涉於虛最易流入損途其難治較甚於肺癰或以其虛而漫指為肺痿其實與前人所論癰痿均不相合茲特表而出之俾學者不至淆惑焉肺花瘡乃肺虛火炎金受其戕音啞咳嗆勞損之根不易見效北沙參元參桑皮杏仁川貝款冬花失血門脈數血不止胃氣大虛胸中痞塞大便常溏是痞為虛痞數為虛數咳血三月今忽沖溢唇白麵青斷非實火大凡實火吐血宜清宜降虛火吐血宜補宜和古人謂見痰休治痰見血休治血血久不止宜以胃藥收功今擬一方援引此例未知有當高明否人參扁豆川貝茯神藕汁京墨詒按此方於扶胃藥中參以止血之意固屬正治惟唇白麵青既見虛寒確據似宜於此方中參入炮姜等溫攝之品以斂浮陽而止血也再診脈數退血少止藥病相當頗得小效而反惡寒汗出者蓋血脫則氣無所依氣屬陽主外衛虛則不固故惡寒而汗出最怕喘呃暴脫措手莫及猶幸胸痞已寬稍能容納仿血脫益氣之例經曰陽生陰長是之謂耳人參扁豆五味子炙甘草炮姜山藥炒鮮藕汁詒按此與前方同意以惡寒故加炮姜三診血脫益氣昔賢成法今血雖大止而神氣益憊唇白麵青怕其虛脫欲牢根蒂更進一籌人參扁豆炒五味子熟地砂仁拌炒附子秋石水炒麥冬冬朮炮姜陳皮伏龍肝湯代水詒按伏龍肝未審何意此方大意亦與第一方相似漸參溫補之意以防其虛脫故耳四診肝腎之氣從下泛上青黑之色滿於面部陰陽離散交子丑時防脫勉擬鎮攝希冀萬一人參熟地五味子麥冬茯神坎炁肉桂紫石英青鉛詒按此方急於固脫故用藥如是五診血止三日而痰吐如汙泥且臭是胃氣大傷肺氣敗壞而成肺痿痿者萎也如草木之萎而不振終屬勞損沉疴極難醫治外臺引用炙甘草湯取其益氣生津以救肺之枯萎後人遵用其方恆去薑桂之辛熱此症面青不渴正宜溫以扶陽但大便溏薄除去麻仁之滑潤可耳人參炙甘草麥冬阿膠生地炮姜肉桂五味子紫石英詒按痰如汙泥是必血液敗腐日久而然並非肺痿惟所用炙甘草湯養血滋液尚與病情不背愚意加入薏仁丹皮略仿內癰治例似乎稍合六診病勢依然仍從前方加減前方加重炮姜再加制洋參詒按以後方均是復脈加減七診連進炙甘草湯病情大有起色但咳嗆則汗出肺氣耗散矣散者收之不宜再兼辛熱當參收斂之品人參熟地沉香末拌炒炙甘草阿膠五味子黃耆蜜炙罌粟殼蜜炙大棗久咳失血精氣互傷連進滋培頗獲小效但血去過多驟難充復從來血症肺腎兩虛者宜冬不宜夏蓋酷暑炎蒸有水涸金消之慮耳今雖炎暑未臨而已交仲夏宜與生精益氣大滋金水之虛兼扶胃氣則金有所恃且精氣生成於水穀又久病以胃氣為要也洋參麥冬五味熟地生地黨參黃耆山藥炙草陳皮茯神扁豆詒按層層照顧可謂慮周藻密方中擬再加百合沙參再診血止胃稍醒仍以原法為主前方加蜜炙粟殼另用白芨一味為丸每朝鹽花湯送下三錢素患嘔血血止復發現有胸痛時時噯氣舌苔白膩脈細而遲此胃中有瘀血挾痰濁為患也旋覆花鬱金杏仁紫菀栝蔞仁代赭石茯苓貝母降香枇杷葉詒按血症中之變例擬加丹參桃仁血色紫而有塊此屬肝火乘胃瘀凝上泛也仿繆仲醕法鮮生地大黃醋炒阿膠蒲黃炒丹皮炒黑山梔蘇子白芍扁豆炒降香枇杷葉藕汁詒按此肝火沖激於血絡所致最易留瘀致病故用藥如此若再加茜根炭三七似於瘀血一面更為著力始由寒飲咳嗽繼而化火動血一二年來血症屢止屢發而咳嗽不已脈弦形瘦飲邪未去陰血已虧安靜則咳甚勞動則氣升蓋靜則屬陰飲邪由陰生也動則屬陽氣升由火動也陰虛痰飲四字顯然擬金水六君同都氣丸法補腎之陰以納氣化胃之痰以蠲飲飲去則咳自減氣納則火不升也生地海浮石拌炒半夏青鹽制麥冬元米炒五味子炒訶子紫石英丹皮炭牛膝鹽水炒懷山藥炒蛤殼打茯苓青鉛枇杷葉蜜炙詒按陰虛而兼痰飲用藥最難須看其兩不礙手處去秋咳嗽些微帶血已經調治而痊交春吐血甚多咳嗽至今不止更兼寒熱朝輕暮重飲食少納頭汗不休真陰大虧虛陽上亢肺金受爍脾胃傷戕津液日耗元氣日損脈沉細澀口膩而干虛極成勞難為力矣姑擬生脈六君子湯保肺清金調元益氣扶過夏令再議洋參沙參麥冬五味子扁豆製半夏茯神陳皮炙甘草另枇杷葉露野薔薇露各一杯沖服原注生脈散保肺清金六君子去朮嫌其燥加扁豆培養脾陰土旺自能生金也不用養陰退熱之藥一恐滋則滑腸一恐涼則妨胃耳從來久病以胃氣為本經云有胃則生此其道也詒按此平正通達調補方之久服無弊者咳嗽內傷經絡吐血甚多脈不數身不熱口不渴切勿見血投涼法當益胃擬理中加味黨參元米炒扁豆炒焦炙甘草炮姜歸身炭血餘炭丹皮炭白芍杏仁陳粳米藕節詒按見識老到立方精卓內則陰虛有火外則寒邪深襲失血咳嗽又兼三瘧病已數月瘧來心口痠痛胸腹空豁難通經云陽維為病苦寒熱陰維為病苦心痛此陰陽營衛之偏虛也擬黃耆建中法和中藏之陰陽而調營衛復合生脈保肺之陰復脈保腎之陰通盤打算頭頭是道矣歸身炭炙甘草大生地砂仁炒五味子鱉甲黃耆青蒿沙參白芍桂枝三分拌炒阿膠麥冬煨生薑紅棗詒按正虛而兼有寒邪故立方如是肝胃不和脘痛嘔酸兼以酒濕熏蒸於胃胃為多氣多血之鄉故吐出瘀血甚多血止之後仍脘中作脹嘔吐酸水法宜調和肝胃切戒寒涼製半夏陳皮茯苓鬱金烏藥延胡桃仁泥炮薑炭香附雞距子蘇梗詒按此與陰虛失血不同更兼氣阻濕鬱故用藥如是少陰水虧陽明火亢鼻血不止擬玉女煎合四生飲法生地黃鮮地黃龜板石膏知母元參北沙參懷牛膝茜草炭血餘炭茅根汁側柏葉汁鮮荷葉汁艾葉汁詒按案方俱精潔不支虛損門失血後咳嗽音啞氣升則欲咳乃腎虛不納也熟地阿膠麥冬沙參川貝紫石英元參藕再診腎氣稍納上氣稍平但咳尚未止四肢無力真陰與元氣虛而不復時當炎暑暑濕熱三氣交蒸虛體最易幻變保養為上用景岳保陰煎生地熟地天冬麥冬沙參玉竹川貝五味子紫石英阿膠東白芍百合煎湯代水詒按前方用紫石英以鎮納腎氣此方用百合以清保肺金此用藥諦當處學者宜留意焉歷春夏秋三季血症屢發診脈虛弱形容消瘦年方十七精未充而早泄陰失守而火升異日難名之疾恐犯褚氏之戒治當滋水降火須自保養為要生地阿膠蒲黃炒麥冬丹皮炒山藥炒茯神洋參扁豆炒茜草根蓮肉茅根鮮藕詒按案語擷古籍之華方亦清穩先吐血而後咳逆喘急延及半載寒熱無序營衛兩虧舌色光紅陰精消涸不能右臥為肺傷大便不實為脾傷水落石出之時難免致劇北沙參茯苓扁豆玉竹五味子金石斛川貝百合麥冬功勞葉詒按上兩案均屬陰損已成之候調治不易奏效而此症大便不實難進清滋較前症更劇然用藥亦不過如此少年自愛者當慎之於早也陽維為病苦寒熱陰維為病苦心痛陽維維於陽陽氣弱則腹痛而便溏陰維維於陰營陰虛則心痛而舌紅也脈微形瘦陰陽並損損及奇經當以甘溫黃耆桂枝當歸炙甘草白芍川貝陳皮砂仁鹿角霜再診但寒不熱便溏脈細肢體面目俱浮悉屬陽虛見象惟舌紅無苔此屬陰傷之候但口不乾渴乃君火之色外露治當引火歸元附桂八味丸加鹿角霜黨參冬朮詒按論病貫串認症真切至用藥之淺深輕重亦覺步步穩實先後天俱不足痰多鼻血陰虧陽亢之徵納少腹疼木旺土衰之兆是以年將及冠猶如幼稚之形面白無華具見精神之乏治先天當求精血之屬培後天須參穀食之方久久服之庶有裨益若一暴十寒終無濟也六君子湯去半夏加山藥扁豆砂仁黑芝麻蓮肉陳粳米上藥為末米飲湯調服或白洋糖湯棗子湯調服亦可又丸方精不足者補之以味當求精血之屬治其腎也熟地菟絲子牛膝白芍龜板杞子山藥五味子當歸杜仲丹皮黃柏茯苓鹿角膠萸肉天冬澤瀉上藥為末用河車一具洗淨煮爛將藥末搗和為丸詒按煎丸兩方亦尋常調補之法好在培補先後二天選藥精當一絲不雜左寸關搏指心肝之陽亢右脈小緊脾胃之虛寒是以腹中常痛而大便不實也病延四月身雖微熱是屬虛陽外越近增口舌碎痛亦屬虛火上炎津液消灼勞損何疑今商治法當以溫中為主稍佐清上俾土厚則火斂金旺則水生古人有是論幸勿為世俗拘也黨參於術茯苓甘草炮姜五味子麥冬燈心詒按此陰虧而虛火上炎之症也方以理中合生脈法溫中清上兩面都到所云土厚則火斂金旺則水生見理極精非淺學所能學步北門之龠得守則陽氣固坤土之陽得運則濕濁化濕濁化則津回陽氣固則精守所嫌肌肉盡削夫肌肉猶城垣也元氣猶主宰也城垣傾頹主宰窮困是非大補元氣不可人參熟地萸肉杞子杜仲炙草歸身山藥茯神於術陳皮麥冬半夏蓯蓉穀芽炒詒按案語精切此六君合景岳大補丸煎之方也脾腎兩顧用以填補則可特嫌少靈光耳脾腎兩虛而濕熱又甚雖腰疼夢泄自汗盜汗而口膩味甜大便溏薄腎陰虛而不充脾陽困而不振進求治法只可先運脾陽茅朮炒黑乾薑熟地山藥五味牡蠣黨參茯神棗仁浮麥紅棗詒按此黑地黃丸加味確合脾腎兩補之法方中乾薑宜炮黑用再診溫運脾陽補攝腎陰仿繆仲醕雙補丸法茅朮制炮姜牡蠣黨參茯苓補骨脂熟地杜仲山藥首烏制浮麥五味子紅棗三診脾陽稍復腎陰仍弱節交夏至陽盛陰衰之候大劑養陰以迎一陰來復兼化濕熱以調時令之氣熟地生地黨參冬朮茅朮制黃柏鹽水炒茯神麥冬五味牡蠣龍骨杜仲消證門脈沉細數澀血虛氣鬱經事之不來宜也夫五志鬱極皆從火化飢而善食小水澄腳如膿三消之漸匪伊朝夕然胸痛吐酸肝鬱無疑肝為風藏郁甚則生蟲從風化也姑擬一方平中見奇川連一錢吳萸炒麥冬三錢薑汁炒蛤殼五錢建蘭葉三錢鮮楝樹根皮洗一兩詒按病屬陰虛火旺案中生蟲一層未免蛇足再診服藥後大便之堅且難者化溏糞而易出原屬苦泄之功然脈仍數澀究屬血虛而兼鬱熱鬱熱日甚藏陰日鑠舌紅而碎口渴消飲所由來也月事不至血日乾而火日熾頭眩目花帶下皆陰虛陽亢之見症補藏陰為治本之緩圖清鬱熱乃救陰之先著轉輾思維寓清泄於通補之中其或有濟耶所慮病根深固未易奏績耳川連黃芩黑梔生地當歸阿膠川芎白芍建蘭葉另大黃䗪蟲丸每早晚服五丸詒按寓清於補恰合病機三診諸恙皆減惟內熱未退帶下未止經事未通仍以前方增損川連當歸洋參白芍女貞子茯苓生地麥冬丹參沙苑四診經云二陽之病發心脾不得隱曲女子不月其傳為風消風消者火盛而生風渴飲而消水也先輩謂三消為火疾久而不已必發癰疽余屢用涼血清火之藥職此故也自六七月間足跗生疽之後所患消症又稍加重其陰愈傷其火愈熾今胸中如燔牙痛齒落陽明之火為劇考陽明之氣血兩燔者葉氏每用玉女煎姑仿之鮮生地石膏知母元參牛膝川連大生地天冬麥冬茯苓甘草枇杷葉詒按此亦消渴門中應有之症不可不知一水不能勝五火火氣燔灼而成三消上渴中飢下則溲多形體消削身常怕熱稚齡犯此先天不足故也生地北沙參知母花粉石膏甘草麥冬五味子牡蠣茯苓川連詒按稚年患此多在炎暑之時其症有兼見風痙煩躁者余嘗以此法參用涼肝之品以黃蠶繭煎湯代水頗有效驗諸郁門血虛而有瘀氣虛而有滯血虛則心跳血瘀則少腹結塊且多淋帶氣虛故無力氣滯故胸脹滿也補而化之調而理之黨參川芎茯神陳皮川斷歸身香附白芍木香砂仁玫瑰花詒按補而不滯暢而不克此之謂調理此等方看似尋常其實頗費斟酌營虛氣鬱營虛則內熱氣鬱則脘脹法以養營舒郁丹參香附川貝茯苓歸身棗仁陳皮牛膝首烏制續斷砂仁紅棗詒按此虛實互治之法心胸覺冷經事數月一來食入則腹中脹痛寒痰氣鬱凝滯不通當以辛溫宣暢遵熟料五積意半夏茯苓桂枝蒼朮白芍川芎丹參歸身川樸甘草陳皮枳殼良薑詒按此照五積原方去麻桔芷加丹參用藥極其熨帖再診苦辛溫通之劑能調經散痞用之而效益信古人言不妄發法不妄立在用者何如耳前方去良薑加茺蔚子砂仁中卷嘔噦門胃陽虛則水飲停脾陽虛則穀不化腹中漉漉胸脅脹滿納入輒嘔酸水清涎或噯腐氣以溫通法崇土利水炮姜陳皮蒼朮半夏茯苓熟附白朮黨參澤瀉枳實蔻仁穀芽詒按中陽不運痰濕易停故用治中合二陳法胃中素有酒濕適因鬥毆惱怒引動肝膽之火與胃中之痰相搏致心跳少寐食入則嘔兩手脈沉是氣鬱也用溫膽加味半夏石菖蒲陳皮甘草枳實棗仁茯神雞距子竹茹薑汁炒詒按既有木火內擾則川連梔丹本不可少也再診溫膽湯加沙參川連丹皮旋覆花黑梔雪羹煎坤土陽微濕勝腹中不和用平胃理中合劑焦術川樸陳皮炙草黨參炮姜茯苓延胡原注方中橫插延胡一味想其中兼有瘀凝也詒按立方老潔再診前投溫中運濕腹中呱呱有聲朝食則安暮食則滯臥則筋惕肉瞤時吐酸水中土陽微下焦濁陰之氣上逆病成反胃溫中不效法當益火之源舍時從症用茅朮附子理中湯合真武湯意以治之茅朮附子炮姜炙草陳皮茯苓生薑詒按較前方深一層是亦一定步驟朝食暮吐完穀不化病成反胃始由寒疝腹中結塊氣從少腹上攻胃脘作痛吐酸而起此中下之陽氣不振肝木侮脾脾不磨化幽門不通大便艱澀法以溫運通陽鮮蓯蓉漂淡去甲一兩五錢半夏陳皮枳殼沉香柏子仁桂心牛膝吳萸乾薑腹中痛甚則有塊平則無形每每嘔吐酸水此屬中虛陽氣不運當與大建中湯黨參蜀椒乾薑金橘餅詒按簡明切當如老吏斷獄反胃而兼浮腫小便莖中微痛此中焦陽氣不運而下焦有濕熱也蓽茇磨汁三匙薑汁三匙韭根汁三匙藕汁三匙黃牛乳煎飲兩杯另用沉香末一錢血珀一錢研末分六服再診內經云三陽結為之膈三陰結為之水此症反胃而兼浮腫是三陰三陽俱結也陰陽俱結治法極難前方用蓽茇牛乳飲調服沉香血珀末撥動其陰陽俱結之氣幸反胃之勢已平是其三陽之結已解今腹滿雖寬而腿足之腫仍若是三陰之結猶未解也蓋太陰無陽明之陽少陰無太陽之陽厥陰無少陽之陽則陰獨盛於內而陽氣不通陰氣凝澀膀胱不化而水成焉其脈沉細蓋重陰之象也凡補脾崇土溫潤通陽如理中腎氣丸之屬固亦合法然不若周慎齋和中丸之制為尤妙以其用乾薑能回陽明之陽於脾肉桂回太陽之陽於腎吳萸回少陽之陽於肝則三陽氣勝而三陰之結解水自從膀胱出矣周慎齋和中丸乾薑二兩切片作四分一分用人參五錢煎湯浸拌收干炒黑一分用青皮二錢煎湯拌炒黑一分用陳皮三錢煎湯拌炒黑一分用蘇葉二錢五分煎湯拌炒黑肉桂去皮一兩切片作四分一分用益智仁一錢五分研同煮收干一分用澤瀉二錢五分煎濃湯同煮收干一分用茴香一錢五分同煮收干一分用補骨脂二錢五分研同煮收干吳萸五錢作二分一分用薏仁五錢煎湯拌炒一分用青鹽五錢煎湯拌炒黃黨參元米炒一兩茯苓焙一兩製半夏炒一兩甜杏仁一兩茅朮三錢用米泔同浸煮乾去茅朮上藥為末用神麯二兩磨粉煮糊搗丸每朝服一錢暮服五分用薏仁三錢陳皮五分煎湯送下詒按議論精當方法亦清切靈活此等方案固自可法可傳案中論病頗合機宜惟所解內經三陰三陽等語隙與經旨不合氣鬱痰凝胸中失曠背寒脊痛納少哽噎甚則吐出膈症之根旋覆花代赭石桂枝半夏栝蔞皮薤白杏仁茯苓竹茹詒按此症初起痰氣阻於上焦故立方專從肺胃著意以後五方於用藥層次均能絲絲入扣再診諸恙仍然痰稍易出桂枝蔞皮薤白陳皮鹿角乾薑旋覆花竹茹枇杷葉三診背為陽位心為陽藏心之下即胃之上也痰飲竊踞於胃之上口則心陽失其清曠而背常惡寒納食哽噎是為膈症之根蓋痰飲屬陰礙陽故也川附桂枝薤白丁香杏仁栝蔞皮白蔻豆豉神麯旋覆花竹茹枇杷葉四診服溫通陽氣之藥嘔出寒痰甚多未始不美惟納食未順哽噎之勢未和膈症之根尚在仍以溫通再觀動靜川附桂枝薤白半夏陳皮栝蔞皮杏仁桃仁薑汁白蜜韭菜根汁五診上焦吐者從乎氣中焦吐者從乎積此納食哽噎少頃則吐出數口且多清水黏痰是痰積在中焦故也究屬膈症之根勿得輕視瓦楞子白芥子萊菔子蘇子旋覆花桃仁川附半夏陳皮蓽茇薑汁白蜜詒按此症因痰氣兩阻故用藥始終如是瘧後痰氣阻滯胃脘清陽不舒氣升作呃納食輒嘔已經半月防成膈症且與仲景法化痰鎮逆旋覆花赭石乾薑半夏香附赤苓丁香柿蒂詒按方案俱簡當可法也據述病由喪子悲傷氣逆發厥而起今診左脈沉數不利是肝氣鬱而不舒肝血少而不濡也右關及寸部按之滑搏滑搏為痰火肺胃之氣失降而肝木之氣上逆將所進水穀之津液蒸釀為痰阻塞氣道故咽嗌胸膈之間若有膹塞而納穀有時嘔噎也夫五志過極多從火化哭泣無淚目澀昏花皆屬陽亢而陰不上承之象目今最要之症乃胸膈咽噎阻塞的系膈氣根萌而處治最要之法順氣降火為先稍參化痰復入清金金清自能平木也蘇子茯苓半夏枳實杏仁川貝沙參橘紅麥冬海蟄竹茹荸薺原注此七氣湯溫膽湯麥門冬湯三方增減降氣化痰生津和胃大抵病起於肝戕及肺胃故立方當從肺胃為主詒按細勘病機斟酌虛實立方似覺平淡實已慘淡經營七情鬱結痰氣凝聚胸膈不利時或嘔逆症將半載脾氣大虛前方四七二陳降氣化痰舒其鬱結今再參入理中兼培中土治標兼固本也四七湯夏樸苓蘇薑棗合二陳湯理中湯加丁香木香蔻仁詒按此症痰氣兩層必須兼到操勞抑鬱營虛火亢胃液枯槁飲食哽噎嗌中一條如火之焚有時呱呱作聲此氣火鬱結使然也病關情志非徒藥力可瘳宜自怡悅旋覆花赭石沙參黑梔茯苓川貝神麯麥冬甜杏仁竹茹枇杷葉詒按立方輕清穩適緣病在上膈且屬氣火無形固非可以重劑邀功者也方中焦曲可去之再診氣火上逆咽喉不利痛至胸脘飲食哽噎呱呱有聲膈症已成圖之非易況年逾六旬長齋三十載胃液枯槁草木無情何能使之濡潤宜自開懷怡悅為佳前方加洋參半夏胃汁乾枯腸脂燥涸所進飲食盡化為痰不生津血是以納食則吐而痰隨吐出膈症之根漸深高年靜養為宜鮮蓯蓉一兩茯苓陳皮鹽水炒枳殼青鹽半夏當歸酒炒沉香磨沖詒按此病已深用藥雖合未必能愈矣再診津枯氣結噎膈蓯蓉丸是主方前方加柏子仁炒雪羹煎每日用柿餅一個飯上蒸軟隨意嚼咽吐血後呃逆作止不常迄今一月舌苔白膩右脈沉滑左脈細弱其呃之氣自少腹上衝乃瘀血挾痰濁阻於肺胃之絡而下焦相火隨衝脈上逆鼓動其痰則呃作矣病情並見安可模糊若捕風捉影無惑乎其不效也今酌一方當必有濟幸勿躁急為要半夏茯苓陳皮當歸鬱金丁香柄水紅花子七分柿蒂二個藕汁薑汁另東垣滋腎丸一錢陳皮生薑湯送下詒按用煎劑以通肺胃之絡阻用丸藥以降沖逆之相火思路精細自然熨帖納食輒嘔清水涎沫米粒病在胃也曾經從高墮下脅肋肩膊時痛是兼有瘀傷留於肺胃之絡故嘔有臭氣擬化瘀和胃降逆止嘔為治旋覆花歸鬚鬱金杏仁半夏丹皮查炭茯苓橘紅蔻仁詒按此屬初起輕淺之劑病深者尚宜加重伏氣門舌乾而絳齒燥唇焦痰氣喘粗脈象細數無形之邪熱熏蒸於膻中有形之痰濁阻塞於肺胃而又津枯液燥正氣內虛恐有閉厥之變擬化痰滌熱以治其標扶正生津以救其本必得痰喘平神氣清庶幾可圖羚羊角鮮生地元參葶藶子旋覆花代赭石蘇子杏仁川貝沉香竹瀝薑汁枇杷葉茅根肉另滾痰丸三錢人參湯送下詒按虛實兼到立方頗為詳盡方中藥品已多蘇子旋赭可以去之再診頭汗淋漓痰喘不止脈形洪大面色青晦舌紅乾涸齒板唇焦此少陰陰津不足陽明邪火有餘火載氣而上逆肺不降而為喘症勢險危深防厥脫勉擬救少陰之陰清陽明之火益氣以收其汗保肺以定其喘轉輾圖維冀其應手為妙大生地海浮石拌炒洋參五味子牛膝麥冬石膏炙草桑皮川貝陳粳米煎湯代水另用人參一錢煎湯沖服原注此玉女煎合生脈散盡溫病以救陰為急也詒按前後三案均有齒垢唇焦見症其胃府中有垢熱可知用玉女法清胃救腎大致亦合若於中稍參泄熱之意則見效更速矣方中五味酸斂炙草粳米甘膩均不相宜三診頭汗稍收痰喘稍平脈大稍斂但氣仍急促而心中煩躁舌紅乾涸齒垢唇焦津液猶未回虛陽猶未熄上逆之氣猶未下降雖逾險嶺未涉坦途現今心腹似有透喑之象是亦邪之出路仍擬救少陰清陽明再望轉機洋參北沙參元參大生地蛤殼拌炒鮮生地五味子麥冬牛膝豆卷通草竹葉枇杷葉陳粳米煎湯代水詒按此與前方同意四診陰津稍回氣火未平仍宜步步小心勿致變端為幸沙參洋參元參生地麥冬鮮石斛茯神澤瀉石決明天竹黃蘆根詒按仍以養陰之法收功溫邪襲肺肺失清肅濕夾熱而生痰火載氣而上逆喘息痰嘶舌乾口膩昨日之脈據云弦硬現診脈象小而澀數陰津暗傷元氣漸餒頗有喘汗厥脫之慮夫溫邪病隸手經肺位最高治宜清肅痰隨氣湧化痰以降氣為先氣因火逆降氣以清火為要姑擬一方備候酌奪鮮斛射干杏仁象貝沙參冬瓜子桑皮蘇子沉香蘆根竹瀝枇杷葉薑汁原注凡時症之脈先大而後漸小先強而後變弱其熱不退而病反增者必死此死症也無能為力立方用藥無甚深意詒按此要訣也最須記好初病之脈硬大者邪正相搏也轉為弱小正氣餒矣而病象不退而反增正氣不能敵邪也病日進而正日虧不死何待溫邪五日舌苔干黃壯熱無汗胸腹板滿硬痛手不可近此屬結胸煩躁氣促口吐涎沫防其喘厥栝蔞仁川連枳實柴胡黃芩元明粉葶藶子杏仁豆豉黑梔大黃皂莢子原注凡結胸症最忌煩躁氣促此大柴胡大小陷胸梔豉湯合劑詒按葶藶治痰喘症屬實者若身不熱而脈微者忌之再診下後結胸之硬滿已消而煩躁昏狂略無定刻舌苔乾燥渴欲飲冷壯熱無汗邪氣猶留於氣分以苦辛寒清裡達表冀其戰汗無變為幸豆豉黑梔黃芩石膏生草石菖蒲赤苓天竹黃另益元散五錢薄荷湯送下詒按此三黃石膏湯合梔豉雞蘇散也幸其壯熱無汗可冀戰汗若汗出而仍壯熱則內陷矣三診戰汗已得脈靜身涼邪已解矣舌黃未去胃中余濁未清尚宜和化豆豉炒香黑梔川貝炒枳殼麩炒連翹赤苓滑石通草竹茹原注凡戰汗後脈靜身涼用方大法不外乎此總以和胃氣化濕熱為主胸悶頭痛寒熱往來邪在少陽有汗熱仍不解是傷於風也舌心苔薄邊色乾紅陰虧之體邪未外達而津液暗傷漸有化燥之象症經七日中脘拒按似欲大便而不得出少陽之邪傳及陽明胃氣將燥實矣防其譫語擬少陽陽明兩解法治之柴胡黃芩半夏枳實甘草栝蔞仁豆豉黑梔桔梗竹茹另滾痰丸一錢五分詒按溫邪深伏者往往有汗不解未必皆因於風也少陽陽明合病是大柴胡症想因將燥未燥故不用大黃稍用滾痰丸以示意也再診得汗得便邪有松達之機是以胸悶心跳煩懊等症悉除而頭痛略減也雖自覺虛餒未便多進穀食亦未可即投補劑但和其胃化其邪可耳豆豉炒香豆卷半夏川貝炒陳皮赤茯神鬱金石斛通草竹茹詒按方極妥洽三診得汗得便之後用和胃化邪法一劑頗安兩劑反劇良以畏虛多進穀食留戀其邪不能宣化鬱於心胃之間濕蘊生痰熱蒸液爍遂見煩躁噁心錯語等症兩手寸關脈細滑數兩尺少神舌邊乾紅心苔黃膩皆濕熱鬱蒸將燥未燥欲陷未陷之象當此陰虧之體能不慮其內陷乎擬導赤瀉心各半法生津化濁和胃清心犀角川連半夏枳實赤苓鮮石斛連翹橘紅黑梔生草通草鬱金竹茹蘆根另萬氏清心丸六分詒按推論病原未嘗不細意研求但伏溫之邪每多一層解後停一二日再透一層且每有後一層之邪更甚於前者此症乃第二層之邪發作耳觀後數案病情自明若謂穀食戀邪與以後病情不合矣且不至有如此重候也查萬氏原方中山梔川連鬱金均已入煎劑所少者牛黃一味耳且似此病情可不必加用四診症交十二日身熱不揚神昏舌短苔黴邪入膻中閉而不達急急清泄芳開希冀轉機為妙犀角鮮生地豆豉四錢同打連翹元參牛蒡子枳實鬱金天竹黃石菖蒲鮮石斛鮮薄荷根蘆根另紫雪丹五分詒按此按病情大是可危五診神情呼喚稍清語仍不出邪欲達而未達也胸脅紅點稍現跡稀不顯斑欲透而未透也口臭便秘矢氣陽明燥實復聚也舌短心焦邊絳膻中邪火方熾也芳香開泄之中參以生津蕩實竭心力而圖之冀挽回於萬一前方加沙參生地大黃元明粉詒按服此方後想已得有大解氣分之邪熱得泄故下方專於清營六診口臭噴人胃火極甚斑疹雖見透而未足目赤神糊脈洪口渴急速化斑為要古法化斑以白虎為主仍參入犀地清營解毒再復存陰又適合玉女煎法未知能應手否鮮地豆豉同打石膏薄荷頭同打犀角天竺黃知母人中黃麥冬沙參洋參大生地石菖蒲蘆根詒按此方與後方如仍加大黃以通胃府則伏熱得泄可免後來許多周折七診目能識人舌能出口症勢漸有生機法以大劑存陰冀其津回乃吉大生地洋參麥冬鮮地鮮斛元參北沙參犀角石膏生草蔗汁詒按至此始有轉機亦險矣哉八診黑苔剝落舌質深紅陰津大傷燥火未退左脈細小右脈洪數是其徵也此際陰傷火旺少陰不足陽明有餘惟景岳玉女煎最合一面瀉火一面存陰守過三候其陰當復鮮生地石膏元參洋參知母生草大生地沙參黑梔連翹蘆根詒按有形之垢已去無形之熱猶存用藥仍宜虛實兼顧不敢稍忽也九診頻轉屎氣咽喉乾燥燥則語不出聲此陽明燥火熏蒸津不上承重救其陰兼通其府再商大生地一兩鮮生地一兩沙參一兩麥冬三錢海參二兩元參五錢大黃酒浸三錢元明粉三錢生草四分詒按此吳鞠通增液承氣法也因府中垢熱又聚故用藥如此如前第六七方中仍兼大黃用之則無此波折矣海參腥穢不堪入口擬去之仍加洋參石斛十診下後陰液未回急當養陰醒胃大生地洋參茯苓橘紅麥冬石斛北沙參元參穀芽蔗皮十一診耳聾無聞舌乾難掉陰津大傷用復脈法大生地阿膠川連末拌炒麥冬洋參炙甘草元參雞子黃詒按熱去陰傷此後可專意養陰矣然耳聾未聰則陰經尚有餘熱未泄也十二診疊進滋陰大劑生津則有餘瀉火則不足今交三候齒垢退而復起神色已清非陰之不復乃燥火未清耳賢者觀過知仁智者見微知著今當轉筆法取輕清洋參枳殼麩炒川貝橘紅鹽水炒棗仁豬膽汁炒赤苓川連鹽水炒竹茹雪羹煎詒按此方用意不甚親切緣此時仍宜養陰泄熱兩層兼到方合病機十三診諸恙向安每啜稀粥必汗出沾濡非虛也乃津液復而營氣敷布周流也小便澀痛餘火未清惟宜清化而已冬瓜仁甜杏仁鮮石斛黑梔甘草梢生穀芽通草詒按小便澀痛宜參導赤各半法加生地木通連柏十四診病退之餘日間安靜至夜發熱神糊乃餘熱留於營分也小便熱痛心火下趨小腸仿病後遺熱例用百合知母滑石湯合導赤散鮮生地木通甘草梢竹葉心川百合知母滑石泉水煮湯煎藥詒按病後餘波亦題中應有之義方亦輕清合度伏邪挾積但熱不寒頭痛鼻血便泄稀水表裡兩窒而熱甚於里擬清裡解表法葛根芩連湯加豆豉連翹枳實黑梔原注鼻血便泄稀水知其為熱不用犀角者其舌苔白也不用大黃者其脘腹按之不痛也詒按此症專意解表想因未得汗解故也陰虛挾濕之體感受時令風邪初起背微惡寒頭略脹痛欲咳不爽發熱不揚舌苔白膩大便溏泄此其常候也峻投消散暗劫胃津以致飢而欲食嗜臥神糊呃忒斷連斑疹隱約症方八日勢涉危機閱周先生方洵稱美善鄙意僭加甘草一味以和之其生津補中之力未始非贊襄之一助也若云甘能滋濕甘能滿中孰不知之須知苔薄白而光滑胸不滿而知飢乃無形濕熱已有中虛之象此葉氏所以深戒苦辛消克之劑也幸知者察焉牛蒡子石菖蒲前胡橘紅鬱金桔梗天竺黃刀豆子神麯連翹甘草薄荷竹茹枇杷葉詒按審症精細論亦透澈苔白滑而光亮無津此濕蘊津傷之候專投香燥每每涸液增變案中議論洵屬閱歷之言再診症逾旬日的系溫邪挾濕病在氣營之交苔白膩而邊紅疹透點而不爽寐則譫語寤則神清呃聲徐而未除脈象耎而小數周先生清營泄衛理氣化濁恰如其分僭加一二味仍候主裁犀角天竺黃川連鹽水炒橘紅鮮薄荷根連翹牛蒡子通草柿蒂青鹽半夏丁香竹茹茅根枇杷葉三診熱處濕中神蒙嗜臥呼之則清語言了了驗舌苔之白膩參脈象之耎數知非熱陷膻中乃濕熱瀰漫於上焦肺氣失其宣布耳呃尚未除胃濁未化擬從肺胃立法旋覆花代赭石冬瓜子射干杏仁川貝桔梗鬱金橘紅沙參通草竹茹茅根枇杷葉詒按論病清切此時若誤認入營而投清營之品則邪機愈遏而增病矣以中虛陰弱之體患溫邪挾濕之病過投辛燥則陰涸過與消克則中傷若迴護其虛又恐助濁增病此等症用藥最難觀前後六案論病親切用藥清靈疏邪扶正虛實兼顧自非老手不辦四診呃忒已除舌苔稍化欲咳不揚仍以前法加減前方去赭石加蛤殼赤苓雪羹煎五診前方去旋覆花射干桔梗加豆卷六診便泄數次黏膩垢汙胃濁以下行為順未始不美故連日沉迷嗜臥昨宵便惺惺少寐但少寐則神煩自覺有不安之象且屢起更衣愈覺倦乏不堪耳今便泄未止舌苔仍白身熱已和酒客中虛濕勝擬和中化濁仿子和甘露飲野於術洋參赤苓澤瀉滑石藿香雞距子葛花木香橘紅通草竹茹七診病已退濕未楚前方加減前方加參鬚神麯穀芽凡症於陰陽虛實疑似之間最當詳審此症音低神倦似虛而便泄臭水中脘按痛實也肢冷脈細似陰而小便熱痛陽也至於舌白譫語乃痰蒙火鬱之徵而日暮煩躁為陰虛陽盛之兆鄙意百般怪症多屬乎痰痰蒙火鬱清化不解須從下奪即使正虛而虛中夾實亦當先治其實耳羚羊角天竺黃石菖蒲膽星鮮石斛茯神橘紅鬱金竹瀝薑汁另滾痰丸詒按議論明快立方切實的是此道中高手再診風火熾盛痰迷竅絡神昏不語耳聾目張痙厥之兆立至症屆兩候正在關節之期勉擬一方以盡人事犀角羚羊角鮮石斛鮮生地石決明茯神天竺黃石菖蒲元參膽星三診無形之風火鴟張故神識昏蒙不醒而有形之痰濁上泛故舌苔反見濁厚清開不應擬進苦泄再望轉機川連枳實膽星半夏石決明橘紅赤苓滑石竹瀝薑汁羚羊角另當歸龍薈丸四診有汗發痙謂之柔痙痙盛神昏風淫火熾極矣夫內風多從火出欲熄其風先須清火欲清其火必須鎮逆考古有風引湯一法多用石藥其原論云痙發不止醫不能療風引湯主之良由風火熾盛草木諸藥不能平旋動之威非用石藥之剽悍滑疾者不足以勝之故曰醫不能療也病極凶危醫宜盡力其然其否尚祈高明裁正石膏寒水石紫石英靈磁石紫蛤殼滑石石決明生地砂仁拌炒阿膠赤石脂拌炒鉤鉤牛膝炭竹瀝薑汁詒按疊進清火豁痰三方而病勢未平仍有昏痙之狀不得已而出此方竊思溫邪乃伏氣內發之病每多已發之邪化熱而為痙厥未發之邪仍舊鬱伏不動及外一層經清化而解然後內伏之邪再逐層外露故於清化之後再用透托者有之再用下泄者有之再用清營通絡者亦有之此證病情如此疑其尚有伏邪在內所致金匱風引湯所治之症究與時邪發痙之症有別姑存之以備一法可也素有肝胃病適挾濕溫七日汗解八日復熱舌灰唇焦齒板口渴欲得熱飲右脈洪大數疾左亦弦數脘中仍痛經事適來靜思其故假令肝胃病木來乘土氣鬱而痛若不挾邪斷無如此大熱又大便堅硬而黑是腸胃有實熱所謂燥屎也考胃氣痛門無燥屎症惟瘀血痛門有便血而此症無發狂妄喜之狀又斷乎非蓄血也渴喜熱飲疑其有寒似矣不知濕與熱合熱處濕中濕居熱外必飲熱湯而濕乃開胸中乃快與真寒假熱不同再合脈與唇觀之其屬濕溫挾積無疑傷寒大白雲唇焦為食積此言諸書不載可云高出千古豆豉鬱金延胡山梔香附栝蔞皮連翹赤苓竹茹外用蔥頭十四個鹽一杯炒熱熨痛處原注病本濕溫挾食交候戰汗而解少頃復熱為一忌汗出而脈躁疾者又一忌適值經來恐熱邪陷入血室從此滋變亦一忌故用豆豉以解肌黑梔以清裡一宣一泄祛表裡之客邪延胡索通血中氣滯氣中血滯兼治上下諸痛鬱金苦泄以散肝鬱香附辛散以利諸氣二味合治婦人經脈之逆行即可杜熱入血室之大患栝蔞通府赤苓利濕加竹茹連翹一以開胃氣之郁一以治上焦之煩外用蔥鹽熱熨即古人摩按之法相贊成功詒按此等症最易混淆案語層層搜剝可謂明辨以晰惟既見挾積方中似應加用枳實山楂此症汗解復熱凡伏氣發溫逐層外出之症往往有此不必疑其別有他邪也用藥兩疏表裡大致亦合惟既見舌灰唇焦則中焦有濁積無疑疏里之藥尚宜加重倘苔灰而燥即大黃亦可用也再診服藥後大便一次色黑如慄者數枚兼帶溏糞脘痛大減舌黴唇焦俱稍退原為美事惟脈數大者變為虛小無力心中覺空是邪減正虛之象防神糊痙厥等變今方九日延過兩候乃吉香豉青蒿沙參赤芍川貝鬱金黑梔竹茹稻葉金橘餅詒按大解後熱平脈轉弱小倘內伏之熱邪已淨或稍有餘熱而不甚重則從此各候俱平只須清養而已若停一二日伏邪再熾則脈隨病變或仍轉數大亦未可知若熱勢盛而脈虛小是邪盛正虛之重候仍當隨見症治之不得以九日兩候等語為憑也暑病門素有痰飲咳嗽今夏五月曾經吐血是肺受熱迫也茲者六七日來伏暑先蘊於內涼風復襲於外病起先寒慄而後大熱熱勢有起伏表之汗不暢清之熱不退所以然者為痰飲阻於胸中肺胃失其宣達故也夫舌色底絳而望之黏膩獨舌心之苔白厚如豆大者一瓣此即伏暑挾痰飲之症而況氣急痰嘶乎據云廿六日便泄數次至今大便不通按腹板窒隙不硬痛小水先前紅濁今則但赤不渾此乃濕熱痰濁聚於胸中因肺金失降不能下達膀胱故濕濁不從下注而反上逆為痰氣喘嗘之症也病機在是病之凶險亦在是當從此理會滌痰泄熱降氣清肺乃方中必需之事但清肅上焦尤為要務耳葶藶子枳實鬱金杏仁羚羊角川貝膽星連翹赤苓竹瀝薑汁枇杷葉滾痰丸絹包入煎詒按案語精當方藥親切迥殊率爾操觚暑乃鬱蒸之熱濕為濡滯之邪暑雨地濕濕淫熱鬱惟氣虛者受其邪亦惟素有濕熱者感其氣如體肥多濕之人暑即寓於濕之內勞心氣虛之人熱即伏於氣之中於是氣機不達三焦不宣身熱不揚小水不利頭額獨熱心胸痞悶舌苔白膩底絳尖紅種種皆濕遏熱伏之徵顯系邪蘊於中不能外達擬以梔豉上下宣泄之雞蘇表裡分消之二陳從中以和之芳香宣竅以達之冀其三焦宣暢未識得奏微功否六一散黑梔薄荷豆豉半夏陳皮石菖蒲赤苓鬱金蔻仁通草竹茹荷梗詒按議論親切用藥得輕清靈三字之妙再診形體豐肥者必多濕肌肉柔白者必氣虛況暑病必有濕邪遏伏中氣受戕前用微苦微辛宣通三焦服後大便通調胸中寬暢原得小效要知濕性濡滯本難霍然即愈若用辛雄燥濕苦寒泄熱是亦一法然恐非肥白氣虛者所能勝任拙見仍守前法毋存欲速之心反致耗氣之弊惟高明裁之前方去薄荷加杏仁三診白苔漸退而舌心反見裂紋是濕轉燥矣不飢不思食小便仍不爽利餘熱猶滯三焦之氣未盡宣達也三焦者一氣之周流而各司其職上焦主納而不出下焦主出而不納中焦則輸其出納清陽出上竅濁陰走下竅三焦自協於平今議從中升降其上下所謂升降者亦升其清而降其濁耳葛根杏仁赤苓陳皮紫菀薏仁川貝炒黃澤瀉血珀竹茹大麥稻葉外有寒熱起伏之勢里有熱結痞痛之形上為煩懊嘔惡下則便泄溏臭此新邪伏邪濕熱積滯表裡三焦同病也易至昏呃變端擬從表裡兩解佐以芳香逐穢冀其轉機為妙柴胡栝蔞仁黃芩半夏赤芍蔻仁枳實石菖蒲大黃川連鬱金詒按頗合病機藥品亦切實不膚再診投兩解法得汗得便竟得安然兩目昨已起床照鏡啟窗看菊須臾之間漸漸發熱熱甚神糊兩目上視幾乎厥脫迨至黃昏神識漸清熱勢漸減然脈沉不起據述熱時舌色乾紅熱退舌色黃膩此乃濕遏熱熾將燥未燥但陽症陰脈相反堪虞勉議河間甘露飲子於滌熱燥濕之中更藉桂以通陽苓以通陰復入草果祛太陰濕土之寒知母清陽明燥金之熱未識得奏膚功否寒水石石膏茯苓澤瀉茅朮桂枝蔥白頭豬苓草果知母薑汁詒按此是正氣已衰餘邪復聚之症所擬之方大致頗合但嫌藥味粗獷未能絲絲入扣耳年過花甲病逾旬日遠途歸家舟輿跋涉病中勞頓雪上加霜欲詢病原無從細究刻診脈象沉糊神識矇昧舌強色白中心焦燥身熱不揚手足寒冷氣短作呃便泄溏臭憑理而論是屬伏邪挾積正虛邪陷之象深恐有厥脫之虞勉酌一方還祈明正人參大黃附子柴胡半夏茯苓陳皮黃芩丁香當歸枳實柿蒂澤瀉竹茹詒按虛寒積熱層層照顧處處著力此等方非學力極深者不能下筆再診症勢尚在險重擬方再望轉機柴胡桂枝人參白芍半夏川連薑汁炒枳實丁香橘皮炙草蔻仁竹茹三診伏暑化燥劫津動風舌黑唇焦鼻煤齒燥神識昏糊手指牽引今早大便自通據云病熱略減然兩脈促疾無倫陰津消涸邪火燎原仍屬險象鮮生地鮮石斛犀角元參鉤鉤連翹天竹黃北沙參通草蘆根竹葉羚羊角六一散枇杷葉另珠黃散沖服詒按幸得大便自通尚有一線生機伏暑為病濕熱居多陰虛之體邪不易達此其常也然就陰虛而論大有輕重之分須知此症虛亦不甚邪亦不多即據耳鳴眩悸苔濁胸痞微寒微熱脈形弦數立方未便著手大補亦不可重劑攻邪但得脈情無變可保無虞慎勿徒自驚惶反增他變洋參茯神辰砂拌甘菊蔻仁陳皮青蒿鉤鉤刺蒺藜半夏秫米豆卷竹茹詒按不沾沾於補虛不斤斤於泄邪而所用藥品按之症情無不絲絲入扣所謂成如容易隙艱辛非學識兩深者不易辦此餘邪余積雖留戀而未清元氣元陰已耗損而欲竭暫停苦口之藥且投醒胃之方化滯生津忌夫重濁變湯蒸露法取輕清效東垣而化裁希弋獲以圖幸清暑益氣湯加荷葉稻葉蒸露一日溫飲四五小杯詒按伏暑久淹正虛邪戀胃弱不勝重藥者此法當仿瘧疾門伏邪挾積阻塞中宮瘧發日輕日重重則神糊煩躁起臥如狂此乃食積蒸痰邪熱化火痰火上蒙怕其風動痙厥脈沉實而舌苔黃邪積聚於陽明法當通下仿大柴胡例柴胡黃芩川樸枳實栝蔞仁半夏大黃詒按脈舌與症合參大柴胡是的對之藥再診下後熱淨神清竟若脫然無恙惟是病退太速仍恐變幻莫測擬方再望轉機川連薑汁炒半夏陳皮豆豉黃芩枳實栝蔞仁鬱金神麯竹茹原注病退太速仍恐變幻老煉之言宜省凡下後方法總以瀉心加減仍用栝蔞枳實想胸痞未舒舌苔未化耳三診昨日瘧來手足寒冷即時腹中氣脹上塞咽喉幾乎發厥但不昏狂耳此乃少陽瘧邪挾內伏之痰濁上走心胞為昏狂下乘脾土為腹脹前日之昏狂病機偏在陽明故法從下奪今腹脹舌白脈細病機偏在太陰法當辛溫通陽轉運中樞為要矣隨機應變急者為先莫謂用寒用熱之不侔也乾薑炒黃陳皮茯苓草果熟附川樸蔻仁檳榔丁香通草原注前方用寒後方用熱隨症用藥轉換敏捷不避俗嫌的是一腔熱血詒按此人必中氣素虛故痰濁乘虛上僭也四診投果附達原神香二陳合劑服藥後喉中汨汨有聲上逆之氣即平腹脹遂松今脈緩大神氣安和腹中微覺脹滿痰多黏膩脾藏陽氣雖通寒濕痰涎未化仍從前法輕減其制前方去附子檳榔加大腹皮半夏五診腹中之氣稍平濕熱餘邪未盡所以微寒微熱仍歸瘧象頭脹身疼知飢能食法擬疏化兼調營衛青蒿豆卷半夏陳皮穀芽秦艽神麯茯苓姜棗陳無擇云瘧家日久必有黃痰宿水聚於胸腹膈膜之中須得脾土旺而後宿水自行元氣復而後濕痰自化余見久瘧有泄水數次而愈者即宿水自行之效也六君子湯加炮姜木香神麯砂仁詒按前曾見治老瘧之法用逐痰瀉水之藥入雞子中煮服得泄黃水即愈其意與此正同但用藥有虛實之分耳三瘧久延營衛兩傷復因產後下焦八脈空虛今病將九月而瘧仍未止腹中結塊偏左此瘧邪留於血絡聚於肝膜是屬瘧母淹纏不止慮成瘧勞夏至在邇乃陰陽剝復之際瘦人久病最怕陰傷趁此圖維迎機導窾和陽以生陰從產後立法稍佐搜絡以杜瘧邪之根制首烏杞子地骨皮當歸白芍桂枝炒冬朮川芎青皮香附烏梅另鱉甲煎丸原注用四物湯去地換首烏從產後血分立腳再診瘧久結癖夏至前投和陽生陰通調營衛參入搜絡方法節後三瘧仍來但熱勢稍減癖塊略小然口渴心悸營陰大虧情懷鬱勃多致化火傷陰木曰曲直曲直作酸瘧來多沃酸水蓋肝木鬱熱挾胃中之宿飲上泛使然夫養營陰須求甘潤理肝鬱必用苦辛久瘧堪截癖塊宜消惟是體虛胃弱諸宜加謹為上黨參鱉甲醋炒當歸茯神棗仁香附川連吳萸炒冬朮陳皮牡蠣三稜醋炒詒按因病化裁頗不沾滯方中白芍似不可少另用川貝一兩半夏一兩知母一兩研末薑汁醋各半泛丸每服三錢開水送下詒按此半貝丸成法也增入知母一味嫌其偏於涼潤尚有可商但寒不熱此為牝瘧柴胡桂枝湯主之柴胡桂枝乾薑半夏陳皮茯苓川樸草果炙草薑棗再診瘧髮間日但寒而不熱口膩多涎乃寒痰鬱於心下陽氣不得宣越故也蜀漆桂枝半夏陳皮茯苓羌活石菖蒲另用獨頭蒜一個黃丹一錢雄黃五分共搗丸朝向東方服三診舌白脘悶背寒獨甚擬宣通陽氣以化痰濁麻黃桂枝杏仁炙草半夏茯苓陳皮鹿角霜石菖蒲原注以上三方皆金匱法四診瘧止當和胃氣半夏茯苓甘草陳皮白蔻姜棗詒按牝瘧不多見大略由乎陽虛痰聚阻遏邪機不得外越所致用藥總以通陽宣濁為主少陽過升陽明失降瘧來煩悶痞嘔當變柴胡之制而為瀉心之法和陽明即所以和少陽也川連薑汁炒半夏陳皮蔻仁藿梗生薑竹茹薑汁炒原注此病舌色左半邊光紅右半邊白苔濕滑如水晶粉團之色因過服柴胡升陽以劫其營而痰濁又變於胃以致痞嘔故用瀉心之法初用生薑一片無效後加至三片痞嘔乃止瘧亦不來詒按用古法而能通其意心靈手敏此為善讀書人素有痰飲咳嗽近復涼風外薄食積內停寒熱似瘧脈弦數額角痛胸脘痞脹大便不通是有表復有里也擬以疏里解表柴胡黃芩半夏枳實川樸大腹皮橘紅竹茹詒按立方用藥不深不淺如初拓黃庭恰到好處再診脈弦數兩手掌心獨熱大便五日不通舌苔薄白不黃燥屎尚未全結欲通其腑緩法為宜川連薑汁炒枳實磨沖蔞仁研半夏萊菔子炒竹茹詒按先用緩法通府此亦病機所在不可不知黃癉門三瘧止而復作腹滿平而又發今目黃脈細面黑溺少防延黑癉然癉而腹滿者難治姑與分消茵陳山梔赤苓滑石陳皮大腹皮附子通草麥芽栝蔞皮再診面色黧黑腹滿足腫脈沉而細此脾胃之陽不化水濕阻滯於中證防增重且與通陽滲濕肉桂去粗皮研五分茯苓豬苓澤瀉大腹皮白朮川樸廣皮神麯細辛麥芽香圓詒按此肉桂五苓散加味溫中疏濕前人所謂陰黃想即指此等症而言兩目及身體皆黃小便自利而清此屬脾虛非濕熱也名曰虛黃黃耆四兩白芍三兩地膚子二兩茯苓四兩酒浸服詒按此癉病中另自一種以小便清利為據症不多見錄之以備一格伏暑濕熱為黃腹微滿小便利身無汗用麻黃連翹赤小豆湯麻黃連翹豆豉茵陳赤苓川樸枳殼通草神麯杏仁赤小豆煎湯代水詒按此濕熱在表而無汗者面黃無力能食氣急脫力傷脾之症也用張三丰伐木丸加味皂礬一兩泥土包固置糠火中煨一日夜取出候冷礬色已紅去泥土淨川樸五錢茅朮一兩米泔浸切炒製半夏一兩陳皮二兩鹽水炒茯苓一兩炙甘草五錢共研細末用大棗肉煮爛為丸每服二錢開水送下飲酒者酒下此方頗效詒按此方以皂礬為君合以平胃二陳明為消除垢積之劑案云脫力傷脾便與此方不合當云脫力脾困瘀濕不化乃合然此方用之頗靈其功效自不可掩痹氣門胸中為陽之位清陽失曠則胸痹而痛下午屬陰故痛甚也用苓桂朮甘湯加味茯苓甘草桂枝白朮栝蔞薤白半夏陳皮乾薑白蔻詒按方藥均親切不浮再診胸痹痰飲脘痛甚則嘔酸脈細胃陽不布先以通陽吳萸乾薑白蔻炙草桂木栝蔞薤白枳實半夏茯苓陳皮詒按胸脘陽微而窒立方兼治上中而以中焦為主三診胸痹腹痛夜甚晝安清陽不振濁陰僭逆法必通陽黨參茯苓冬朮炙草陳皮半夏桂木川椒乾薑川附詒按此六君加桂附姜椒也用藥可謂切實矣脘腹痛門肝胃氣痛痛久則氣血瘀凝曾經吐血是陽明胃絡之血因鬱熱蒸迫而上也血止之後痛勢仍作每發於午後診脈小緊數舌紅無苔乃血去陰傷而氣分之鬱熱仍阻於肝胃之絡而不能透達宜理氣疏郁取辛通而不耗液者為當川楝子延胡鬱金香附茯苓陳皮旋覆花山梔薑汁炒白螺螄殼左金丸詒按方法輕靈自然中病肝氣與飲邪相合為病脘腹作痛嘔吐酸水擬苦辛泄木辛溫蠲飲川連吳萸炒陳皮木香丁香蔻仁乾薑川楝子延胡香附川椒詒按肝氣病兼症最多須看其立方融洽處脈雙弦有寒飲在胃也脘痛吐酸木剋土也得食則痛緩病屬中虛當和中泄木祛寒小建中湯加味主之白芍桂枝乾薑炙草半夏橘餅川椒黨參白朮詒按大小建中合劑方藥穩切脘痛肢冷脈伏頭汗淋漓防厥金鈴子五靈脂延胡旋覆花赭石乳香沒藥丁香蔻仁香附詒按此肝氣挾瘀之症故立方如此再診脘痛甚則防厥薑黃半夏陳皮茯苓香附吳萸旋覆花赭石蔻仁肝木挾下焦水寒之氣乘於脾胃脘痛攻脅嘔吐酸水脈細而弦擬溫中禦寒扶土抑木方法炮姜川椒吳萸黨參桂枝白芍白朮茯苓香附砂仁詒按此肝氣挾感寒治法用藥頗精到素有肝胃氣痛兼有寒積脘痛脹滿痛及於腰刻不可忍舌苔白膩渴不欲飲大便似利不利脈象沉弦而緊按症恐屬藏結頗為險候非溫不能通其陽非下不能破其結仿許學士溫脾法乾薑附子肉桂川樸薑汁炒枳實大黃再診脘腹脹滿上至心下下連少腹中橫一紋如亞腰葫蘆之狀中宮痞塞陰陽格絕上下不通勢瀕於危勉進附子瀉心法通陽以泄濁陰冀大便得通為幸否則恐致喘汗厥脫難以挽回附子川連薑汁炒川樸薑汁炒大黃酒浸長流水煎再服備急丸乾薑大黃巴豆霜七粒砂仁湯下三診兩投溫下大便仍然不通胸腹高突湯水下咽輒嘔肢漸冷脈漸細鼻煽額汗厥脫堪憂按結胸藏結之分在乎有寒熱無寒熱為別下之不通脹滿愈甚乃太陰脾藏受戕清陽失於轉運崔行功有枳實理中一法取其轉運中陽通便在是挽回厥脫亦在是人參枳實炮姜川附陳皮冬朮詒按兩投溫通重劑不得小效枳實理中力量不及前方之大恐未必能奏效也閱夜話錄中所載一症與此相似治之未效後擬用溫藥下來復丹未及試用正可與此參觀三四年來腹痛常發發則極甚必數日而平此脾藏有寒積肝經有濕熱故痛發則腹中覺熱擬溫脾法兼佐涼肝金鈴子延胡陳皮茯苓白朮川椒乾薑白芍吳萸炒神麯砂仁再診腹中寒熱錯雜而痛古方越桃散最妙變散為丸常服可耳稍為加減以合體氣乾薑山梔吳萸白芍炙草共為末神麯糊丸每服三錢開水送下原注越桃散惟薑梔二味加吳萸白芍者復以戊己法也甘草者取其調和也詒按病邪錯雜用藥隙須一線乃佳如此丸方即合法也腹痛便溏脾陽弱也周身疼痛衛陽弱也補中土益衛氣黃耆建中湯主之黃耆桂枝白芍白朮炙草詒按方案俱老到便血之後余瘀凝於肝絡餘熱留於小腸故少腹疼而小便熱痛也化瘀泄熱為治桃仁炒黑丹皮鮮生地木通黑梔滑石歸身查炭生蒲黃新絳另回生丹一粒詒按理法雙清用五積合通聖溫通散寒便通而痛未止脈遲喜食甜味痛在當臍後連及腰身常懍懍惡寒此中虛陽弱寒積內停擬通陽以破其沉寒益火以消其陰翳四君子去甘草加肉桂附子木香烏藥蓯蓉元明粉詒按方中元明粉一味不甚妥洽擬去之疝氣門中陽虛弱厥陰寒疝僭逆腹痛筋急大便堅結痛甚則嘔吐擬大建中湯川椒炮姜黨參附子半夏橘餅詒按此寒疝症之偏於虛者故用藥專於溫理寒濕伏於厥陰久則化熱兩胯凹筋脹左睪丸偏墜發作則身有寒熱則囊皮腫脹出水此謂濕疝也屢發不已防有囊癰之變川楝子巴豆二枚同炒焦去豆三錢茴香鹽水炒吳萸黃柏查炭黑梔橘核萆薢荔枝核詒按濕鬱則化熱故須寒熱互用既屬濕疝似宜參用蒼朮苡仁燥濕之品又疝氣方川楝子巴豆七粒同炒焦去豆五錢小茴香鹽水炒三錢青皮炒三錢木香曬不見火三錢當歸酒炒三錢全蟲酒洗炙七個昆布漂淡炒三錢查炭三錢共研末用韭汁一杯蔥頭汁一杯絲瓜絡煎濃汁二兩泛丸每日服一錢詒按此方溫肝通陽驅邪理疝用意頗佳可以為法子和論七疝都隸於肝近因遠行勞倦奔走傷筋元參下陷其疝益大蓋筋者肝之合也睪丸者筋之所聚也大凡治疝不越辛溫苦泄然勞碌氣陷者苦泄則氣益陷當先舉其陷下之氣稍佐辛溫是亦標本兼治之法補中益氣湯加茯苓茴香延胡全蠍木香又丸方黨參白朮茯苓吳萸烏藥川楝子木香茴香當歸蓯蓉枸杞詒按論病親切不浮瘕癖門前年秋季患伏暑淹纏百日而愈病中即結症積居於左脅之下入春以來每至下午必微熱清晨必吐痰食麵必溏泄此必當時熱邪未盡早進油膩麵食與痰氣互相結聚於肝胃之絡當漸消之否則或脹或鼓均可慮也柴胡鹽水炒青皮巴豆同炒黃去豆一兩三稜醋炒五錢雄黃一兩大黃皂莢子三粒同炒黃去子一兩莪朮醋炒五錢上藥為末神麯糊丸每服一錢橘紅湯下午後服六君子丸三錢詒按用藥思路可取少腹兩旁結塊漸大漸長靜則夾臍而居動則上攻至脘旁及兩脅八九年來如是據云當年停經半載皆疑為孕及產多是汙穢臭水嗣後遂結此塊想系水寒氣血瘀聚而成當溯其源而緩圖之甘遂麵包煨三錢香附鹽水炒一兩三稜醋炒一兩莪朮醋炒一兩桃仁炒五錢肉桂另研一錢五靈脂醋炒五錢地鱉蟲酒浸廿一個川楝子巴豆七粒同炒去豆五錢共研末煉蜜為丸每服十丸一日三服詒按久病緩攻方法頗穩臍以上有塊一條直攻心下作痛痛連兩脅此屬伏梁為心之積乃氣血寒痰凝聚而成背脊熱而眩悸營氣內虧法以和營化積當歸半夏瓦楞子香附丹參茯神陳皮木香川楝子延胡砂仁詒按方亦平穩熨帖再診投和營化積伏梁之攻痛稍緩而脊背之熱亦減久延絡虛當以緩圖無事更張仍從前制前方去茯神瓦楞子木香加茯苓玫瑰肝之積在脅下名曰肥氣日久撐痛痼疾難圖川楝子延胡川連青皮查炭歸鬚五靈脂莪朮三稜茯苓木香砂仁詒按用藥精當再診左脅之痛已緩夜增咳嗽寒熱邪氣走於肺絡擬肺肝同治旋覆花三稜醋炒杏仁茯苓川楝子猩絳款冬花莪朮醋炒半夏陳皮青蔥管歸鬚詒按暢氣疏瘀平肝通絡此等症用藥不過如是少腹結塊漸大如盤上攻則痛下伏則安此屬腸覃氣血凝滯而成擬兩疏氣血法香附丹參紅花當歸澤蘭桃仁延胡廣皮砂仁五靈脂另大黃䗪蟲丸每服二十粒久患休息下痢或作或輟四月下旬痢止數日忽然氣攻胸脘板痛上下不通幾乎發厥及至大便稍通板痛遞減匝月以來大便僅通三次今又不通十餘日矣而其脘中之板痛者結而成塊偏於右部是脾之積也脈極細而沉緊面色晦滯陽氣鬱伏濁陰凝聚當與溫通附子乾薑川樸陳皮茯苓香附延胡大腹子另東垣五積丸沉香化氣丸再診大便已通脘腹之塊未化脈象沉弦而緊面色之晦滯已明陽光一睍陰凝漸通之象仍以溫通附子乾薑陳皮茯苓木香砂仁通草水紅花子白螺螄殼詒按凡陽氣鬱伏者與陽虛不同於溫藥中宜兼清泄之意乃妥脈遲細脘中有塊納食撐脹腹中漉漉有聲噯腐吞酸大便堅結此脾胃有寒積也當以溫藥下之仿溫脾法茯苓大黃附子乾薑桂木川樸陳皮枳實半夏詒按小承氣合二陳加薑桂附驅寒飲導積滯立方簡當脈右關滑動舌苔黃白而膩是痰積在中焦也左關弦搏肝木氣旺故左肋斜至臍下有梗一條按之覺硬乃肝氣入絡所致尺寸脈俱微緩泄痢一載氣血兩虧補之無益攻之不可而病根終莫能拔病根者何痰積濕熱肝氣也夫濕熱痰積須藉元氣以運之外出潔古所謂養正積自除脾胃健則濕熱自化原指久病而言此病不為不久攻消克伐何敢妄施茲擇性味不猛而能通能化者用之人參茯苓於術青陳皮炙草澤瀉枳殼神麯茅朮當歸土炒白芍吳萸三分煎汁炒黃耆防風根詒按擬加金鈴延胡木瓜以疏肝較為周到又丸方製半夏三兩分六分一分木香二錢煎汁拌炒一分白芥子二錢煎汁拌炒一分烏藥三錢煎汁拌炒一分金鈴子三錢煎汁拌炒一分豬苓二錢煎汁拌炒一分醋拌炒炒畢去諸藥僅以半夏為末入雄精三錢研末射香一分獨頭蒜三個打爛用醋一茶杯打和為丸每晨服一錢五分開水送下詒按丸藥製法精巧開後學許多悟境心之積名曰伏梁得之憂思而氣結也居於心下胃脘之間其形豎直而長痛發則嘔吐酸水兼挾痰飲肝氣為患也開發心陽以化濁陰之凝結兼平肝氣而化胃中之痰飲桂枝半夏川連吳萸炒茯苓陳皮蔻仁鬱金延胡川楝子石菖蒲瓦楞子詒按論病立方精到熨帖病由肝氣橫逆營血不調腹中結瘕脘脅攻痛漸致食減內熱咳嗽痰多當臍動跳心悸少寐口乾腸燥是皆血痹虛勞之象極難醫治姑仿仲景法黨參茯苓棗仁乳香沒藥桃仁當歸川貝香附地鱉蟲酒炙白蜜再診前方養營化瘀得下血塊兩枚腹滿稍軟內熱咳嗽未減今且和營啟胃退熱止咳再望轉機黨參茯苓丹參陳皮川貝杏仁當歸阿膠血餘炭地鱉蟲詒按前兩方仿金匱血痹治法確有見地後來咳嗽不止已屬內熱傷肺之象腹中滿痛肝氣不平也愚意仍用潤肺疏肝清陰養血法治之下卷腫脹門病起咳嗽咳止而反氣升入暮尤甚面跗龐然浮腫腹雖未滿而按之不軟此屬腎風蓋風邪乘虛而入於腎腎氣上逆故入暮而氣升為甚用五苓通膀胱導出腎中之邪加細辛以徹少陰之寒風晚上再進都氣丸以安其腎庶幾久蘊之邪得解而腎藏無傷切弗輕視此病須防腹滿之虞五苓散加大腹皮陳皮細辛肉桂另晚服都氣丸鹽湯送下詒按腎風之名出於素問風論其所列症狀與此不甚符合但理可相通此案所立治法亦頗有精意蓋邪入於藏必借所合之府為出路以五苓加味治其膀胱以導出腎邪隨用都氣以培腎藏之本邪正虛實之間面面周到率爾操觚者固不能辦此也風濕相搏一身悉腫咽痛發熱咳而脈浮擬越婢法麻黃石膏赤苓甘草杏仁大腹皮通草詒按咳而咽痛肺有鬱熱故用越婢風水者在表之風邪與在裡之水濕合而為病也其症頭面肢體浮腫必兼咳嗽故為風水更兼食積其腹必滿三焦不利法當開上疏中達下若不避風恐其增重羌活防風枳殼萊菔子杏仁橘紅川樸茯苓澤瀉大腹皮桑皮蔥姜皮詒按症屬外風與內濕相合故用藥從表裡兩解之法內有濕熱外著風邪風與水搏一身悉腫此屬風水當發汗羌活香薷陳皮防風赤苓焦六曲通草生薑蔥白水腫自下而起腿足陰囊大腹胸膈咽喉無處不受其災水勢氾濫浩浩莫御矣今先從上瀉下蓋肺主一身之氣又曰水出高源古人開鬼門潔淨府雖曰從太陽著手其實亦不離乎肺也葶藶子杏仁川樸陳皮茯苓椒目炒出汗姜棗另控涎丹每服七分薑湯送下詒按病象已劇用藥自須從猛但控涎丹藥力猛銳不宜過於多服須酌之病後脾虛氣滯浮腫食少大便溏泄法當溫運脾陽黨參茯苓澤瀉木香冬朮炮姜苡仁神麯砂仁穀芽詒按病後浮腫屬虛故兼培補以上諸案均屬浮腫之病與鼓脹單腹脹諸症之關乎藏氣者輕重淺深迥乎不同臨症者當細意分別勿混視也其有脘腹堅硬結塊者須與積聚瘕癖門各案參看濕熱內阻腸胃之間橫連膜原膜原者臟腑之外肌肉之內膈膜之所舍三焦決瀆之道路邪留不去是為腫脹脹屬氣腫屬水是必理氣而疏決瀆以杜腫脹之萌黑白醜各五錢萊菔子一兩砂仁一兩用陳葫蘆一枚將上三味納入再入陳酒一大杯隔湯燉一炷香取葫蘆中藥炒研細末再以葫蘆炙灰共研和每服二錢詒按立方取義頗佳凡腫脹初起者可以取用痢後陽虛水濕不化腹滿面浮足腫而色青黃脈細慮延鼓脹重症擬溫通脾腎之陽疏利決瀆之氣冀其脹消腫退為妙川附肉桂白朮澤瀉茯苓豬苓川樸陳皮通草冬瓜皮詒按病後陽虛腫脹故用胃苓法加溫運之品腹暴脹而足腫納食則脹益甚濕熱挾氣填塞太陰鼓脹重症川樸赤苓大腹皮青皮澤瀉枳殼查炭黑醜甘遂麵包煨通草姜皮再診腹滿稍寬足仍浮腫運脾化濕冀其漸平川樸茯苓大腹皮椒目澤瀉通草陳皮黑醜蒼朮神麯枳殼姜皮三診腹滿月餘得食則脹甚兩進攻消運脾之法胃脘之脹已松大腹之滿未化再議疏通消導旋覆花五加皮澤瀉雞內金赤苓皮檳榔木香黑醜通草砂仁詒按此三方治腹脹之由乎濕積者初起通用之法附錄葉天士按云徐姓小兒單脹數月百藥無效余用肥兒丸萬安散磨積丹雞肫藥俱不效余謂氣分不效宜治血絡所謂絡瘀則脹也用歸鬚桃仁延胡山甲蜣螂䗪蟲靈脂山楂之類為丸十日全愈詒按此等症本不多見但已經治驗自可存之以備一格附錄吳按云腫脹久延腰痛帶下濁陰尚盛元氣已衰補則恐其助脹滲則慮其傷元擬早上服金匱炒焦方但取其氣不取其味亦有離照當空陰霾四散之義晚仍進清滲之方以膀胱為氣化運行之府也表裡兼治漸次圖功庶木德盛行之候不致加劇耳詒按病難著手者不可無此巧法有以五苓五皮煎湯送炒黑金匱腎氣丸者正與此相似瘧後濕熱內蘊於脾胃之中熱上蒸而為口糜濕內蘊而為腹脹擬和中清化濕熱為法川連酒炒川樸焦曲赤苓枳殼大腹皮澤瀉陳皮黑梔砂仁詒按案方俱平正通達特未知能否奏效耳病由肝鬱木橫剋土濕熱不化先有淋濁愈後漸漸腹脹左脅微覺隱痛身微有熱脈象細弦木鬱不達慮延鼓脹勿輕視之柴胡茯苓白朮香附川芎山梔神麯丹皮白芍青皮川樸香圓另左金丸詒按立方精當雖不見出色而已恰到好處氣鬱於胸為膈氣滯於腹為鼓飲食不納形肉頓瘦陰氣凝聚陽氣汨沒脈細如絲將何療治姑與扶正培土通陽化氣為法黨參熟附肉桂澤瀉白朮茯苓大腹皮另來復丹一錢詒按病已造乎極重此方藥力之猛足以制之從此得效尚可勉圖痞塊由大瘧日久而結多因水飲痰涎與氣相搏而成久則塊散腹滿變為臌脹所謂癖散成臌也脈細如絲重按至骨乃見弦象是肝木乘脾也口乾小便短少是濕熱不運也匝月腹日加大急宜疏通水道泄木和中五苓散加川樸川連薑汁炒青皮陳皮大腹皮木香車前子通草另服古方厚朴散川樸薑汁炒三錢枳殼三錢巴豆七粒合炒黃去巴豆木香曬乾研三錢青皮醋炒三錢陳皮鹽水炒三錢甘遂麵包煨三錢大戟水浸曬乾炒三錢乾薑炒黃三錢共為末每服一錢用砂仁車前子泡湯調下詒按此治癖散成臌之妙劑凡遇此等大症必乘早圖治若日久正虛便費周張矣錄此以為臨症者一隅之取暑濕挾積阻滯腸胃中州不運大腹驟滿腹中時痛痛則大便黏膩色紅似痢小水短少診脈沉而滑數是積之徵也擬大橘皮湯送下木香檳榔丸橘紅白朮赤苓澤瀉豬苓大腹皮滑石木香砂仁川樸另木香檳榔丸三錢詒按病兼滯利故須先從腸府疏導再診氣與水相搏大腹驟滿小便不利大便欲泄而不泄法以疏氣逐水香薷茴香澤瀉枳殼赤苓萊菔子甘遂大戟黑醜白醜生薑詒按此方專逐水積力量頗猛想其正氣尚旺故可放手用之頭痛門情懷鬱勃肝膽風陽上升右目昏蒙左半頭痛心𩞄不寐飢而善食內風掀旋不熄痛勢倏忽無定營液消耗慮其痙厥法以滋營養液清熄肝陽務宜暢抱庶克臻效大生地元精石阿膠天冬羚羊角石決明女貞子滁菊鉤鉤白芍再診服滋陰和陽法風陽稍熄第舌心無苔心𩞄善飢究屬營陰消爍胃虛而求助於食也議滋柔甘緩大生地石決明麥冬阿膠火麻仁女貞子洋參白芍茯神橘餅詒按此養陰柔肝之正法與前人復脈定風阿膠雞黃等法用意相合諸竅門鬱怒傷陰木火上乘竅絡耳生瘜肉名曰耳菌最屬淹纏久久不已防有血出翻花之變生地丹皮北沙參元參遠志鉤鉤羚羊角石決明刺蒺藜滁菊另用藜蘆腰黃硇砂上三味皆少許為細末點入耳中立效膽熱移腦為鼻淵肝熱移肺為鼻痔病根日久難以卒效羚羊角丹皮黑梔甘菊元參辛夷蒼耳子石決明另用雄黃月石冰片研末搐鼻詒按耳菌鼻痔均屬外症須另用專方治之先生長於外科故用藥自然絲絲入扣暑邪濕毒走入營中遍身驟發紫黑藍斑鼻血齦腐此屬發斑牙疳之險症倘至壯熱神昏不可挽矣羚羊角犀角黑梔丹皮銀花連翹鮮石斛鮮生地知母蘆根詒按此症於清營中宜稍參疏透之意少陰腎水不足陽明胃火有餘牙宣出血晡時微寒壯熱而其脈極細此素體之陰虧也當憑症論治用景岳玉女煎生地知母牛膝川連石膏麥冬薄荷蘆根詒按此症之脈細想系素稟如是若云陰虛未必脈細也總之須見症確有可據乃可舍脈從症未可冒昧以將事也痧疫門爛喉痧症來勢甚暴甫周一日丹疹密隱咽喉已腐壯熱無汗大便泄瀉煩躁渴飲脘腹按之痛邪不外達熾盛於裡燎原之勢不可向邇恐其遽爾內陷昏喘生變現在方法辛涼透散通同一律無所短長鄙見莫若且用涼膈散上者上達表者表達里者下達庶幾熱從外出而痧透火從下泄而躁安按內經病機暴注下迫皆屬於熱仲景方論急下之法正以存陰幸勿拘現患泄瀉而遂謂不可再下也雖然智愚千慮各有得失尚祈高正是荷涼膈散加牛蒡子桔梗枳實詒按既患丹痧則營絡中必有熱邪方中丹皮鮮地銀花元參等味斷不可少再診投涼膈散煩躁略安脘痛已止胸膈之燔稍衰其勢而咽喉紅腫乾咳嗆逆上炎之火未熄其威況丹痧一片點粒模糊症交三日正屬邪張之際尚在險途未歸坦境擬方再望轉機為妙犀角連翹元參川貝桔梗鮮石斛牛蒡子鮮薄荷根蘆根痧回熱減溫邪初退之餘咽喉反腐虛火又從而附之良由久患喉痹陰虛火亢熱淫搖動亢焰復張用方最宜加謹過清恐傷脾胃早滋恐戀餘邪姑擬甘涼法平調肺胃冀得上焦清肅鮮石斛大貝元參生草丹皮沙參羚羊角扁豆穭豆衣雪梨詒按看似平淡無奇實已斟酌盡善腳氣門暑雨潮濕濕從下受入於經絡兩足腿股酸楚不能屈伸起臥轉側均覺艱難此屬腳氣適值經行之際少腹窒塞小便澀痛濕熱自氣傷營故舌苔白而底絳脈形濡身微寒熱慮其有氣逆沖胸之變擬東垣防己飲加減防己薏仁萆薢秦艽獨活桑寄生牛膝木通防風歸尾延胡威靈仙澤瀉絲瓜絡詒按此濕熱注於經絡之病與載入類傷寒中之腳氣宜用雞鳴散者不同再診兩足稍能行動濕熱有流通之機仍宗前法增損兼參健步丸意防己萆薢獨活牛膝桂仲晚蠶砂木瓜當歸延胡秦艽桑枝絲瓜絡遺精門病由喪子悲憤抑鬱肝火偏盛小水淋濁漸至遺精一載有餘日無虛度今年新正加以左少腹睪丸氣上攻胸心神狂亂齦血目青皆肝火亢盛莫制也經云腎主閉藏肝司疏泄二藏皆有相火而其繫上屬於心心為君火君不制相相火妄動雖不交合精亦暗流而走泄矣治法當制肝之亢益腎之虛宗越人東實西虛瀉南補北例川連黑梔延胡赤苓沙參川楝子鮮地知母黃柏龜板芡實另當歸龍薈丸一錢開水送下詒按遺泄有專屬乎肝者此等症是也此方可引以為例再丸方川連鹽水炒一兩苦參烘二兩白朮米泔浸曬二兩牡蠣煅三兩共研末用雄豬肚一個將藥末納入肚中以線紮好以水酒各半煮爛將酒藥末共打如嫌爛加建蓮粉拌干作丸每朝服三錢詒按此劉松石豬肚丸方也加川連一味左尺極細寸關微而似數右三部俱弦滑下有遺精暗疾肛門癢而出水上則頭眩耳鳴舌苔粉白以脈合症腎陰下虧而濕熱相火下淫上混清竅為之蒙閉法當補腎之陰以清相火清金和胃分利膀胱以化濕熱大生地蛤粉炒龜板牡蠣懷山藥麥冬萆薢澤瀉赤苓丹皮知母黃柏半夏詒按病源分析極清用藥亦熨帖周到又丸方大生地砂仁陳酒拌蒸冬朮土炒黃連鹽水炒苦參天麻懷山藥丹皮鹽水炒牡蠣麥冬元米炒龜板酥炙川芎半夏芡實萆薢鹽水炒澤瀉鹽水炒赤苓黃柏鹽水炒知母鹽水炒上藥為末用建蓮粉四兩神麯四兩煮糊搗丸詒按此方用丹溪大補陰丸合封髓豬肚分清等法而成腎虛有濕熱者用之頗合或乃以苦寒疑之是未識制方之妙義也小便門先腹痛數日遂至小便不利少腹脹滿如鼓今已半月屢用通利之藥小便雖通不爽少腹脹滿益甚診脹弦緊舌苔白膩飲食少納身無寒熱大便頻泄黏膩如痰此中陽不足水濕泛溢膀胱氣化無權法當溫土以御水寒通陽以化濕濁乾薑炒黃肉桂茯苓澤瀉茅朮木香茴香詒按因舌膩便痰故知其為寒濕惟先曾腹痛則方中又宜兼通氣分擬再加牛膝烏藥再診張先生用平胃化胃中之濕濁五苓通膀胱之氣化簡淨的當無從增損愚意復入半夏一味暗合通澈陰陽之路使水濕痰涎從小便出是亦古人加減成方之心法也半夏茅朮川樸陳皮甘草茯苓豬苓肉桂澤瀉腎虛精關不固濕熱混於坎宮精從溺後而出左脈虛細右脈洪大陰虧而相火勝也補腎陰化濕熱用涼八味法涼八味湯加萆薢另威喜丸三錢淡鹽湯送下再診精濁稍止而兩足重墮無力咳嗽胸痛金水兩虧濕熱不化擬清暑益氣以化濕熱兼固腎陰洋參黃耆茯苓五味神麯麥冬蒼朮白朮陳皮前胡通草另知柏八味丸三診精濁已止腿足重墮無力舌苔白而噁心坎宮之濕熱雖清胃家之濕熱猶戀擬和中化濕法豆卷半夏茯苓陳皮麥冬沙參扁豆另資生丸四診腎虛胃濕胸悶噁心口沃清水凡大便時則精竅自滲如膩濁擬滲胃濕固腎精熟地五味蒼朮白茯苓沙苑炮姜黃柏建蓮另威喜丸詒按凡腎虛胃濕之病用藥甚難著手第一方專顧腎第二方腎胃兼顧第三方專治胃第四方兩層合治從黑地黃丸加味最有巧思淋濁日久不痛口常甜膩此腎虛而有濕熱也蒼朮四兩分作四分一分用米泔水浸透曬一分用鹽水炒一分用酒炒一分用破故紙三錢研末拌炒去故紙黃柏四兩分作四分一分鹽水炒一分生曬一分酒炒一分用益智仁末三錢拌炒去益智仁蓮蕊須馬料豆制首烏茯苓生草共研細末懷山藥粉煮糊為丸詒按腎虛而兼濕熱者用藥甚難觀此方取意極佳惟於腎虛一面尚可增入沙苑菟絲龜板之類腎開竅於二陰前有淋濁之新恙後有腸紅之舊疾皆由於陰虛而有濕熱也寓育陰於利水清熱之中豬苓湯合加味槐花散主之茯苓豬苓阿膠生地槐米枳殼六一散血餘炭側柏炭詒按兩症貫串一線用藥自然親切再診便血已止淋濁未清今當固本芡實炙草洋參麥冬黃柏生地茯苓沙苑砂仁蓮肉懷山藥另八仙長壽丸每服三錢開水送下小便頻數溺後有血絲血塊此膀胱有熱腎虛有火逼衝任之血而下走前陰也法當通澀兼行生地炭阿膠蒲黃炒川連龜板赤苓黃柏鹽水炒大黃醋炒成炭血餘車前子藕另血餘炭二錢血珀一錢研末分兩服雞子清調下再診血止小便頻數氣墜擬補陰升陽法生地牡蠣茯苓龜板懷藥丹皮杜仲黨參建蓮鹿角霜詒按兩方用藥極為周到所嫌者平實而已淋濁三年不止腎虛濕熱不化陰頭碎癢筋骨微疼六味補腎能化濕熱耐心久服莫計效遲大生地懷藥茯苓萸肉丹皮澤瀉五味麥冬益智仁湘蓮肉詒按六味能化濕熱其理頗精擬再加黃柏牡蠣又按此症陰頭碎癢筋骨微疼疑有瘡毒內戀而然雜藥亂投諸病不除中氣早戕故腹中不和大便不暢至於本病精濁淆混亦脾虛濕熱所致萆薢益智仁半夏陳皮黨參黃柏烏藥石菖蒲菟絲子詒按精濁淆混四字將病情包括無遺用藥亦清靈不滯痢疾門從來肺有積熱者大腸必燥以相為表裡故也三五年來屢發喉症肺熱可知今秋齦腫出血多服涼藥及西瓜等物遂患下痢赤白常有干糞夾雜其中延及百日近見堅慄而痢反更甚此必有故夫脾受瓜果之寒濕既下流於大腸而為痢則大腸之燥當除今獨不然竟若燥與濕各樹旗幟相為犄角之勢豈非以脾屬中土而主濕大腸屬燥金而主津津虧而燥益堅脾虛則濕愈甚耶昔秦氏論痢有濕火傷氣燥火傷血之分此則濕燥兩傷擬撰一方潤燥兼行氣血兼理或通或塞均非所宜全栝蔞六錢當歸一錢五分木香五分川連酒炒五分甘草四分升麻三分藕一兩陳火腿足骨炙灰一錢詒按論病切實不浮方亦穩適微嫌氣分藥尚少恐機關不能靈動耳伏暑濕熱之邪挾積內蘊胸痞嘔惡發熱舌燥通府之後變為下痢痢色紅白膩凍仍然痞塞嘔惡飲食不納勢成禁口重症須得胃開納穀痢減不嘔為妙閱諸高明方層次轉折各有主意姑擬一方商正川連酒炒五分黃芩酒炒八分白芍炒錢半青皮八分川樸五分陳皮鹽水炒八分神麯三錢茯苓三錢北沙參四錢砂仁八分生熟穀芽各二錢玫瑰花二朵原注此病嫌其兩脈虛濡脾胃元氣大弱似乎宜參入扶正為善然下痢一症古稱滯下起於濕熱居多早補早斂往往受累此河間苦辛宣通府滯之法所以為痢門必採之方若夫深刻工夫補陰補陽治脾治腎都為久痢而設尚非此時議論所以寧落輕淺不用深重之劑蓋行遠自邇之意云爾詒按閱是方者有病重藥輕之疑故方後申言其意奔走遠行傷飢飲酒脾胃受病病成休息下痢痢經兩載不愈許學士香茸丸最妙但嫌其價昂且藥肆無此現成丸料今姑師其意而變湯服木香丁香杜仲當歸白芍炮姜茯苓砂仁鹿角霜菟絲餅詒按此脾腎兩治而專重於腎者查原方皆用鹿茸沉香麝香無用丁香者煎劑中宜改用沉香為穩脈經云代則氣衰細則氣少多指陽氣而言今下痢而得是脈脾腎之陽微特著況形衰畏冷而小便清長乎惟下痢赤者屬血分腹中痛者為有積立方當從此設想蓋尋其罅而通之補之亦治病之巧機也附子枳實理中湯送下駐車丸詒按看病於虛中求實極其精審方亦的當便痢白膩如水晶魚腦色小便不利少腹偏右板窒諸醫以為腸癰固亦近是然考腸癰為病有寒有熱金匱並出二方如大黃牡丹湯薏仁附子敗醬散概可見矣此症則屬寒積試觀脈弦緊而不數面色青而不渴是其徵也鄙意宜用溫通備候商訂肉桂五苓散加砂仁楂肉再診溫通已效仍從前法原方加泡姜木香三診欲溺不爽溺後氣向下墮便痢白膩雖稀然腰尻痠痛如折全屬陽虛氣陷之象仿東垣意參入前法黨參升麻肉桂茯苓澤瀉冬朮泡姜木香訶子煨砂仁鹿角原注此症並非腸癰乃寒積下痢耳因諸醫皆云餘隻得委曲周旋但從腸癰為病有寒有熱輕輕轉筆折入溫通方法既不礙諸醫又與病相合不得不然之事也此方連服三劑大便白膩全無脾胃已起詒按認症已確用藥自然針芥相投休息下痢延及半載色紅而黏脈弦是風邪久羈於腸藏營分之中而莫能出近日畏風身熱是又感新風於外也補中升陽兼涼血為法黨參白朮防風蠶砂茯苓升麻神麯砂仁陳皮炙草椿根皮炭另駐車丸詒按方中於新感一層未曾顧到腸中有風邪惟蠶砂能治之煎方中宜加黃耆陽樞之瘧邪轉入陰樞為痢痢色紅而後重氣墮肛門覺熱是下焦廣腸有熱也白頭翁法甚當然今瘧止又來仍從陰樞達出陽樞立法佐以和中使以泄熱四逆散異功散黃芩湯加生熟穀芽詒按推論病機轉折極清立方自然熨帖痢而滑脫症已險逆溫固藏真一定成法然須得效庶可回春熟地杞子龍骨茯苓萸肉蓯蓉杜仲烏梅炙草山藥鹿角膠赤石脂炒龜板禹餘糧炒穀芽煎湯代水詒按用藥極其切當惟病象已深未識能挽回否紅痢三年腹中結塊板硬不移按之則痛漉漉有聲即便下利此瘀凝寒積久留於腸府當以溫通下之川附當歸蒼朮炭枳實炭地榆炭茯苓通草桃仁炒黑大黃詒按溫通瘀積方極穩當惟病久正傷或再加扶正之品更為周到瘧邪挾積內陷為痢痢下紅膩腹中陣痛舌苔黃掯瘧勢仍來形容大削元氣內虧慮有變端治之不易神麯川樸茯苓秦皮川連黃芩白頭翁柴胡白芍枳實炙草詒按此白頭翁湯合四逆散是由瘧轉痢濕熱挾積之的方紅痢匝月仍然腹痛後重據云先曾發瘧三次此屬中虛表邪傳裡現今脈細肢寒中焦陽氣已弱小便艱難膀胱氣化又鈍擬連理兼化其濕熱柴苓以解其表邪是亦表裡兩解之法也柴胡桂枝茯苓澤瀉川連木香黨參白朮炮姜炙草砂仁詒按論病立方均熨帖老到此理中湯加香連五苓散加柴胡肝胃不和濕熱積滯為痢延及半載仍然腹痛脘脹噁心治以苦辛泄肝和胃佐以分消運化川連茯苓川樸木香楂肉陳皮青皮赤苓白芍砂仁另駐車丸二錢烏梅丸一錢和服再診痢減腹中猶痛肝胃不和也現值經來脈弦寒熱血虛木鬱擬以養血疏肝歸身白芍香附茯苓冬朮木香陳皮神曲川芎生熟砂仁另駐車丸一錢烏梅丸一錢歸脾丸一錢和服詒按前後兩方均親切不浮此方中可加醋炙柴胡五分醋炒青皮一錢便血門痔血雖自大腸來亦屬脾虛濕熱至於大瘧古云邪伏三陰薛立齋云三陰者脾也上年瘧止直至今夜復作未免又有暑邪內伏近日痔血相兼為患擬用清暑益氣湯加味內化濕熱外解新邪總以益氣扶中為主俾中樞一運自然內外分消矣黨參炙草黃耆蒼朮冬朮當歸麥冬五味青皮陳皮神麯黃柏葛根升麻澤瀉防風蜀漆赤苓煨姜大棗詒按宿病兼新邪而發須先治新感仍照顧宿病乃能得手此方是也經云三陰瘧疾此三陰專指太陰脾藏言與統指肝脾腎三藏者不同再診素有便血之症而患大瘧日久凡患大瘧其始必有寒邪邪入三陰大瘧成焉若陰虛之人寒久必化為熱熱陷三陰便血作焉而三陽之寒仍在也溫三陽之陽以少陽為始清三陰之熱以少陰為主然血既由大腸而出又當兼清大腸方用棉子肉內具生氣溫少陽之陽也鮮首烏性兼潤血清少陰之熱也柿餅灰性涼而澀清大腸之血也標本並治雖不中不遠矣棉子肉炒黑四兩柿餅灰四兩二味研末用鮮首烏二斤搗自然汁取汁去渣以汁調神麯一兩煮爛將上藥末搗丸每服三錢棗湯下詒按凡久病氣偏尋常湯藥性味牽制不能奏續必用性味專簡之方乃能見效此方即用此意脾虛不能攝血便後見紅脾虛不能化濕腹臌足腫病根日久腎陰亦傷腎司二便故小便不利是皆脾腎二經之病也法以溫攝雙調熟地炮姜茯苓澤瀉陳皮車前子川樸茅朮五味丹皮山藥阿膠詒按凡脾腎兩傷者當斟酌於潤燥之間用藥極難古方惟黑地黃丸最佳方亦從此化出再診熟地茅朮炭白頭翁黃柏鹽水炒炮薑炭阿膠五味秦皮三診山藥川連酒炒澤瀉車前子茯苓川樸陳皮鹽水炒伏龍肝煎湯代水炒黑腎氣丸合黑地黃丸加阿膠虎骨鹿角霜益智仁原注第一方用黑地黃丸加阿膠治脾腎兩虛兼以攝其陰血第二方用白頭翁湯清厥陰之熱以止血第三方暗用平胃散以化濕治其腹鳴外合車前子澤瀉山藥乃用六味地黃意補其腎以利膀胱而通水道也又再加伏龍肝乃暗合黃土湯意治少陰便血層層回顧如此便血腸燥脈大氣虛補氣則清陽自升清陽則便血自止黃耆炒黑防風根阿膠地榆炭當歸炭五味荷蒂炭另金銀花炒黑一兩柿餅灰一兩槐米炒一兩豬膽汁泛丸每朝服一錢詒按立方用藥頗有思路可取丸方尤佳腸胃有濕熱濕鬱生痰熱鬱生火大便下血晨起吐痰熱處濕中濕在上而熱在下治上宜化痰理濕治下宜清熱退火用二陳合三黃為法半夏陳皮茯苓川連黃芩杏仁胡黃連地榆皮側柏葉百草霜詒按兩面周到於此可得上下合治之法腸痔脫肛便血其根已久有時舉發而脈象細數營陰大傷面黃少神脾氣大困兼之腹中鳴響脾陽且不運矣一切苦寒止血之藥非惟少效抑恐礙脾擬東垣黑地黃丸法熟地砂仁拌炒炭一兩炮姜四分黃耆炙三錢茅朮米泔浸炒一錢五分五味炒一錢五分黨參三錢荷葉蒂兩個又原方加阿膠伏龍肝詒按方極正當凡陰虛而脾陽困頓者當取以為法蟲病門閱病源是屬蟲病無疑蟲由脾土不運濕熱蒸化而生其發於月底之夜乃由脾胃虛寒寒屬陰故夜發也寒久化熱土虛木強其發移於月初必嘔吐胸熱乳下跳動蟲隨酸苦痰涎而出多寡不一時或見於大便腹中微痛雖渴甚不能咽水水下復嘔嘔盡乃平至中旬則康泰無恙矣所以然者月初蟲頭向上且病久多嘔胃陰虧而虛火上炎故胸中覺熱也虛里跳動中氣虛也中氣者乃胸中大氣脾胃沖和之氣皆歸所統今中氣虛甚故跳躍也病延一載蟲屬盤踞未易一掃而除圖治之法和中調脾以杜生蟲之源生津平肝以治胸熱口渴化濕熱降逆氣以治嘔吐久服勿懈自可見功欲求速效恐不能耳川楝子蕪荑黨參元米炒白朮使君子肉半夏陳皮青皮白芍茯苓焦六曲乾薑榧子蔻仁詒按論病頗切實惟立方專於顧本似難取效擬另服殺蟲丸藥以佐之喜食生米積聚生蟲腹痛面黃口流涎沫蟲之見症無疑先擬健脾化蟲茅朮米泔水浸青皮鶴蝨榧子炒打蕪荑檳榔陳米炒黃詒按此治蟲病初起最輕之方痛時口流清水是蟲病的據內癰門熱在中焦部分時吐紅痰帶臭不甚咳嗽病在於胃有留熱伏於中宮法當清泄犀角射干桃仁當歸薏仁冬瓜子連翹銀花川貝大黃元明粉再診不咳嗽但吐紅痰如膿自覺灼熱在於胃脘之中將及三月非肺癰也乃瘀熱留於胃中也當以清化當歸薏仁冬瓜子沙參連翹川貝石斛銀花赤小豆蘆根三診吐痰如膿已止脘中之熱已退時覺微寒微熱餘火未清仍從前法加減黨參當歸薏仁杏仁沙參冬瓜子丹皮黃芩甘草茅根蘆根赤小豆詒按此病得力在第一方故知其非肺癰然紅痰如膿而臭究與脘癰無異作胃脘癰治當不致誤暑邪挾積阻滯腸胃脘腹疼痛大便泄出如膿如血症屬盤腸流注非輕症也川連木香檳榔當歸查肉神麯黃芩枳殼赤芍砂仁詒按膿血痢而名流注說頗新奇閱方仍是治痢之藥憶蔣問齋醫略中論痢疾一症謂是腸中作膿當用外瘍治法與此案正相合也外瘍門多年濕毒左足前臁腐爛今則膝骨臀股上及缺盆疼痛而木腫此濕得熱而蔓延循經竄絡病在陽明名濕毒流注口苦帶膩脈緩而小濕勝於熱熱伏濕中仿防己飲法防己蒼朮黃柏南星制木通威靈仙防風歸身獨活紅花萆薢羚羊角滑石詒按此治外瘍正法是瘍症之偏於陽者再診前用防己法宣通關節以化濕熱膝股之痛稍緩惟缺盆處咳嗽引痛不平擬參以清肺化痰前方去羚羊角防風木香紅花加薏仁杏仁川貝沙參周身碎癢而痛似疥瘰狀心中煩熱膚上出膿水症屬肺風馬勃象貝荊芥黃芩杭菊蒺藜炒詒按此濕熱走於血分之病當兼疏血絡擬加歸鬚丹皮赤芍忍冬藤浮萍細生地寒痰凝阻頰車不利高而腫硬色白不紅此屬陰寒骨𩞄與色紅身熱者不同熟地麻黃桂枝防風制蠶白芥子當歸秦艽詒按此病挾肝火者十之八九此獨不然於此可悟辨症之不可膠執也濕久蘊於下焦氣血凝滯而結瘍生於合纂之旁滋蔓肛臀之際初起數日即潰火甚毒甚可知潰後爛孔極深迄今四五十日新肉雖生而嫩肛臀余腫仍僵久臥床褥脾胃之轉輸自鈍刻當痛楚形容之色澤尤枯調治方法自宜補益高明見解大略相同愚意虛處固虛而實處仍實擬用煎丸二方各走一經虛實兼顧六君子湯去半夏茯苓加黃耆歸身白芍穀芽又丸方川連酒炒一錢胡連酒炒一錢苦參炒一錢黃柏一錢當歸三錢乳香一錢沒藥一錢白芷一錢犀黃二分血珀四分白礬三錢刺蝟皮炙一錢象牙屑三錢海螵蛸三錢共為末用黃占烊化作丸每朝服五分原注凡極苦之藥直入下焦堅陰而化濕熱用蝟皮牙屑之專消漏管者引入患處更用黃占以澀之固之俾上中不受苦寒之藥氣俾入下焦其性始達詒按丸方用意極精濕熱結疝初起腎囊紅腫漸至氣上攻脅脅肋腫痛已及半月防成肋癰病在肝絡肝性善升甚則恐致氣升發厥非輕症也川楝子延胡青皮香附查炭枳殼旋覆花桃仁赤苓猩絳蔥管詒按方治疝氣而肋癰即在其中內病處瘍一以貫之也木鬱不達乳房結核堅硬胸脅氣撐腰脊疼痛氣血兩虧鬱結不解論其內症即屬郁勞論其外症便是乳岩皆為難治黨參香附川貝當歸白芍青皮橘核狗脊杜仲砂仁詒按論病簡潔老當乳房結核堅硬雖皮色不紅而推之鬆動此非乳痰仍屬乳癰肝鬱所致身微寒熱防滋蔓難治柴胡鹽水炒當歸白芍黑梔川貝香附栝蔞皮另金針菜炙脆三錢皂莢子炙三錢射干炙三錢研末分三服飲酒者酒下否則砂仁湯亦可詒按煎方用逍遙散亦通套方也好在有末藥以佐之再診乳癰已潰寒熱亦止第余塊未化惟和其氣血調其鬱結而已當歸白芍香附川貝遠志砂仁丹參肝鬱結成乳痰延及旬月堅中帶軟頂色轉紅勢將穿潰潰後見膿乃吉若血多膿少非所宜也川楝子當歸青皮白芍橘紅川貝香附茯苓砂仁再診乳痰穿破有血無膿乃氣虛不能引血化腐為膿也防變乳岩不易收功黨參歸身白芍茯神棗仁川貝香附陳皮牡蠣砂仁甘草橘葉詒按此等郁痰症須正氣不虧更能曠懷自遣乃可醫治二者缺一不可治也又單方川貝三錢橘紅五錢萊菔子炒三錢蓮蓬皮另炙灰五錢痰癧二載自頸延脅或已潰或未潰或潰而不斂或他處續生累累然如貫珠如疊石潰後色黑而膿稀外軟而內堅診脈不甚虛飲食尚可細詢病由氣鬱而起鬱則肝膽三焦之火循經上走於絡結成癧核小則為癧大則為痰收功非易必放開胸襟曠觀物理乃佳夏枯草五錢昆布三錢山茨菇三錢遠志甘草湯煮三錢元參二錢川貝二錢歸身二錢天葵草三錢香附一錢五分功勞葉二錢詒按此病亦與失營症相類幸脈實能納故用藥專從痰火著想翻花腎岩法在難治怡情安養庶幾可圖然非易事也鮮首烏一兩馬料豆一兩銀花一兩甘草梢一兩煎濃服西黃一分川連五分血珀五分藥珠三分燈心灰五分大貝二錢人中黃一錢研末分十服每朝一服詒按此腎虛而兼瘡毒之變症也先天元氣不足胎中伏毒因虛竄絡頸項結核或已潰或未潰或潰而不斂兼以耳聾鼻塞腦門遇陰雨則脹痛咳嗆牙關不利皆陰虛陽亢毒邪上蒙清竅之見端也若徒治其虛伏毒何能宣化擬養陰化毒北沙參三錢花粉三錢當歸三錢海螵蛸三錢仙遺糧三錢川貝二錢防風一錢五分銀花三錢穭豆衣三錢珠粉一分血珀五釐西黃五釐詒按鼻塞腦痛皆餘毒內戀之象擬再用化毒丹佐之廣風自頭而起漸延遍體濕熱穢毒之邪從鼻而受為日既久未易掃除擬用金蟾脫甲酒意金銀花三兩蟾蜍去腸一隻苦參三兩大黃一兩皂莢子十粒川芎一兩白蘚皮二兩一本有蛇蛻一兩甲片二兩用陳酒五斤浸七日每日飲杯許詒按此與前條之症皆系餘毒所致肝經鬱火乘犯陽明牙齦癢痛出血而發牙疳舌紅碎裂頭眩心煩是營陰內虧而納穀氣撐又屬脾氣虛也猶喜大便燥結可用清滋法先平其炎上之火羚羊角鮮生地鮮石斛元參麥冬石決明女貞子茯苓棗仁詒按立方專於養陰熄肝愚意再加廣皮雞內金以健運脾氣似更周到陰虧火亢繞頸生痰寒熱似瘧而實非瘧也少陰水虧不能涵木少陽火亢更來爍金金木交戰乃生寒熱飲食少脾胃弱慮延勞損六味地黃湯加牡蠣黨參麥冬柴胡白芍五味詒按方以六味滋腎生脈保肺合柴芍以清肝立方周到熨帖愚意擬去溫肝之萸肉再加清膽之菇芩牙齦滲膿二載不愈此屬牙漏腎虛而胃有濕熱所致六味丸三錢資生丸二錢相和每朝四錢淡鹽湯送下詒按六味補腎固佳資生清濕熱似嫌力量不到本原不足兼挾風溫發熱頸間結核成痰二十餘日不紅不腫不消散亦不作膿屬半虛半實慎柔方有良法用四君子加牛蒡世所未知余曾驗過四君子湯加牛蒡子象貝桑葉詒按四君補虛加蒡貝以消風化痰桑葉以清肺通絡虛實兼顧絕不犯手再診昨用慎柔方是托散法服下若汗出熱退則數劑可消若汗不出仍發熱則數劑成膿亦易潰斂前方加鉤鉤三診三歲孩童但哺乳汁不進穀食脾胃虛弱可知頸結痰核而有寒熱必挾風溫屬半虛半實今將一月熱退復熱其塊不消不作膿大便溏脾胃不足氣血兩虛黨參冬朮陳皮荊芥黃耆歸身防風葛根砂仁桑葉詒按因慎柔方不效轉擬此方其實遠不及前方之靈動也瘍漏久而成管用消管丸緩緩治之胡黃連一兩刺蝟皮一兩炙象牙屑一兩五倍一兩炙蟾酥酒化三錢陳硬明角燈二兩炙上藥為末煉蜜丸用上好雄精三錢泛上為衣每朝服三錢金銀花湯送下詒按方意極佳惟蟾酥大毒走竄之品擬減半用之婦人門目之烏珠屬肝瞳神屬腎病因經行後腰痛口乾烏珠起白翳怕日羞明瞳神散大此肝腎之陰不足而相火上炎也補陰之藥極是再稍參清泄相火之品女貞子旱蓮草生地杞子黃柏三分煎汁炒潼沙苑穀精草丹皮元參桑椹子黑芝麻另磁朱丸再診血虛則木旺木旺則脾衰脾衰則痰濕不化肝旺則氣火易升是以腹中時痛臍右有塊目中乾澀口常甜膩舌苔白而經水不調也治法不宜制肝制則耗其氣但當養陰以和肝不可燥濕燥則劫其陰只宜和脾以運氣此仲景治肝補脾之要法也黨參當歸白芍茯苓冬朮半夏陳皮丹皮香附橘葉三診脈輕按虛微是為元氣之虛重按細數是屬營陰之損左尺細弱腎水虧也歷診病情每遇經來其熱輒甚舌止即布白苔良以胃中濕濁因裡熱熏蒸而上泛也少腹有塊攻痛聚散無常是名為瘕瘕屬無形之氣隸乎肝腎為多揆其致病之由因目疾過服苦寒戕伐生生之氣胃受寒則陽氣鬱而生濕肝受寒則陰氣凝而結瘕陽氣鬱於胸中故內熱陰氣凝於下焦故腹痛經事過則血去而陰虛故其熱甚甚則蒸濕上泛故舌苔濁厚也刻下將交夏令火旺水衰火旺則元氣耗而不支水衰則營陰涸而失守惟恐增劇耳圖治之法補脾胃以振元氣培肝腎以養營陰是治其本也稍佐辛溫宣通下焦陰氣是兼治其瘕痛之標也黨參黃耆冬朮茯苓炙草歸身酒炒萸肉酒炒首烏木香白芍吳萸三分煎汁炒馬料豆生熟穀芽詒按三案論病則委曲周至用藥則細膩熨帖看似平淡無奇實則苦心斟酌以出之誠以調理內傷久病與治外感時邪不同病久正虛者病機必多錯雜礙手之處用藥必非一二劑所能奏效故立方必須四面照顧通盤打算不求幸功先求無弊此等功夫非老手不能擅場崩後不時寒熱腹中有塊口發牙疳營虛有火氣虛有滯調之補之黨參陳皮當歸白芍丹皮茯苓麥冬元參黑梔女貞子建蓮肉再診血虛木橫兩脅氣撐脹痛腹中有塊心蕩而寒熱病根日久損及奇經經云衝脈為病逆氣裡急任脈為病男疝女瘕陽維為病苦寒熱陰維為病苦心痛合而參之謂非奇經之病乎調之不易黨參黃耆當歸白芍沙苑茯神杞子香附陳皮白薇紫石英詒按擬再加牛膝青皮沉香三診和營衛而調攝奇經病勢皆減惟腹中之塊未平仍從前法加減前方去杞子加砂仁冬朮詒按古無專屬奇經之病亦無專入奇經之藥考內經八脈行度及前賢議論均謂十二經氣血有餘則溢入奇經有病者亦必日久病深由正經而侵入之然則用藥治病自當仍以正經為主學者須明此意勿為近賢議論所蒙也內熱日久經停兩月投養陰調血通經之劑得熱減經行可謂效矣然猶未也脈數不和舌仍光赤乃陰津未充虛陽未斂也仍宜小心安養為善生地當歸白芍丹皮阿膠香附黨參茯苓陳皮地骨皮詒按平正妥帖再診脈數已和舌色光紅已退但有時尚覺微熱仍以前法增損前方去丹皮阿膠加麥冬狗脊經事不來足腫腹滿臍下偏左有塊上攻作痛此瘀凝氣滯病屬血分慮延成臌三稜醋炒莪朮香附當歸神麯查肉延胡砂仁另大黃䗪蟲丸每服五粒日三次詒按此氣血兩疏之法用藥切實不浮好在丸藥緩攻不嫌其峻再診經停腹滿形瘦色黃氣血瘀凝防其成臌香附延胡枳殼茯苓蘇梗川樸大腹皮冬瓜皮另大黃䗪蟲丸憂愁抑鬱耗損心脾之營而肝木僭逆胸中氣塞內熱夜甚經事兩月不來脈沉而數熱伏營血之中擬用柴胡四物湯和營血以舒木鬱黨參冬朮生地當歸白芍香附青蒿白薇生熟穀芽詒按此等症調治失當最易入於損途擬再加丹皮丹參經後少腹痛連腰股肛門氣墜大便不通小便赤澀擬泄肝經之鬱熱通絡脈之凝澀金鈴子延胡郁李仁歸尾黑梔柴胡龍膽草大黃酒炒旋覆花猩絳青蔥管詒按病情於小便上得之經行後少腹作痛上及胸脘腰脅內熱口乾大便不通小便熱痛此肝氣挾瘀所致川楝子延胡桃仁香附山梔薑汁炒澤蘭川連吳萸炒丹皮另當歸龍薈丸三錢淡鹽湯送下詒按病情與前條相似方亦近之惟當歸龍薈丸用得太重宜減半服之年將五十經事頻來且多是衝脈不司收攝故也防其崩決補之攝之黨參黃耆當歸於術棗仁陳皮茯神阿膠荷葉蒂藕詒按此方從歸脾增減補則有之攝則未也擬加牡蠣龜板茜草炭烏賊骨以佐之病起當年產後雖經調理而痊究竟營虛未復是以至今不育且經事乖而且多亦營虛而氣不固攝之故自上年九秋又感寒邪入於肺為咳嗽痰中帶血此謂上實下虛血隨氣逆蔓延旬日加以內熱漸成勞損姑仿仲景法扶正化邪以為下虛上實之法生地黨參炙草當歸豆卷前胡茯苓懷藥麥冬阿膠川貝杏仁桂枝枇杷葉詒按趨步古人非胸羅經訓者不能時下隨症敷衍烏能望其項背再診進薯蕷丸法補氣血生津液徹風邪咳嗽已減所謂上實下虛病情不謬據云當年產後腹中常痛至今未愈顯見營分有寒已非一日但內熱淹纏心悸頭眩久虛不復終為勞損茲從八珍加減復入通補奇經王道無近功耐心安養為是十全去耆芎加阿膠艾炮姜紫石英陳皮麥冬款冬花川貝神麯大棗三診溫補奇經病情俱減今仍前制十全去耆芎草加阿膠香附炮姜陳皮吳萸兩次血崩之後赤帶連綿不斷迄今半載有餘脈象虛微氣血大虧是以頭眩心跳腰痠足軟等症均見也近日腹痛食減恐其復致崩決擬方固攝奇經女貞子烏賊骨茜草炭旱蓮草黨參茯苓白芍丹皮阿膠蓮肉荷葉蒂藕節另震靈丹二錢再診固攝奇經病情不減崩漏不止腹痛不已用升陽固陰法鹿角霜沙苑龍骨牡蠣懷藥杜仲女貞子杞子茯苓棕炭詒按固攝不效進用升澀此用藥轉換一定層次痛而經來肝木橫也經事參前血分熱也色黑有瘀和而化之可也川楝子延胡丹皮當歸白芍澤蘭香附醋炒木香茯苓查炭砂仁詒按立方平善再診經來色黑而痛當與化瘀生地桃仁炒黑紅花澤蘭黑梔香附醋炒當歸川芎醋炙大黃炭養血以調經理氣以止痛補肝之虛以平眩暈助脾之運以除惡心熟地六兩分三分一分砂仁拌炒鬆一分薑汁炒焦一分陳酒煮爛當歸三兩分三分一分吳萸一錢煎汁炒一分茴香一錢煎汁炒一分酒炒白芍二兩分二分一分肉桂一錢煎汁炒一分炙草三錢煎汁炒香附四兩分四分一分黑梔三錢煎汁炒一分鹽水炒一分醋炒一分酒炒川芎酒炒一兩沙苑鹽水炒三兩茯苓三兩焙陳皮鹽水炒五錢黨參炒三兩丹參酒浸曬乾再浸再曬如此七次焙研三兩詒按此方製法精巧養血理氣兩擅其長木香砂仁亦可酌增咳嗽發熱日久前投補益脾胃之藥六七劑食谷加增起居略健但熱勢每交寅卯而盛乃少陽旺時也少陽屬膽與肝相為表裡肝膽有鬱熱戕伐生生之氣肺金失其清肅脾胃失其轉輸相火日益熾陰津日益涸燎原之勢不至涸極不止也其脈弦數者肝膽鬱熱之候也刻下初交夏令趁其胃旺加餐擬進酸苦法益陰和陽清澈肝膽之鬱熱考古方柴前連梅煎頗有深意錄出備正柴胡豬膽汁浸炒五分川連鹽水炒五分白芍一錢前胡一錢烏梅五分麥冬二錢黨參三錢秋石三分炙草四分薤白五分原注此方服後熱勢竟退此時已經停兩月以後或熱或止喜其能食至四五月後方知其有孕詒按此等症最易認作虛損得此議論大開後人眼目又按此必有微邪伏於肝膽之間挾木火而發煎熬津液日就乾涸古人所謂營風者曹仁伯謂即是此症寒氣客於下焦瘀凝停於少腹阻塞胞門膀胱陽氣失化以致癃閉產後八日而小便不通脈細肢寒腹中覺冷恐其氣逆上攻發厥法以溫通下焦化瘀利水冀其應手為妙當歸八錢川芎四錢查炭五錢炮姜五分桃仁三錢車前五錢益母草湯同陳酒各一碗代水煎藥另肉桂五分血珀五分甘遂三分共研末藥汁調服詒按末藥方甚佳煎方中擬加澤蘭牛膝吳萸此症甚急用藥能絲絲入扣迥異膚浮家數再診小水癃閉已通瘀凝未下少腹仍然板滿再以溫通泄濁肉桂延胡紅花桃仁丹參兩頭尖歸尾查炭牛膝炮姜冬葵子車前前年小產惡露數日即止因而腹痛結塊心神妄亂言語如顛此所謂血風病也胞絡下連血海上繫心胞血凝動火火熾生風故見諸症診脈弦搏肝陽有上亢之象防加吐血治法當以化瘀為先稍佐清火可也丹參延胡五靈脂川連川貝赤苓蒲黃黑梔茺蔚子香附另回生丹一粒詒按疏症病原切實指點與膚浮影曏者不同產後腹痛年餘營虛木鬱脾胃受戕時作惡心時沃酸水用千金當歸建中湯當歸白芍吳萸炒炙草炮姜肉桂川椒南棗橘餅詒按用藥切當無支湊幫貼之病自是老手再診前投建中法腹痛已止復因經行之後勞碌受寒腹中又痛加以晡熱飲食減少舌苔乾白此屬血虛肝鬱脾虛木橫用歸脾法加減黨參黃耆茯苓陳皮冬朮歸身炮姜木香砂仁白芍吳萸炒橘餅產後瘀凝未淨新血不生身熱日久少腹疼痛小溲淋漓帶下血筋此肝經鬱熱兼挾凝瘀為患殊非小羌姑擬泄肝和營化瘀為法鮮生地薑汁拌炒焦一兩生薑渣鮮地汁拌炒黃三錢黑梔延胡金鈴子龍膽草丹參赤苓歸鬚猩絳甘草梢青蔥管詒按恰合病機惟少腹痛者於化瘀一層尚須著意擬加西珀烏藥紅花經事來多去少似崩非崩是血虛有熱也所謂天暑地熱則經血沸溢用白薇湯加阿膠主之女貞子白薇阿膠米粉炒黃芩醋炒炭歸身炭沙苑鹽水炒黃柏白芍旱蓮草蓮心詒按立方精到熨帖經停少腹痛小溲淋漓有血縷此肝火與凝瘀交阻當導而通之龍膽草小薊炭桃仁大黃酒炒山梔冬葵子延胡車前子丹皮海金沙詒按立方切實經行後奔走急路冷粥療飢少腹疼痛連腰脅兼及前陰此肝腎受傷又被寒侵而熱鬱也經云遠行則陽氣內伐熱舍於腎冷粥入胃則熱鬱不得伸故痛也遵寒熱錯雜例兼腹痛治法川連酒炒炮姜桂枝白芍吳萸三分煎汁炒全當歸木通香附查炭黑梔旋覆花猩絳詒按推究病原親切不膚內經有石瘕石水之症多屬陽氣不布水道阻塞之症少腹有塊堅硬者為石瘕水氣上攻而腹滿者為石水此症初起小便不利今反小便不禁而腹漸脹滿是石水之象考古石水治法不越通陽利水淺則治膀胱深則治腎久則治脾茲擬一方備採四苓散去豬苓加大腹皮陳皮桑白皮川樸烏藥桂枝雞內金另朝服腎氣丸二錢詒按煎方治膀胱丸方治腎方中桂枝擬改用肉桂體氣素虧頻年屢患咳嗽今春產後悲傷咳嗽復作背寒內熱氣逆痰多脈虛數大便溏延今百日病成蓐勞按產後血舍空虛八脈之氣先傷於下加以悲衰傷肺咳嗽劇發震動衝脈之氣上逆經云衝脈為病逆氣裡急陽維為病苦寒熱頻進疏風清熱脾胃再傷以致腹痛便溏食減無味斯皆見咳治咳之弊越人謂上損及脾下損及胃俱屬難治姑擬通補奇經鎮攝衝脈復入扶脾理肺未能免俗聊復爾爾熟地砂仁炒炭當歸小茴香三分拌炒白芍桂枝三分拌炒紫石英牛膝鹽水炒茯苓川貝詒按用熟地歸茴牛膝紫石英溫攝衝任用歸芍以調陽維用藥頗為親切擬再加胡桃人參山藥沙苑牡蠣心胸覺冷經事數月一來食入則腹中脹痛寒痰氣鬱凝滯不通當以辛溫宣暢遵熟料五積意半夏桂枝茯苓蒼朮白芍川樸川芎歸身丹參炙草陳皮枳殼高良薑再診苦辛溫通之劑而能調經散痞用之果效益信古人言不妄發法不虛立在用者何如耳前方去良薑加茺蔚子砂仁乳房屬胃乳汁血之所化無孩子而乳房膨脹亦下乳汁此非血之有餘乃不循其道以下歸衝脈而為月水反隨肝氣上入乳房變為乳汁事出反常非細故矣夫血猶水也氣猶風也血隨氣行如水為風激而作波瀾也然則順其氣清其火熄其風而使之下行如風回波轉可也正何必參堵截之法澀其源而止其流哉噫可為知者道難與俗人言也元精石赤石脂紫石英寒水石牡蠣大生地白芍歸身茯神烏藥麥芽郁李仁詒按此等議論全是精心結撰毫無依傍非胸有積理者不能道於乳汁變化之道確鑿指出非見理精到者不能方擬去石脂郁李加丹參丹皮牛膝小兒門幼稚伏邪挾積阻滯腸胃蒸痰化熱肺氣窒痹是以先瀉而後咳更繼之以發熱也今者便泄已止而氣急痰嘶肺氣阻痹尤甚法當先治其肺蓋恐肺脹則生驚發搐其變端莫測耳葶藶子三錢萊菔子三錢六一散三錢枇杷葉三片再診痰嘶氣喘平其大半熱勢起伏退而復作時下多瘧須防轉瘧白蘿蔔汁一杯鮮薄荷汁半杯二味煎濃去上沫加入冰糖三錢烊化薑汁一滴沖服詒按兩方用藥俱清簡可法於小兒尤宜先痢而後瘧已經兩載面黃內熱腹滿足腫脾氣大虛舌紅形瘦陰液大傷童勞症也黨參茯苓於術陳皮黃耆澤瀉川連神麯防風根再診瘧痢三年脾胃元氣大傷脈數舌紅腹滿足腫小泄短少前投升陽益胃熱勢略減今擬補益脾陰兼以化濁然童稚陰虧病延日久夏令防其增劇黨參懷藥冬朮麥冬五味白芍陳皮茯苓砂仁雞內金詒按小兒虛症自以後天脾胃為主然脈數舌紅陰液亦損亦當稍參養陰之意先天不足三陰虧損筋絡空虛兩足蜷攣身熱骨瘦童勞痼疾難治生地當歸牛膝川斷狗脊苡米鱉甲羚羊角桑枝詒按用薏米桑枝於補劑中稍參風濕治法斷乳太早元氣薄弱咳嗽發熱已逾四月形瘦骨立疳勞重症唇紅而善食腸胃有疳蟲也川貝杏仁茯苓百部川連黨參地骨皮陳皮蕪荑款冬花桑白皮詒按此方專以殺蟲為主愚意當另擬培元之法以佐之馬脾風極重險症危生倏忽姑與牛黃奪命散大黃生切四錢檳榔一錢五分黑牽牛三錢共研末分二服白蘿蔔汁調服詒按此古方也病情急重非此亦無法可挽或有痰熱壅甚者服越婢或麻杏甘石湯亦效音啞喘咳痰聲嗘咯風痰襲肺肺脹夾驚險候麻黃杏仁射干桔梗枳殼菖蒲前胡白前紫菀桑白皮另白蘿蔔汁沖服詒按此症風痰壅閉與喉科中馬脾風相類治之稍遲即不可救學者最宜留意痧後挾積移熱於大腸腹中熱痛每交寅卯二時則痛甚擬開肺金之郁仿丹溪論參越桃意良薑桔梗川連通草滑石黑梔查炭砂仁焦曲再診痧後腹痛甚於黎明陽氣為陰寒所遏欲升而不得升故痛甚於黎明也前用溫寒並進見效今仍以前法加減桂枝乾薑吳萸木香延胡香附查炭檳榔赤苓黑梔白蔻仁詒按此寒熱錯雜之症大抵熱為寒鬱故立方以寒熱互用奏功評選愛廬醫案二十四條上愛廬醫案若干條胥江張大曦仲華所著也仲華道光時人以醫術馳名江淛間原刻上下兩卷共一百餘案咸豐時刻於蘇州未幾毀於兵燹遂少傳本甲午夏詒於友人案頭得見抄本假歸讀之見其論病選藥思路深細用法精到頗能獨開生面發前人所未發惟刻意爭奇不肯稍涉平境因之議論有過於艱深者立方有流於織巧者竊念方藥之道動關性命非如詞章曲藝可以隨人好惡各自成家是必博稽精采慎所從達庶幾可法可師不致貽誤來學因就所抄本精選而加評焉共得二十四條令門人錄而存之後之學者苟由此而觸類旁通隨機應變不至如趙括之讀書也斯可矣光緒己亥七月柳寶詒識
